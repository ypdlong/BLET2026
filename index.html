ab their left wrist with your left hand and just above their left elbow with your right.\nTurn their palm up and pin it at your left hip.\nPush down above the elbow, step at about 45 degrees, pivot, and drop to your inside knee.\nThey go prone. Follow with handcuffing."},{"l":"cct","o":5,"t":"f","h":"Nerve strike targets","b":"Brachial plexus origin: side of the neck.\nRadial nerve: top of the forearm, about two inches below the elbow.\nCommon peroneal: outside of the thigh, 4–6 inches above the knee and 1–2 inches toward the back.\nFemoral: inside of the thigh, halfway between groin and knee.\nStrike through the target to create the “ripple effect.”"},{"l":"cct","o":5,"t":"q","q":"Where is the radial nerve strike point?","a":["Side of the neck","Top of the forearm, about 2 inches below the elbow","Outside of the thigh above the knee"],"c":1,"w":"Strike it with a knife hand, hammer fist, forearm or impact weapon."},{"l":"cct","o":5,"t":"q","q":"The purpose of nerve strikes is to…","a":["Cause permanent injury","Distract or stun so you can gain follow-up control","Punish resistance"],"c":1,"w":"Each strike technique’s objective is to distract or stun long enough for follow-up control."},{"l":"cct","o":5,"t":"f","h":"Multiple-officer takedown","b":"Move together on cue.\nThe officer giving commands goes HIGH, at the chest, arms or shoulders.\nThe other goes LOW, wrapping the knees tightly.\nTake the subject down under control to a prone handcuffing position.\nCommunication is everything. Extra officers secure the perimeter instead of piling on."},{"l":"cct","o":5,"t":"q","q":"In a two-officer takedown, who takes the HIGH position?","a":["The bigger officer","The officer giving commands","The newest officer"],"c":1,"w":"The command giver goes high and directs both the subject and the low officer."},{"l":"cct","o":7,"t":"f","h":"Weapon retention: in holster","b":"Trap the gun and push it into the holster. Drop your center of gravity.\nStanding: step in to close the gap and strike repeatedly until they let go; you can also strip their grip or sweep-strike their wrist.\nGround: trap their arm, use your hips to reverse position, and strike.\nStrikes are at maximum speed and power. Check the holster before disengaging."},{"l":"cct","o":7,"t":"f","h":"Weapon retention: drawn","b":"Two hands, tight grip.\nStep in hard and strike their wrists with your non-gun-side shoulder while pulling the gun toward your gun-side shoulder.\nFollow with a clearance elbow strike and step offline.\nThen tap and rack, since the struggle may have caused a malfunction.\nTraining partners grab with both thumbs pointing toward the officer to protect elbows."},{"l":"cct","o":7,"t":"q","q":"After a successful drawn-weapon retention, what should you do with your gun?","a":["Holster it immediately","Tap and rack","Unload it"],"c":1,"w":"The attempted disarm may have caused a malfunction."},{"l":"cct","o":7,"t":"f","h":"Weapon takeaway: front","b":"Grab the weapon and drive it down while blading your body out of the line of fire. Lean your weight onto it.\nStep in and strike hard and fast while keeping weight on the gun.\nSlide your hand along your body, grab the hammer or back of the slide, and rotate sharply 45 degrees to “break and take.”\nRetreat, take control, and tap and rack.\nYou’re racing their recognition of your movement, not the trigger."},{"l":"cct","o":6,"t":"f","h":"Hypoglossal pressure point","b":"Used for pain compliance on a passive-resistant subject.\nTarget: about one inch forward of the jaw angle and one inch under the jaw.\nUse the digital tip of the thumb or two unsupported middle fingers.\nApply counterpressure, give commands, then press toward the top of the head with touch (gradual) or accelerated (rapid) pressure.\nRelease once they comply."},{"l":"cct","o":6,"t":"f","h":"Mandibular angle pressure point","b":"Target: the base of the earlobe, between the mastoid and the mandible. It affects the hypoglossal, vagus and glossopharyngeal nerves.\nUse the digital tip of the thumb with touch pressure toward the center of the head and slightly toward the nose.\nGive commands, release on compliance, and stay ready to reapply."},{"l":"cct","o":6,"t":"q","q":"You apply a pressure point and the subject seems unaffected. Next step?","a":["Press harder until they comply","Consider transitioning to other force options","End the contact"],"c":1,"w":"Pressure points don’t work on everyone. If there’s no compliance, transition to another reasonable option."},{"l":"cct","o":5,"t":"f","h":"Skills testing rules","b":"All techniques on the form are tested in one session, smooth, fluid and continuous, with no help.\nFour groups: Handcuffing/Searching, Ground, Standing, and Quick Take/Pressure Point.\nEach group allows two unsatisfactory techniques.\nFailing earns one remediation and retest per technique, with School Director approval. Retests use the original standard."},{"l":"cct","o":5,"t":"q","q":"How many unsatisfactory techniques are allowed per testing group?","a":["One","Two","Three"],"c":1,"w":"Two per group. Example: three unsatisfactory in Group I, then two still unsatisfactory after remediation, still passes."},{"l":"cct","o":5,"t":"f","h":"Scenario evaluation categories","b":"1. Presence and communication\n2. Use of force\n3. Techniques and tactics\n4. Officer safety\n5. Legal considerations\n6. After actions: request EMS, give aid, get the subject out of prone to prevent positional asphyxia, intervene when needed"},{"l":"cct","o":2,"t":"s","q":"Scenario: A man on a public sidewalk is photographing your police station and you, asking pointed questions for his anti-police page. No threats, no aggression. What’s the right outcome?","a":["Detain him for suspicious activity","Order him to leave the sidewalk","Communicate professionally; no force and no arrest"],"c":2,"w":"This is the “No Action” scenario. Recording in public is protected, and nothing justifies force or arrest."},{"l":"cct","o":1,"t":"s","q":"Scenario: You arrive as backup. The first officer is exhausted, failing to pull a prone, nonviolent suspect’s arm free. After the arrest, the first officer starts striking the handcuffed suspect. What do you do?","a":["Nothing, it’s their arrest","Step in to stop it and report it","Report it only if asked"],"c":1,"w":"Take charge of control earlier (non-compliant prone handcuffing), then intervene and report within 72 hours."},{"l":"cct","o":5,"t":"s","q":"Scenario: A shoplifting suspect is polite but keeps walking away, saying “You have the wrong person,” and drops one of the reported stolen items. What’s this testing?","a":["Deadly force decisions","Recognizing false compliance and deciding when and if to use force","Miranda"],"c":1,"w":"Scenario Three, “False Compliance.” The role player only offers passive or defensive resistance."},{"l":"assc","o":7,"t":"s","q":"A homicide suspect is escorted home by two officers. One tells the other, “Stay with him and don’t let him change clothes or wash.” They question him there and he confesses. Was he in custody?","a":["No, he was in his own home","Yes","Only if handcuffed"],"c":1,"w":"Hearing that order, a reasonable person would believe his freedom was restrained to the degree of an arrest, even at home."},{"l":"assc","o":7,"t":"s","q":"A suspect agrees to ride to the station, is told he’s free to leave, gets bathroom and smoke breaks, and confesses after two hours. Was he in custody?","a":["Yes, the station is always custody","No","Yes, two hours is too long"],"c":1,"w":"State v. Sanders: questioning at the station isn’t automatically custodial. The circumstances here showed he wasn’t restrained like an arrestee."},{"l":"assc","o":7,"t":"q","q":"Officers deliberately question an in-custody suspect without warnings, get a confession, then read Miranda and get the same confession again. Result?","a":["The second confession is admissible","Both are inadmissible","Both are admissible"],"c":1,"w":"Missouri v. Seibert: intentionally skipping warnings to get a confession, then repeating it after warnings, taints both."},{"l":"assc","o":7,"t":"s","q":"Halfway through Miranda, the suspect says, “I’m not going to say anything.” The officer says, “Let me finish,” then asks, “Do you even know why you’re under arrest?” The suspect talks. Admissible?","a":["Yes, warnings weren’t finished so he couldn’t invoke","No, his clear invocation wasn’t scrupulously honored","Yes, the officer re-read the warnings"],"c":1,"w":"A clear invocation counts even before the warnings are finished. Officers had to stop."},{"l":"assc","o":7,"t":"q","q":"A suspect invoked only his right to silence. Two hours later, a different officer gives fresh warnings and asks about an unrelated robbery. The suspect waives and confesses. Admissible?","a":["No, silence bars all questioning","Yes, the invocation was scrupulously honored","Only with a lawyer present"],"c":1,"w":"Michigan v. Mosley. Compare: after a request for a lawyer, officers can’t re-approach while custody continues."},{"l":"assc","o":7,"t":"q","q":"You didn’t make the arrest but want to interrogate the arrestee. What must you check first?","a":["Nothing, Miranda is per officer","Whether he already invoked his right to counsel","Only whether he’s been booked"],"c":1,"w":"An invocation of counsel binds every officer, even from another agency and on a different offense, while custody continues. Ask the arresting officer or check the file."},{"l":"assc","o":7,"t":"q","q":"A suspect wants to talk, but his attorney objects. Can the suspect validly waive?","a":["No, the attorney decides","Yes, if knowing, voluntary and intelligent","Only in writing"],"c":1,"w":"The attorney can advise, but the decision belongs to the client."},{"l":"assc","o":7,"t":"q","q":"A deaf person is arrested. No qualified interpreter is present during questioning. The statements are…","a":["Admissible if written","Not admissible for any purpose","Admissible for impeachment only"],"c":1,"w":"Get a qualified interpreter immediately. An arrestee otherwise eligible for release can’t be held waiting for one."},{"l":"assc","o":7,"t":"q","q":"A man is indicted for burglary and has a lawyer. Officers question him, out of custody, about two uncharged murders from the same night. His confession is…","a":["Suppressed, he has counsel","Admissible, the Sixth Amendment is offense-specific","Admissible only with counsel present"],"c":1,"w":"Texas v. Cobb. The Sixth Amendment covers only the charged offense."},{"l":"assc","o":7,"t":"q","q":"A jailhouse informant working for police asks an indicted defendant questions about the charged robbery. The answers are…","a":["Admissible, he isn’t an officer","Suppressed under the Massiah rule","Admissible if recorded"],"c":1,"w":"Agents can’t deliberately elicit statements about a charged offense. They can only listen, or ask about unrelated, uncharged crimes."},{"l":"assc","o":7,"t":"q","q":"A suspect confesses while you’re in the middle of reading Miranda warnings. The statement is…","a":["Inadmissible, warnings weren’t finished","Admissible as spontaneous","Admissible only if repeated"],"c":1,"w":"State v. Edgerton: a spontaneous statement isn’t the product of interrogation."},{"l":"assc","o":7,"t":"q","q":"A suspect hears the warnings, never says “I waive,” sits mostly silent for almost three hours, then answers a question and confesses. Valid?","a":["No, silence is invocation","Yes, an implied waiver","No, waivers must be written"],"c":1,"w":"Berghuis v. Thompkins: he understood his rights and chose to talk. Silence alone isn’t an invocation."},{"l":"assc","o":7,"t":"q","q":"A 15-year-old is in custody at the police station for shoplifting. Must the interrogation be electronically recorded?","a":["No, it’s a misdemeanor","Yes, all juvenile custodial interrogations at a place of detention","Only if a parent asks"],"c":1,"w":"For juveniles the recording requirement applies regardless of how serious the crime is."},{"l":"assc","o":7,"t":"q","q":"Store security, at your request, questions a shoplifting arrestee who already asked you for a lawyer. The statement is…","a":["Admissible, security isn’t police","Suppressed, they acted as your agents","Admissible if security reads Miranda"],"c":1,"w":"Officers can’t use civilians as agents to get around an invocation."},{"l":"assc","o":10,"t":"s","q":"At 1 a.m., a deputy with five years on that beat sees John, known for car break-ins, near a vacant car. John runs when he sees the patrol car. Reasonable suspicion?","a":["No, flight alone isn’t enough","Yes","Only if John is on probation"],"c":1,"w":"Time of day, the officer’s experience, John’s relevant record and flight together add up."},{"l":"assc","o":10,"t":"s","q":"At 8 p.m., an officer sees a man carrying a duffle bag near a closed auto parts store. Nothing else. What can she do?","a":["Stop and frisk him","Make a Terry stop","Start a voluntary encounter"],"c":2,"w":"There’s no articulable reason to suspect crime. Talk to him voluntarily."},{"l":"assc","o":10,"t":"q","q":"An officer shoots at a fleeing suspect, hits him, and the suspect escapes. Was he seized?","a":["No, he got away","Yes, intentional force that touches the person is a seizure","Only if caught later"],"c":1,"w":"Torres v. Madrid (2021): a seizure by force happens when force is applied, even if the person escapes."},{"l":"assc","o":10,"t":"q","q":"During a Terry stop, without probable cause, you take the suspect to the station to continue investigating. This is…","a":["Fine if under 20 minutes","An unreasonable seizure that functions as an arrest","Fine with handcuffs off"],"c":1,"w":"Moving a detainee against his will without strong justification like safety turns it into an arrest that needs probable cause."},{"l":"assc","o":10,"t":"q","q":"You stop a car reasonably believing the registered owner, who is revoked, is driving. It turns out to be someone else. The stop is…","a":["Automatically unlawful","Still reasonable, a reasonable mistake of fact","Lawful only if you knew the owner"],"c":1,"w":"Objectively reasonable mistakes of fact, and of genuinely unclear law, can still support a stop. Not keeping up with changes in the law isn’t a reasonable mistake."},{"l":"assc","o":10,"t":"q","q":"A lawfully stopped suspect, reasonably believed armed, has a backpack. You may…","a":["Open it and search everything","Frisk the outside and retrieve any object that feels like a weapon","Never touch it"],"c":1,"w":"You can’t open or empty it during a frisk. You can always ask for consent."},{"l":"assc","o":10,"t":"s","q":"With reasonable suspicion Jack is selling drugs, an officer frisks him and immediately recognizes two small hard vials in his pocket as drug containers, without manipulating them. Lawful frisk? Lawful seizure?","a":["No and no","Yes and yes","Yes frisk, no seizure"],"c":1,"w":"Drug dealing supports a frisk, and the vials were immediately apparent contraband under plain feel."},{"l":"assc","o":14,"t":"s","q":"On a knock and talk, the officer asks “What’s back there?” and walks around to the side porch, finding heroin hidden by a woodpile. Lawful?","a":["Yes, knock-and-talk covers the property","No, that went beyond the front-door route into curtilage","Yes, it was in plain view"],"c":1,"w":"A knock and talk only allows the normal approach to the front door."},{"l":"assc","o":14,"t":"s","q":"A suspect sits on a park bench for an hour, then leaves the park, leaving a paper bag behind. Deputies take it and find heroin. Lawful?","a":["No, they needed a warrant","Yes, he abandoned it","Only with his consent"],"c":1,"w":"He left it in a public place and left. If he’d just stepped away from the bench, abandonment would be unclear; ask him if it’s his."},{"l":"assc","o":14,"t":"s","q":"A deputy finds a naked toddler on the roadside, takes the child home, knocks, gets no answer, and goes in through the ajar door. The father is asleep next to heroin on the table. Lawful entry? Can the heroin be seized?","a":["No and no","Yes and yes","Yes, but the heroin can’t be seized"],"c":1,"w":"Entering to check whether someone needed immediate help was lawful, and the drugs were in plain view."},{"l":"assc","o":14,"t":"s","q":"Officers arrest Amy at her apartment door on a warrant. She asks to get clothes from her bedroom; an officer follows and sees a pistol in an open drawer. Can it be seized?","a":["No, she was arrested outside","Yes, it was seen during the arrest process","Only with a search warrant"],"c":1,"w":"Following an arrestee who chooses to go elsewhere is lawful, and the gun was in plain view."},{"l":"assc","o":14,"t":"s","q":"Officers with probable cause tell a homeowner they’ll apply for a warrant if he won’t consent. He reluctantly agrees out loud but won’t sign anything. Voluntary consent?","a":["No, it was coerced","Yes","Only if they actually had a warrant"],"c":1,"w":"Saying you’ll apply for a warrant you can legally get is fine. Claiming you already have one would make consent invalid. Written consent isn’t required."},{"l":"assc","o":14,"t":"q","q":"Two co-occupants answer the door. One consents to a search; the other refuses. Can you search on consent?","a":["Yes, one consent is enough","No","Yes, if the consenting person owns it"],"c":1,"w":"A present, objecting co-occupant overrides the other’s consent. If the objector is lawfully arrested or leaves, the remaining occupant can consent later."},{"l":"assc","o":14,"t":"q","q":"A homeowner consents to a search of the house. May you open his overnight guest’s suitcase in the guest room?","a":["Yes, he owns the house","No, not without the guest’s consent, a warrant or exigency","Yes, if it’s unlocked"],"c":1,"w":"Areas set aside for a guest’s exclusive use, like their belongings, need the guest’s own consent."},{"l":"assc","o":14,"t":"q","q":"An officer climbs a porch, leans over a couch, and peers through a three-inch gap in a window to see a suspect counting money. This is…","a":["Plain view","An unlawful search","Allowed for robbery cases"],"c":1,"w":"The small gap wasn’t open to public view, so looking through it invaded the suspect’s privacy."},{"l":"assc","o":14,"t":"q","q":"You decide to write a citation, not arrest, for a misdemeanor. Can you search the person incident to that?","a":["Yes, always","No","Only their pockets"],"c":1,"w":"There’s no search incident to a citation. You need a custodial arrest."},{"l":"assc","o":14,"t":"q","q":"A suspect is handcuffed and subdued. His backpack sits nearby. Under U.S. v. Davis (4th Cir.), can you search it incident to arrest?","a":["Yes, it’s in his area","Only with reason to believe it holds evidence of the arrest crime","Never"],"c":1,"w":"The Fourth Circuit, which covers N.C., limits searching items near a secured arrestee."},{"l":"assc","o":14,"t":"q","q":"Four days after a murder, officers enter the suspect’s home without a warrant, citing exigency. A court will likely find…","a":["Valid exigency","No exigency","Valid because murder is serious"],"c":1,"w":"Exigency means a real, immediate need. Four days gave plenty of time to get a warrant."},{"l":"assc","o":14,"t":"q","q":"During a consent search, the owner says, “I want you to stop searching now.” Your partner keeps going and finds drugs. What’s right?","a":["Keep going; consent was given","Stop the search; consent can be withdrawn at any time","Finish the current room"],"c":1,"w":"The evidence after withdrawal would be suppressed. You also have a duty to intervene in a fellow officer’s unlawful conduct."},{"l":"assc","o":14,"t":"q","q":"A plane flies over a property at 500 feet, descends to 200 feet, and officers see marijuana with the naked eye. Flights there are routine. Was this a search?","a":["Yes, it needed a warrant","No, it was from lawful navigable airspace","Only if a camera was used"],"c":1,"w":"Aircraft surveillance from lawful airspace with the unaided eye isn’t a search."},{"l":"assc","o":14,"t":"q","q":"A “strip search” happens when…","a":["Any clothing is removed","The last layer of clothing is moved, exposing an intimate area","Shoes and belt are removed"],"c":1,"w":"It doesn’t need full removal. It requires probable cause that a weapon or evidence is concealed there."},{"l":"mvl","o":1,"t":"f","h":"Vehicle vs. motor vehicle","b":"Vehicle: any device that carries people or property on a highway, except human-powered devices and rail. Bicycles and e-bikes are treated as vehicles.\nMotor vehicle: self-propelled, or designed to be pulled by something self-propelled. Electric cars, golf carts, and trailers or mobile homes being towed count. A car with its engine removed still counts.\nMopeds and electric-assisted bicycles are not motor vehicles. A motor-driven bicycle is."},{"l":"mvl","o":1,"t":"q","q":"Is a moped a “motor vehicle” under Chapter 20?","a":["Yes","No, unless a statute says otherwise","Only over 30 mph"],"c":1,"w":"Mopeds (no external shifting, 50 cc or less, can’t exceed 30 mph on level ground) are vehicles but excluded from “motor vehicle.” Know whether a law covers all vehicles or only motor vehicles."},{"l":"mvl","o":1,"t":"q","q":"A car’s gasoline engine has been removed. Under Chapter 20 it is…","a":["No longer a motor vehicle","Still a motor vehicle, because its design hasn’t changed","A trailer"],"c":1,"w":"Whether the power source is working doesn’t matter."},{"l":"mvl","o":1,"t":"f","h":"Operator","b":"The person in actual physical control of a vehicle that is moving or has its engine running. “Operator” and “driver” mean the same thing.\nCircumstantial evidence can prove it, like being passed out behind the wheel, or being the only injured person at a crash scene."},{"l":"mvl","o":1,"t":"f","h":"Highway or street","b":"The two terms mean the same thing. It’s the entire width between right-of-way lines of any way open to the public as a matter of right for vehicles. That includes sidewalks, ditches and shoulders.\nRoads under construction, or private roads not open as a matter of right, are not highways. They may be public vehicular areas."},{"l":"mvl","o":1,"t":"f","h":"Public vehicular area (PVA)","b":"Areas the public uses for vehicle traffic, such as:\n– Lots and drives at hospitals, schools, churches, colleges and state facilities\n– Business or residential parking, open or closed\n– Beaches used by vehicles\n– Roads in gated or non-gated subdivisions\n– Federal property under N.C. jurisdiction\n– Fields used for event parking at that time, and the strip between a store’s front and its lot"},{"l":"mvl","o":1,"t":"q","q":"A road inside a gated subdivision that was never dedicated to the public is…","a":["Private property, no traffic laws apply","A public vehicular area","A highway"],"c":1,"w":"Subdivision roads are PVAs whether or not they’re gated or dedicated."},{"l":"mvl","o":1,"t":"f","h":"Infractions","b":"A noncriminal violation, not punishable by imprisonment, with a penalty of $100 or less. You can’t arrest for an infraction; cite or get a criminal summons.\nNonresident Violator Compact: drivers from member states sign the citation and go. States not in the compact are Alaska, California, Michigan, Montana, Oregon and Wisconsin. Those drivers can be taken to a magistrate to post bond."},{"l":"mvl","o":1,"t":"q","q":"A Wisconsin driver commits a speeding infraction in N.C. You may…","a":["Only issue a citation","Take them before a magistrate to post bond","Arrest and jail them"],"c":1,"w":"Wisconsin isn’t in the Nonresident Violator Compact, so the infraction can be handled like a misdemeanor with bond."},{"l":"mvl","o":2,"t":"f","h":"Where you need a license","b":"License and permit requirements apply only to motor vehicles on a street or highway, not on a PVA or private property.\nDrivers must show their license or permit when asked by a uniformed officer.\nAn International Driving Permit isn’t valid on its own. Ask for the home-country license."},{"l":"mvl","o":2,"t":"f","h":"Level 1: limited learner’s permit","b":"Ages 15 to 17; expires at 18.\n– Permit in possession\n– Supervising driver in the front seat: a parent, grandparent, guardian, or approved person licensed at least five years\n– No one else in the front seat\n– First six months: driving only 5 a.m. to 9 p.m.\n– Everyone belted\n– No mobile phone while moving, except emergencies"},{"l":"mvl","o":2,"t":"f","h":"Level 2: limited provisional license","b":"Ages 16 to 17, after nine months on a Level 1 permit with no recent moving, seat belt or phone convictions.\nUnsupervised driving only 5 a.m. to 9 p.m., directly to or from work, or to volunteer fire, rescue or EMS activities as a member.\nWithout a supervisor, no more than one passenger under 21 who isn’t family or household (students going to or from school excepted).\nAnytime with a supervising driver in front. Everyone belted. No phone."},{"l":"mvl","o":2,"t":"s","q":"At 10:30 p.m., a 16-year-old with a Level 2 limited provisional license is driving home alone from a movie. Violation?","a":["No, Level 2 allows night driving","Yes, unsupervised driving is limited to 5 a.m. to 9 p.m. except work or volunteer emergency service","Only if passengers are present"],"c":1,"w":"A movie isn’t one of the exceptions."},{"l":"mvl","o":2,"t":"q","q":"What restriction remains on a full provisional license?","a":["Curfew","Passenger limits","No mobile phone use while driving, except emergencies"],"c":2,"w":"It requires six months on Level 2. Level 1 and 2 restrictions drop off except the phone rule."},{"l":"mvl","o":2,"t":"f","h":"Who doesn’t need an N.C. license","b":"– Anyone driving a U.S. Armed Forces vehicle on duty\n– Road machines, farm tractors and implements of husbandry temporarily on a highway\n– Moped riders 16 or older\n– Nonresidents 16 or older with a valid home license, following its restrictions (includes military spouses here on orders)"},{"l":"mvl","o":2,"t":"f","h":"Residency","b":"Living in N.C. more than six months for other than a temporary purpose creates a presumption of residency. Registering to vote here makes you a resident.\nNew residents may drive on an out-of-state license for 60 days. CDL holders must get an N.C. CDL within 30 days."},{"l":"mvl","o":2,"t":"f","h":"Revocation, disqualification, LDP","b":"Revocation and suspension mean the same thing.\nDisqualification ends commercial driving privileges only. Every revocation also disqualifies.\nA limited driving privilege (LDP) is a court order from a judge, not DMV, allowing driving during a revocation within set limits. Driving outside an LDP’s limits is DWLR."},{"l":"mvl","o":2,"t":"f","h":"NOL or DWLR?","b":"DWLR: driving a motor vehicle on a highway knowing your N.C. license or privilege was revoked by N.C. DMV.\nCharge NOL instead when:\n– A nonresident’s home state revoked them, but N.C. didn’t\n– The revocation period ended but the reinstatement fee wasn’t paid\n– They’re violating a license restriction (but ignition-interlock restrictions 20, 22 and 23, and LDP violations, are DWLR)"},{"l":"mvl","o":2,"t":"q","q":"A Virginia driver’s license was revoked by Virginia. N.C. DMV has taken no action. The correct N.C. charge is…","a":["DWLR","No operator’s license (NOL)","Driving after notification"],"c":1,"w":"N.C. can’t charge DWLR unless N.C. DMV revoked the privilege."},{"l":"mvl","o":2,"t":"q","q":"A driver’s revocation period ended last month, but they never paid the reinstatement fee. Charge?","a":["DWLR","NOL","Infraction only"],"c":1,"w":"Once the revocation period expires, an unpaid fee makes them unlicensed, not revoked."},{"l":"mvl","o":2,"t":"q","q":"A driver whose license restriction requires an ignition interlock (code 20, 22 or 23) drives a car without one. Charge?","a":["NOL","DWLR","Equipment infraction"],"c":1,"w":"That’s one of the two exceptions to the “restriction violation equals NOL” rule. The other is driving outside an LDP."},{"l":"mvl","o":2,"t":"q","q":"A DMV revocation notice sent by mail is presumed received after how many days?","a":["2","4","10"],"c":1,"w":"Knowledge is an element of DWLR. A conviction requiring surrender also counts as notice, and asking the driver whether they knew can establish it."},{"l":"mvl","o":2,"t":"f","h":"License points","b":"12 points in three years can lead to revocation. Points come only from N.C. convictions.\n5 points: passing a stopped school bus, aggressive driving.\n4 points: reckless driving, hit-and-run (property only), following too closely, wrong side of the road, illegal passing.\n3 points: stop sign, red light, speeding over 55, no license, no insurance.\n2 points: child restraint violation and all other moving violations."},{"l":"mvl","o":2,"t":"q","q":"How many license points for passing a stopped school bus?","a":["3","4","5"],"c":2,"w":"Five, the same as aggressive driving."},{"l":"mvl","o":2,"t":"q","q":"A licensed driver moves. How long to get a license showing the new address?","a":["30 days","60 days","90 days"],"c":1,"w":"60 days for name or address changes on licenses and special ID cards. Vehicle owners also have 60 days to notify DMV."},{"l":"mvl","o":3,"t":"f","h":"Plates and registration cards","b":"A current plate goes on the rear (front and back if the state issues two), horizontal and upright. A plate in the rear window is unlawful.\nThe registration card must be in the vehicle and shown on demand.\nRegistration expires the last day of the month on the sticker, but driving is lawful through the 15th of the next month. There is no grace period for inspection.\nRegistration and insurance violations are misdemeanors, not infractions."},{"l":"mvl","o":3,"t":"f","h":"Temporary and dealer plates","b":"Temporary paper plates are valid 60 days and aren’t in the DMV database. The issuing dealer shows on the sale paperwork.\nDealer plates only on dealer inventory driven by authorized people. A demonstration permit allows test-driving for 96 hours, renewable once. Unauthorized use is an infraction; tell DMV."},{"l":"mvl","o":3,"t":"q","q":"You seize a revoked registration plate. You must report it to DMV within…","a":["24 hours","48 hours","10 days"],"c":1,"w":"Report within 48 hours and return the plate (not fictitious ones) to an official DMV office within 10 business days."},{"l":"mvl","o":3,"t":"q","q":"An owner sells a car and wants to move its plate to another car they own in the same category. How long do they have?","a":["10 days","20 days","30 days"],"c":1,"w":"20 days from when the plate was last used on the old car. Transfers can take up to 30 days to appear in the system, so use discretion."},{"l":"mvl","o":3,"t":"q","q":"DMV records show an “insurance stop” on a vehicle you stop. You may…","a":["Do nothing; insurance is civil","Take enforcement action and seize the revoked registration card and plate","Only warn the driver"],"c":1,"w":"An owner who doesn’t return a revoked plate and card after notice commits a Class 2 misdemeanor."},{"l":"mvl","o":4,"t":"f","h":"Equipment by the numbers","b":"Horn: heard at 200 feet.\nTurn signals: visible front and rear at 200 feet.\nTag light: white, plate readable at 50 feet.\nBrake lights: red or amber, visible at 100 feet; two required on vehicles made after 1970.\nHeadlights on: sunset to sunrise, when you can’t see a person at 400 feet, and when wipers are in use and you can’t see a person at 500 feet.\nDim within 200 feet of an oncoming or followed vehicle."},{"l":"mvl","o":4,"t":"q","q":"An out-of-state car has no exterior driver’s-side mirror. Can you stop it for that?","a":["Yes","No, the requirement applies only to N.C.-registered vehicles","Only at night"],"c":1,"w":"An interior rearview mirror is required for all vehicles."},{"l":"mvl","o":4,"t":"f","h":"Window tint","b":"Windshield: tint only down to 5 inches from the top or the AS1 line, whichever is longer. No exceptions.\nOther windows: at least 35% light transmission (a meter reading over 32% is conclusively compliant), reflectance 20% or less, and no red, yellow or amber.\nExempt: limousines, ambulances, motor homes, law enforcement vehicles, rear window of property-haulers, and out-of-state vehicles compliant with their state’s law.\nIt’s a defense if the tint is removed within 15 days."},{"l":"mvl","o":4,"t":"q","q":"Your approved tint meter reads 33% on a side window of an N.C. car. The window is…","a":["Illegal, under 35%","Conclusively presumed legal","Legal only with a medical exemption"],"c":1,"w":"A reading over 32% is conclusively presumed to meet the 35% standard."},{"l":"mvl","o":4,"t":"f","h":"Tires and other equipment","b":"Unsafe tires: exposed cord, tread separation, or less than 2/32 inch tread (or wear bars touching) at two or more spots in adjacent grooves. Studs over 1/16 inch are prohibited.\nTwo independent ways to apply brakes.\nWorking speedometer, steering, wipers, and muffler (no cut-outs).\nNo video screen visible to the driver in front of the driver’s seat, except navigation or official use.\nAltered height: front fender 4 or more inches higher than the rear is unlawful."},{"l":"mvl","o":4,"t":"f","h":"Loads","b":"Secure every load. Trucks over 7,500 lb GVWR hauling stone or gravel need a tarp.\nLoad extending over 4 feet past the rear: red or orange flag at least 18 inches square by day, red or amber light visible at 200 feet at night. Never more than 14 feet past the bed (except forestry products and utility poles).\nNo more than 3 feet past the front.\nPassenger vehicles: nothing past the left fenders, no more than 6 inches past the right."},{"l":"mvl","o":4,"t":"q","q":"A pickup’s load extends 5 feet past the rear in daylight. What’s required?","a":["Nothing under 14 feet","A red or orange flag at least 18 inches square","A tarp"],"c":1,"w":"Over 4 feet needs the flag by day and a red or amber light at night."},{"l":"mvl","o":4,"t":"f","h":"Inspection","b":"Operating a vehicle required to be registered in N.C. without a current inspection is an infraction.\nInspect within 90 days before the registration expires.\nHistoric vehicles and school buses are exempt from safety inspection. Diesel vehicles and motorcycles are exempt from emissions.\nForging or possessing a forged inspection sticker or authorization is a felony."},{"l":"mvl","o":5,"t":"f","h":"Child restraints (§ 20-137.1)","b":"The driver must have every passenger under 16 secured in a proper child restraint or seat belt. It’s an infraction against the driver, one citation regardless of how many kids, and it applies everywhere, even private property.\nUnder 8 and under 80 lb: weight-appropriate child restraint.\nUnder 5 and under 40 lb with an active passenger airbag: rear seat if there is one."},{"l":"mvl","o":5,"t":"f","h":"Seat belts (§ 20-135.2A)","b":"Applies to drivers and anyone 16 or older, front or back, in forward motion on a street or highway (not a PVA). The unbelted person 16 or older gets the citation.\nAn unbelted rear-seat passenger alone isn’t grounds to stop a vehicle.\nExempt include: medical conditions, certified phobia, rural mail carriers and newspaper carriers on route, stop-and-go deliveries under 20 mph, prisoners in a patrol car’s back seat, garbage truck riders on rounds."},{"l":"mvl","o":5,"t":"q","q":"A 14-year-old is unbelted in the back seat. Who gets charged, and under what law?","a":["The 14-year-old, seat belt law","The driver, child restraint law","The driver, seat belt law"],"c":1,"w":"Passengers under 16 are the driver’s responsibility under § 20-137.1. The child isn’t charged."},{"l":"mvl","o":5,"t":"q","q":"The only violation you see is an adult rear-seat passenger without a seat belt. Can you stop the car?","a":["Yes","No","Only at night"],"c":1,"w":"Rear-seat belt enforcement is secondary. You need another violation to stop."},{"l":"mvl","o":5,"t":"f","h":"Kids in a pickup bed","b":"Transporting a child under 16 in an open bed or cargo area is an infraction by the driver, statewide.\nExceptions: an adult supervising in the bed, the child belted with a proper belt, an emergency, a parade, or agricultural work."},{"l":"mvl","o":6,"t":"f","h":"Phones while driving","b":"Under 18: no mobile phone use at all while moving on a street, highway or PVA (except calls to a parent, guardian, spouse or emergency services). Infraction.\nAll drivers: no manually texting or reading texts or email while moving. Infraction, but a Class 2 misdemeanor in a school bus.\nSchool bus drivers: no phone use at all while moving. Misdemeanor.\nCommercial vehicles: hands-free only."},{"l":"mvl","o":6,"t":"f","h":"Red lights and stop signs","b":"Come to a complete stop and yield.\nRight on red is allowed after a full stop unless posted, yielding to pedestrians and traffic.\nMotorcycles and farm equipment may proceed after waiting three minutes at a red light if nothing is coming.\nA flashing red light is a stop sign: you must both stop and yield.\nThese rules apply on streets and highways, plus signals or signs controlling entry between a PVA and a highway."},{"l":"mvl","o":6,"t":"f","h":"Signaling and turns","b":"Signal at least 100 feet before turning, or 200 feet in a 45 mph or higher zone.\nIt’s a violation only if another vehicle or pedestrian may be affected, and that can be your patrol car. A car three or four lengths away may not be affected.\nNo signal needed at a T-intersection with only one legal turn.\nRight turns as close as practicable to the right curb; left turns from the leftmost lane."},{"l":"mvl","o":6,"t":"q","q":"A driver stops at a T-intersection where only a right turn is legal and turns without signaling. Violation?","a":["Yes, always signal","No, there’s only one lawful turn","Only if you were behind them"],"c":1,"w":"A failure to signal is a violation only when it may affect other traffic."},{"l":"mvl","o":6,"t":"f","h":"Parking on highways","b":"Parking is mostly local ordinance. Under state law:\n– No parking on the main traveled portion of a highway posted under 45 mph unless the vehicle is disabled (garbage trucks collecting excepted).\n– Shoulder parking only if visible for 200 feet both ways and not blocking traffic.\nBriefly stopping for a necessary purpose isn’t parking."},{"l":"cde","o":1,"t":"f","h":"Five parts of emotional intelligence","b":"1. Self-awareness: recognizing your emotions as they happen. “What do I see in myself?”\n2. Self-regulation: managing those emotions and adapting. “What do I do with myself?”\n3. Motivation: passion for the work beyond money or status.\n4. Empathy: understanding others’ emotions and treating them accordingly. “What do I see and hear in others?”\n5. Social skills: building rapport and resolving conflict. “What do I do?”"},{"l":"cde","o":1,"t":"q","q":"A driver curses at Officer Jones the whole stop. Jones notices he’s getting angry and makes a deliberate effort to stay calm and professional. Which component is he showing?","a":["Motivation","Self-awareness only","Self-regulation"],"c":2,"w":"Recognizing the anger is self-awareness; managing it in the moment is self-regulation. They’re separate skills: you can recognize anger and still lose control."},{"l":"cde","o":1,"t":"q","q":"Officer Smith knows he tends to get angry when someone insults him. That knowledge reflects…","a":["Self-awareness","Self-regulation","Social skills"],"c":0,"w":"Self-aware officers know their emotional triggers. What they do about them is self-regulation."},{"l":"cde","o":1,"t":"q","q":"“John, I heard you say you’re tired of people ignoring you. You seem very upset. Can you tell me more?” This shows…","a":["Motivation","Empathy","Self-regulation"],"c":1,"w":"Empathy means understanding someone’s emotional makeup and responding to it."},{"l":"cde","o":2,"t":"f","h":"DISC personality styles","b":"Dominance (action + task): values results, fears losing control. Get to the point, condense options, be confident.\nInfluence (action + people): values relationships, fears rejection. Be friendly and enthusiastic; connect personally.\nSteadiness (people + thought): values stability, fears change. Show you care, give time to process, plan for changes.\nConscientiousness (thought + task): values accuracy, fears criticism. Use facts, be specific, listen to concerns."},{"l":"cde","o":2,"t":"q","q":"A direct, results-driven person wants the bottom line. To communicate well, you should…","a":["Spend time socializing first","Get to the point and condense the options","Offer multiple choices to consider"],"c":1,"w":"That’s a D-style. Socializing and offering many options are on the “don’t” list for dominant personalities."},{"l":"cde","o":2,"t":"q","q":"A cooperative, even-tempered person seems uneasy about a sudden change. With this S-style, you should…","a":["Push for a quick decision","Be demanding so they know it’s serious","Give them time to process and explain what will change"],"c":2,"w":"Steadiness personalities fear change and are motivated by safety and security."},{"l":"cde","o":2,"t":"q","q":"A precise, analytical person who fears criticism is most likely which style, and what works best?","a":["Influence, connect personally","Conscientiousness, use facts and be specific","Dominance, focus on results"],"c":1,"w":"With C-styles, avoid generalities and don’t focus on feelings."},{"l":"cde","o":2,"t":"q","q":"An outgoing, optimistic person who enjoys recognition is an I-style. Which approach fits?","a":["Be formal and focus on business","Be indifferent and brief","Be friendly and connect on a personal level"],"c":2,"w":"Influence personalities value relationships and fear rejection."},{"l":"cde","o":3,"t":"f","h":"Clear, concise, consistent, captivating","b":"Explain what you’re doing and why in the first few minutes. It supports procedural justice.\nClear: everyday words, no jargon or slang.\nConcise: short sentences, no filler words.\nConsistent: if someone seems confused, repeat the message word for word first, or ask “Was that clear?” Rewording right away often adds confusion.\nUse “I” statements and address adults as Sir, Ma’am, or Mr./Mrs. [Name]."},{"l":"cde","o":3,"t":"q","q":"Someone looks confused after your instruction. What should you do first?","a":["Repeat the message word for word or ask if it was clear","Explain it again using different words","Say it louder"],"c":0,"w":"Repeating with different words often creates more confusion. Repeat verbatim first or check for understanding."},{"l":"cde","o":3,"t":"f","h":"Proxemics: four distances","b":"Intimate: 0 to 18 inches (family, partners).\nPersonal: 3 to 4 feet (friends, co-workers).\nModerate: 18 inches to 4 feet (impersonal business; close enough for a gentle touch on the arm).\nConversation: 4 to 6 feet, just beyond physical reach with nothing between you.\nIncreasing distance in a crisis can lower anxiety and gives you more reaction time."},{"l":"cde","o":3,"t":"q","q":"What’s the “conversation” distance in proxemics?","a":["0 to 18 inches","4 to 6 feet","10 to 12 feet"],"c":1,"w":"Just beyond physical reach, with no obstructions between the people talking."},{"l":"cde","o":3,"t":"f","h":"Voice and body language","b":"Of what a listener processes: words are 7–10%, voice 33–40%, and body language 50–60%.\nGood communicators average about 3.5 words per second. Fast talkers can seem anxious or untruthful; slow talkers can seem unsure.\nLowering your volume calms. A loud voice can seem aggressive.\nOpen posture: open hands, leaning in, eye level. Closed: crossed arms, hands in pockets, looking away.\nRemove sunglasses. Intermittent eye contact works; prolonged staring reads as aggression."},{"l":"cde","o":3,"t":"q","q":"Which part of a message does the listener process most?","a":["The actual words","Tone of voice","Body language"],"c":2,"w":"Body language is 50–60%, voice 33–40%, words only 7–10%. When body language and words don’t match, people believe the body language."},{"l":"cde","o":3,"t":"q","q":"You want someone to keep talking. Which head movement helps?","a":["An occasional single nod","Rapid successive nods","No movement at all"],"c":0,"w":"A single nod now and then encourages more; repeated nods tend to make people stop."},{"l":"cde","o":3,"t":"f","h":"Eight active listening skills","b":"– Attending: open posture, eye contact, no distractions like your phone\n– Silence: don’t interrupt or rush to fill pauses\n– Minimal encouragers: nods, “Okay,” “Uh-huh,” “Please continue”\n– Paraphrasing: their meaning in your words\n– Mirroring: repeat their last words as a question\n– Questioning: open questions that can’t be answered yes or no\n– Acknowledging: name the emotion they’re showing\n– Summarizing: restate key points and check accuracy"},{"l":"cde","o":3,"t":"q","q":"A reluctant assault victim says, “I can’t believe this happened to me.” To use minimal encouragers, you’d say…","a":["“Why didn’t you call sooner?”","“Okay… please continue.”","“What you’re saying is you were attacked.”"],"c":1,"w":"Minimal encouragers are short prompts that show you’re listening. Restating what they said is paraphrasing."},{"l":"cde","o":3,"t":"q","q":"A woman says, “The way he behaves makes me cry.” You respond, “What did he do to make you cry?” That technique is…","a":["Summarizing","Mirroring","Minimizing"],"c":1,"w":"Mirroring repeats the person’s last words as a question to get more information."},{"l":"cde","o":3,"t":"q","q":"“You seem to be feeling frustrated.” This is an example of…","a":["Acknowledging","Questioning","Interrupting"],"c":0,"w":"Acknowledging identifies the emotion based on what the person has shown, rather than telling them how to feel."},{"l":"cde","o":7,"t":"f","h":"Reframing","b":"Reframing takes the blame out of negative statements and refocuses on solving the problem.\n– Actively listen\n– Identify the real issue and restate it\n– Turn “you” statements into “I” statements\n– Strip out toxic or hateful language\nExample: “I can hear you’re all upset about finances. Can we agree to stop blaming and yelling so I can help find a solution?”"},{"l":"cde","o":4,"t":"f","h":"Common communication barriers","b":"Appearance, physical barriers (like sunglasses), external and internal distractions, not showing empathy, bias, profanity, ambiguity, oversimplifying, interrupting, predicting what someone will say, giving no feedback, sarcasm, and loaded words.\nLoaded words provoke defensiveness. “Please justify your decision” lands much harder than “Please explain your decision.”"},{"l":"cde","o":4,"t":"q","q":"Which request is least likely to make someone defensive?","a":["“Justify your decision.”","“That was a stupid decision.”","“Please explain your decision.”"],"c":2,"w":"“Justify” is a loaded word that implies they must prove they were right. Choose emotionally neutral words."},{"l":"cde","o":4,"t":"f","h":"Barriers unique to policing","b":"Power struggles: as ego goes up, power and safety go down. Arguing means you’ve lost control.\nBeing judgmental or minimizing: you don’t have to agree, but you must understand.\n“Us vs. them”: people who feel treated as obstacles talk less.\nSituational awareness: your safety posture can unintentionally look aggressive."},{"l":"cde","o":4,"t":"s","q":"A woman considering suicide says it’s because a boyfriend of two weeks left her. Which response is a communication barrier?","a":["“What you’re feeling is ridiculous.”","“That sounds really painful. Tell me more.”","Silence while she talks"],"c":0,"w":"Minimizing feelings shuts communication down. You don’t have to agree with her perspective, but you need to understand it."},{"l":"cde","o":5,"t":"f","h":"Communicating across cultures","b":"Hierarchy: some cultures expect you to speak with the head of the family or an elder first. Avoid using a child to translate.\nVoice: Arab speakers may talk louder (a sign of sincerity); many Asian cultures prefer softer speech.\nEye contact: Asians and Pacific Islanders may avoid it as a sign of deference.\nGestures: the U.S. “OK” sign means money in Japan and Korea.\nTouch: ask permission or explain why before touching."},{"l":"cde","o":5,"t":"f","h":"Limited English proficiency","b":"Without an interpreter: be patient, speak slowly and clearly, don’t raise your volume, use short words and sentences, skip slang and contractions, and repeat word for word when asked.\nWith an interpreter: have them translate verbatim, face and speak directly to the person (“What time did you get home?” not “Ask him what time…”), and talk in 2–3 sentence chunks."},{"l":"cde","o":5,"t":"q","q":"You’re interviewing a Spanish-speaking victim through an interpreter. You should…","a":["Speak slowly and loudly so they understand","Say to the interpreter, “Ask her what happened”","Face the victim and speak directly to her"],"c":2,"w":"Talk to the person, not the interpreter, in short segments."},{"l":"cde","o":5,"t":"q","q":"What’s the best practice for communicating with a citizen who is hearing impaired?","a":["Keep your hand gestures to a minimum","Talk slower and lower your voice so they can read your lips","Stand directly in their field of vision while you talk"],"c":2,"w":"Use normal speed and volume; slowing down distorts lip movements. Gestures and expressions help. (This is the sample question from Course Orientation.)"},{"l":"cde","o":5,"t":"f","h":"Deaf and hard of hearing","b":"Get their attention with a wave or gentle touch, face them in good light, and ask how they prefer to communicate before you start: speech, lip-reading, sign language or writing.\nOnly 30–40% of English is visible on the lips. Speak naturally; don’t shout or exaggerate.\nHearing aids raise volume, not clarity.\nOn arrest: get a qualified interpreter immediately. Statements taken without one are inadmissible, and an arrestee eligible for bail can’t be held waiting for one."},{"l":"cde","o":5,"t":"q","q":"About how much of spoken English is visible on the lips?","a":["Nearly all of it","30 to 40 percent","5 percent"],"c":1,"w":"That’s why gestures, expressions and checking for understanding matter even when someone reads lips."},{"l":"cde","o":5,"t":"f","h":"Blind or low vision","b":"Identify yourself right away and ask how you can help. Assist only with permission.\nUse normal volume. Keep using body language.\nTell them before you move and when you’re leaving. Introduce everyone present.\nGive specific directions (“to your left”), not vague ones.\nTo guide, let them hold your arm just above the elbow. Never put them ahead of you, and never pet or separate them from a guide dog.\nLegally blind: no better than 20/200 corrected in the better eye."},{"l":"cde","o":5,"t":"f","h":"Persons with disabilities","b":"Use person-first language: “Tom has a mental illness,” “Mary uses a wheelchair,” not “confined to a wheelchair.”\nAsk “May I assist you?” before helping.\nTreat wheelchairs, canes and walkers as personal space. Don’t lean on them.\nPosition yourself at eye level with a seated person, but don’t kneel; if you can’t sit, step back.\nService animals: N.C. law guarantees access. The state tag is voluntary."},{"l":"cde","o":5,"t":"q","q":"Which phrasing follows person-first language?","a":["“Mary is wheelchair-bound.”","“Mary is confined to a wheelchair.”","“Mary uses a wheelchair.”"],"c":2,"w":"Person-first language focuses on the person, not the disability."},{"l":"cde","o":5,"t":"f","h":"Children, teens and older adults","b":"Children (5–10): get to eye level, ask about their day, explain why you’re there, reassure them they’re not in trouble.\nTeens: be clear, consistent and predictable; no sarcasm; give them chances to save face. Respectful contact improves attitudes even after a stop or arrest.\nOlder adults: use Sir, Ma’am, or titles, never “sweetie” or “honey.” Pause between questions. For dementia, minimize distractions, be patient, and don’t correct irrelevant details."},{"l":"cde","o":6,"t":"f","h":"Crisis communication","b":"– Plan ahead\n– Keep a reactionary distance of at least 6 to 8 feet\n– Don’t stand directly in front of the person\n– Keep your voice low and slow\n– Let them vent and tell their story more than once\n– Skip clichés and humor\n– Validate feelings with open questions\n– Embrace silence\n– Know your limits; call backup"},{"l":"cde","o":6,"t":"q","q":"A man with a mental illness says, “The government uses my TV to spy on me.” The best response is…","a":["“That’s not possible. TVs can’t do that.”","“That must be scary. What does that feel like?”","A light joke to ease the tension"],"c":1,"w":"Focus on and validate the feeling without arguing the belief. Humor can signal your own discomfort."},{"l":"cde","o":6,"t":"f","h":"Hidden causes of noncompliance","b":"Noncompliance isn’t always defiance. It can come from physical illness, mental illness, developmental disabilities, drug impairment, or an emotional crisis.\nThe first step in de-escalation: explain clearly what’s happening and why. “Because I said so” isn’t an explanation.\nThen ask: “Is there anything I can say or do to get you to cooperate?”"},{"l":"cde","o":6,"t":"f","h":"Three behavior styles","b":"Non-assertive: passive and indirect; lets others’ needs come first. Creates win-lose, with them losing.\nAssertive: active, direct, honest, respectful. Works toward win-win.\nAggressive: always conveys superiority and disrespect; wins by making others lose, and invites retaliation."},{"l":"cde","o":6,"t":"q","q":"Which behavior style aims for a win-win outcome?","a":["Aggressive","Non-assertive","Assertive"],"c":2,"w":"Assertive people treat their needs as equal to others’ and work by listening, negotiating and collaborating."},{"l":"cde","o":6,"t":"f","h":"Warning signs of resistance","b":"Body: closing or opening distance, stretching or grooming, adjusting or removing clothing, a bladed stance, clenched fists, target glancing, head tilted back, grimacing. Watch for fleeting micro-expressions like clenched teeth or wide, unblinking eyes.\nVerbal: yelling, rapid speech, sarcasm, refusals (“I’m not going to…”), direct threats, claims of expertise (“I’m a black belt”)."},{"l":"cde","o":6,"t":"f","h":"De-escalation principles","b":"Safety comes first, and de-escalation isn’t always practical.\nCommunication is the first option and continues throughout.\nStart calm, in a normal tone, asking rather than ordering.\nUse distance and cover to slow things down.\nIf force is needed, use only what the threat requires, and reassess as things change.\nBe less authoritarian and less confrontational. When someone yells, lower your voice. Apologize if something you said escalated them."},{"l":"cde","o":6,"t":"q","q":"A person in crisis is yelling at you. What should you do with your voice?","a":["Lower your volume and keep a steady pace","Raise your voice so you can be heard","Tell them to stop yelling or they’ll be arrested"],"c":0,"w":"Don’t compete with someone who’s yelling. A lower, steady voice helps reduce tension."},{"l":"cde","o":6,"t":"f","h":"E-LEAP","b":"Engage: introduce yourself, say you’re there to help, use their name, ask open questions.\nListen: let them vent; use silence, minimal encouragers and mirroring.\nEmpathize: paraphrase and acknowledge emotions; don’t argue with logic.\nAgree: find common ground and avoid arguing over differences.\nPartner: give them choices and work toward a solution together."},{"l":"cde","o":6,"t":"q","q":"In E-LEAP, which step means finding common ground and avoiding arguments about differences?","a":["Engage","Agree","Partner"],"c":1,"w":"You can agree to disagree on one point and find agreement elsewhere."},{"l":"cde","o":6,"t":"q","q":"In E-LEAP, what comes right after Listen?","a":["Agree","Empathize","Engage"],"c":1,"w":"Engage, Listen, Empathize, Agree, Partner."},{"l":"cde","o":7,"t":"f","h":"Four steps of negotiation","b":"1. People: separate the people from the problem.\n2. Interests: focus on interests, not positions.\n3. Options: look for solutions where both sides gain.\n4. Criteria: insist on objective criteria and a way to track compliance.\nOffer choices, have a bottom line, never promise what you can’t deliver, and don’t take unnecessary risks to make a deal."},{"l":"cde","o":7,"t":"q","q":"In negotiation, what does “focus on interests, not positions” mean?","a":["Look for what the person actually needs, not just the stance they’ve taken","Insist on your own position until they give in","Let them have whatever they ask for"],"c":0,"w":"People sometimes take a hard position just to oppose you. It may not reflect what they really need."},{"l":"cde","o":8,"t":"f","h":"Radio technique","b":"Hold the mic 1 to 3 inches from your mouth at a 30–45 degree angle, and talk across it, not into it.\nPress, pause, then talk. Release only after you finish.\nFront-end clipping: you talked before pressing the button.\nRear-end clipping: you released before you finished.\nNear a siren, hold the mic against your larynx and talk normally."},{"l":"cde","o":8,"t":"q","q":"The first few words of your radio message keep getting cut off. Why?","a":["You’re releasing the button too soon","You’re talking before pressing the button","Your battery is low"],"c":1,"w":"That’s front-end clipping. Releasing early cuts off the end of the message (rear-end clipping)."},{"l":"cde","o":8,"t":"f","h":"ABCs and 5 W’s of radio","b":"Accurate, Brief, Clear: normal volume and cadence; no yelling, mumbling, or excited or sarcastic tone.\nWho: start with your unit number (“420 to Central”).\nWhere: exact location and direction of travel.\nWhat: what you’re doing and what you need.\nWhen: 24-hour time (1:00 p.m. is 1300).\nWeapons: always report actual or possible weapons, without exception.\nDon’t mix the International and Police phonetic alphabets, or invent words. Use plain text in multi-agency incidents."},{"l":"cde","o":8,"t":"q","q":"How do you say 3:00 p.m. on the radio?","a":["0300 hours","1500 hours","1300 hours"],"c":1,"w":"Add 12 to afternoon hours: 3 + 12 = 1500. 0300 would be 3 a.m."},{"l":"cde","o":8,"t":"q","q":"Which of the 5 W’s must be included in a radio report without exception?","a":["When","Weapons involved","Who you’re talking to"],"c":1,"w":"Always identify the actual or potential presence of weapons."},{"l":"crt","o":1,"t":"f","h":"What court security means","b":"The procedures, technology and architectural features that ensure (1) the safety of people and property in and around the courthouse and (2) the integrity of the judicial process.\nIt aims to prevent problems like disorderly conduct, violence, theft, fire, bomb threats, hostage situations, escapes and assassinations."},{"l":"crt","o":2,"t":"f","h":"The bailiff","b":"Keeps order, calls witnesses, and is in charge of the jury as the judge directs, making sure no one tries to influence it.\nIdeal traits: a sworn officer; physically and mentally fit; trained in procedures and contingency plans; skilled in firearms, defensive weapons, de-escalation, self-defense, restraints and transport; working the courtrooms and the rest of the courthouse.\nAt least one armed bailiff should be at every court proceeding. An offhand remark to a juror can cause a mistrial."},{"l":"crt","o":2,"t":"q","q":"At minimum, how many armed bailiffs should be present at every court proceeding?","a":["One","Two","None if the judge is armed"],"c":0,"w":"At least one armed bailiff at every proceeding, and the bailiff should be a sworn officer."},{"l":"crt","o":3,"t":"f","h":"Outer perimeter","b":"Three off-premises surroundings affect security:\n– Adjacent businesses and buildings (fuel stations, hardware stores, industrial sites)\n– Landscaping (shrubs that hide contraband, trees that give roof access)\n– Signage (parking, weapon and screening warnings, entrance signs)\nOuter-perimeter equipment: hardware and locks, bars, grilles and doors, and CCTV.\nTip: keep a padlock locked onto the hasp while the door is open so no one can swap it."},{"l":"crt","o":3,"t":"q","q":"Which is NOT one of the three off-premises surroundings that affect courthouse security?","a":["Adjacent businesses","Courtroom seating layout","Landscaping"],"c":1,"w":"The three are adjacent businesses and buildings, landscaping, and signage."},{"l":"crt","o":4,"t":"f","h":"Entry screening","b":"Best: close all entrances but one and screen everyone. If that’s impossible, replicate checkpoints at every entrance.\nScreen purses, backpacks, briefcases, bags and boxes, and laptops.\nEquipment: magnetometers (permanent, portable walk-through, hand-held), X-ray machines, and ion scanners that detect traces of drugs and explosives.\nA judge may order everyone entering a courtroom searched (§ 15A-1034). Bringing a deadly weapon into a courthouse is a crime (§ 14-269.4)."},{"l":"crt","o":4,"t":"q","q":"An ion scanner at a courthouse checkpoint detects…","a":["Microscopic traces of drugs and explosives","Only metal objects","Paper documents"],"c":0,"w":"Ion scanners use “sniff” technology. Magnetometers find metal; X-ray shows what’s inside bags."},{"l":"crt","o":4,"t":"q","q":"A visitor tells you she has a pacemaker. What’s the best practice?","a":["Have her walk through quickly","Scan her with the hand-held wand instead","Offer an alternative such as a pat-down"],"c":2,"w":"Avoid exposing ICDs and pacemakers to operating metal detectors, including hand-held ones."},{"l":"crt","o":4,"t":"q","q":"An attorney’s briefcase holds case files. During screening you should…","a":["Read through them for threats","Screen the briefcase but not examine the contents of written materials","Exempt the briefcase from screening"],"c":1,"w":"Attorneys may carry privileged material. Screen for weapons without reading documents."},{"l":"crt","o":5,"t":"f","h":"Searching a courtroom","b":"Wear gloves, clear unauthorized people, and use a systematic pattern.\nFocus on where defendants sit: tables, chairs, drawers. Check fixtures, vents, trash cans, floors, ceilings and adjoining rooms.\nAfter finding one item, keep searching; there may be more. Don’t move suspicious items; follow bomb-threat procedures.\nAfterward, keep the room under constant watch until court starts, and lock it at lunch.\nThe jury deliberation room is searched at the start and end of each day."},{"l":"crt","o":5,"t":"q","q":"You find a homemade blade taped under the defense table. What next?","a":["Stop searching; the room is clear now","Leave it in place, report it, and keep searching","Pocket it and finish later"],"c":1,"w":"Don’t relax after one find. Leave suspicious items for evidence technicians."},{"l":"crt","o":5,"t":"f","h":"Holding cells","b":"Shanks and other blades are easy to hide, so search holding cells before and after detainees are held there.\nDetainees have no contact with the public while waiting, stay under supervision, and the area is monitored.\nAttorney-client rooms are searched before and after use. Never monitor attorney-client conversations."},{"l":"crt","o":6,"t":"f","h":"Protecting judges and witnesses","b":"Judges: guard their parking, assign spaces by number not name, escort them through public corridors, put an alarm in chambers, search chambers daily, and forward threatening letters to the sheriff.\nWitnesses: provide secure waiting areas away from defendants and their families (§ 15A-825), ideally separate rooms for each side. Report intimidation, like throat-cutting gestures, to the judge.\nSequestering witnesses (§ 15A-1225): a parent may stay while a minor child testifies."},{"l":"crt","o":6,"t":"q","q":"Judges’ parking spaces should be assigned…","a":["By number, not name","With the judge’s name on a sign","Closest to the public entrance"],"c":0,"w":"Names on spaces tell a would-be attacker exactly where the judge parks."},{"l":"crt","o":6,"t":"f","h":"Restraints and disruptive defendants","b":"The sheriff sets restraint policy; deviations require a court order. A judge may order restraints when reasonably necessary for order, preventing escape or safety.\nRemoving a disruptive defendant (§ 15A-1032): the judge warns first (out of the jury’s presence when practical), records the reasons, tells jurors not to weigh it, and lets the defendant follow the trial through counsel and return on assurance of good behavior."},{"l":"crt","o":7,"t":"f","h":"Where escapes happen","b":"Detainees are most likely to try to escape when away from the jail:\n1. In transit between jail and courthouse\n2. In public hallways\n3. In the courtroom\n4. In the temporary holding area\nIf one happens: activate the alarm; one bailiff pursues while another secures the judge; radio it out. The sheriff enters the escapee in NCIC and sends a BOLO to agencies within at least 50 miles."},{"l":"crt","o":7,"t":"q","q":"Which is NOT one of the four places escape attempts usually happen?","a":["Public hallways","Jury deliberation room","Transit between jail and courthouse"],"c":1,"w":"The four are transit, public hallways, the courtroom, and the temporary holding area."},{"l":"crt","o":7,"t":"q","q":"After a courthouse escape, the BOLO goes out to agencies within at least…","a":["10 miles","50 miles","Statewide only"],"c":1,"w":"Plus an NCIC entry as a wanted person-escapee."},{"l":"crt","o":7,"t":"q","q":"A pretrial detainee flees the courthouse unarmed, posing no threat. Deadly force is…","a":["Justified because he’s escaping custody","Justified only if he’s a convicted felon","Not justified without a reasonable belief he poses an imminent threat of death or serious injury"],"c":2,"w":"The “convicted felon” escape provision applies to escapes from prison, not courthouse escapes."},{"l":"crt","o":8,"t":"f","h":"Special detainees","b":"Multi-defendant trials: normally one officer per defendant; co-defendants may need separate seating.\nFemale detainees: just as dangerous. With no female officer, at least two male officers present.\nJuveniles: unpredictable. A judge may restrain them only when reasonably necessary, after letting them be heard when practical, with findings (§ 7B-2402.1).\nMental illness: may not respond to warnings; a medical attendant is often present.\nDisabilities: a deaf defendant needs visual contact and an interpreter. Even a crutch can be a weapon."},{"l":"crt","o":8,"t":"q","q":"No female officer is available to supervise a female detainee. What’s recommended?","a":["One male officer is fine","At least two male officers present at all times","Leave her unsupervised in the courtroom"],"c":1,"w":"Two officers help prevent misconduct allegations."},{"l":"crt","o":8,"t":"q","q":"For a multi-defendant trial, how many court officers are normally assigned?","a":["One per defendant","One for the whole courtroom","One per two defendants"],"c":0,"w":"Position them to prevent escape or control each prisoner if a disturbance breaks out."},{"l":"crt","o":9,"t":"f","h":"Juries","b":"Grand jury: 18 people serving up to a year; decides only whether there’s probable cause to charge.\nPetit jury: 12 people; decides guilt or innocence, and facts in civil cases.\nNever discuss the trial with jurors or express an opinion. Report possible juror misconduct to the judge.\nOrientation covers not talking to non-jurors, possible sequestration, and security measures."},{"l":"crt","o":9,"t":"q","q":"How many members sit on a N.C. grand jury, and what do they decide?","a":["12; guilt or innocence","18; whether there’s probable cause","18; the sentence"],"c":1,"w":"The 12-person petit jury decides guilt."},{"l":"crt","o":9,"t":"f","h":"Deliberations","b":"The room is locked, soundproof, and only jurors are inside (with narrow exceptions like interpreters).\nNo juror leaves and no one approaches during deliberations.\nQuestions go to the judge in writing. The bailiff may only ask whether a verdict has been reached.\nEavesdropping on a jury with a device is a crime (§ 14-227.2), as is harassing or intimidating a juror (§ 14-225.2). Never repeat anything overheard."},{"l":"crt","o":9,"t":"q","q":"The jury knocks and asks a question about the evidence. You should…","a":["Answer it if you know","Have them put it in writing and deliver it to the judge","Send the foreperson to ask the judge"],"c":1,"w":"Jurors stay in the room. The judge decides how to respond."},{"l":"crt","o":9,"t":"f","h":"Sequestered juries and jury views","b":"Log every visitor with authorization; escort service staff, who don’t talk to jurors.\nRemove or disable TVs, radios and internet devices; monitor phones; screen any printed material.\nUsually two jurors per room, separated by sex. At the court’s discretion, a limited number of drinks (usually two) at their own expense if not returning to court.\nJury views (§ 15A-1229): the jury travels in an officer’s custody, and no one may talk to them about the case."},{"l":"crt","o":9,"t":"s","q":"Escorting a sequestered jury seven weeks into a trial, you see a prohibited phone on a juror’s nightstand. He says it’s been dead for weeks. What do you do?","a":["Ignore it so the trial isn’t disrupted","Report it to the judge","Take the phone and say nothing"],"c":1,"w":"The judge decides what happens next, even if it risks a mistrial."},{"l":"crt","o":10,"t":"f","h":"Steps of a trial","b":"1. Jury selection\n2. Opening statements (prosecution or plaintiff first; not required)\n3. Presentation of evidence, with direct and cross-examination\n4. Rebuttal\n5. Motions and objections throughout\n6. Closing arguments (no new evidence)\n7. Jury instructions\n8. Verdict, then sentencing if convicted\nBe most alert during verdicts and sentencing."},{"l":"crt","o":10,"t":"q","q":"After the defense finishes presenting its case, what comes next?","a":["Opening statements","Rebuttal by the prosecution or plaintiff","Jury selection"],"c":1,"w":"The prosecution or plaintiff can respond to the defense evidence, and the defense may cross-examine."},{"l":"crt","o":10,"t":"q","q":"What burden of proof does the judge explain in a civil trial?","a":["Beyond a reasonable doubt","Probable cause","Preponderance of the evidence"],"c":2,"w":"Criminal cases require proof beyond a reasonable doubt."},{"l":"crt","o":10,"t":"f","h":"Before trial and court cries","b":"Pre-trial steps: first appearance (bond and rights), probable cause hearing, arraignment (if the defendant doesn’t request one in writing within 21 days of service of the indictment, a not-guilty plea is entered), and motions.\nBailiff cries open with “Oh, Yez! Oh, Yez! Oh, Yez!” Adjourning “sine die” is the final close of a term.\nIf the superior court judge doesn’t appear, the sheriff adjourns court day to day."},{"l":"cs","o":1,"t":"f","h":"Why people start using drugs","b":"1. To feel good: euphoria\n2. To feel better: self-medicating anxiety, stress, trauma or depression\n3. To relieve pain: sometimes starting with a legitimate prescription\n4. To do better: athletic or cognitive performance\n5. Curiosity or peer pressure, especially in teens"},{"l":"cs","o":2,"t":"f","h":"Abuse vs. addiction","b":"People who abuse drugs still have control over their lives.\nAddiction is a chronic, relapsing brain disorder and mental illness: compulsive drug seeking and continued use despite harm, with long-lasting brain changes."},{"l":"cs","o":2,"t":"q","q":"What’s the key difference between drug abuse and addiction?","a":["Abuse involves illegal drugs; addiction involves prescriptions","Someone who abuses drugs still has control; addiction is a disease marked by compulsive use","There’s no difference"],"c":1,"w":"Not all abuse or addiction starts with illegal drugs."},{"l":"cs","o":3,"t":"f","h":"N.C. schedules","b":"I: high abuse potential, no accepted medical use. LSD, MDMA, synthetic cannabinoids.\nII: high abuse, accepted medical use with severe restrictions. Fentanyl, cocaine, methamphetamine, morphine, oxycodone.\nIII: less abuse potential. Ketamine, testosterone.\nIV: low abuse. Valium, Xanax.\nV: lower still. Cough syrup with codeine.\nVI: no accepted medical use, low abuse potential. Marijuana and THC.\nN.C. marijuana is Schedule VI; federally it’s Schedule I."},{"l":"cs","o":3,"t":"q","q":"Under N.C. law, marijuana is in which schedule?","a":["Schedule I","Schedule IV","Schedule VI"],"c":2,"w":"Federal law puts it in Schedule I. N.C. schedules can differ from federal ones."},{"l":"cs","o":3,"t":"q","q":"Methamphetamine is a Schedule ___ drug in N.C.","a":["II","I","IV"],"c":0,"w":"Schedule II, along with cocaine, fentanyl, morphine and oxycodone."},{"l":"cs","o":3,"t":"q","q":"Alprazolam (Xanax) falls in which N.C. schedule?","a":["II","IV","VI"],"c":1,"w":"Schedule IV includes depressants like Valium and Xanax and some stimulants like phentermine."},{"l":"cs","o":3,"t":"q","q":"Cough syrup containing codeine is in which schedule?","a":["III","V","VI"],"c":1,"w":"Schedule V is mainly preparations with limited quantities of certain narcotics."},{"l":"cs","o":3,"t":"q","q":"Ketamine and testosterone are Schedule ___ drugs.","a":["III","I","V"],"c":0,"w":"Schedule III: abuse potential below I and II, with accepted medical use."},{"l":"cs","o":3,"t":"q","q":"LSD and MDMA belong in which schedule?","a":["II","I","III"],"c":1,"w":"Schedule I: high abuse potential and no accepted medical use."},{"l":"cs","o":4,"t":"f","h":"Signs by drug type","b":"Stimulants (cocaine, meth, Adderall): raised blood pressure, heart and breathing rate; alertness; insomnia; paranoia; aggression.\nCNS depressants (Valium, Xanax, barbiturates): drowsiness, relaxation, slurred speech, confusion, poor concentration.\nHallucinogens and dissociatives (LSD, PCP, ketamine): altered perception, emotional swings, feeling detached from the body.\nOpioids (heroin, fentanyl, oxycodone): drowsiness, confusion, nausea, constipation, respiratory depression, euphoria.\nInhalants: look like alcohol intoxication; chemical smell and residue on hands and face.\nCannabis: relaxation, euphoria, laughter, increased appetite."},{"l":"cs","o":4,"t":"q","q":"A subject has a racing heart, high blood pressure, can’t sleep, and is paranoid and aggressive. Most likely category?","a":["Stimulant","CNS depressant","Cannabis"],"c":0,"w":"Depressants slow things down; stimulants speed them up."},{"l":"cs","o":4,"t":"q","q":"Drowsiness, constipation and dangerously slow breathing point most to…","a":["Opioids","CNS depressants","Stimulants"],"c":0,"w":"Depressants also cause drowsiness, but constipation and respiratory depression are hallmark opioid effects."},{"l":"cs","o":4,"t":"q","q":"A typical inhalant user most closely resembles someone who is…","a":["Drunk on alcohol","On a stimulant","Completely sober"],"c":0,"w":"Also look for chemical odor on clothing and residue on hands, mouth and face."},{"l":"cs","o":4,"t":"f","h":"Inhalants and edibles","b":"Four inhalant types: volatile solvents (glue, gasoline, markers), aerosols (spray paint, cooking spray), gases (nitrous oxide “whippets,” butane), and nitrites (“video head cleaner,” sold as sexual enhancers).\nMarijuana edibles take 30–60 minutes or more to take effect because THC is processed in the liver, so users often take too much and then panic."},{"l":"cs","o":5,"t":"f","h":"Drug paraphernalia","b":"Defined in § 90-113.21: equipment used or intended to grow, make, package, store, conceal, or use controlled substances.\nPossessing paraphernalia is a Class 1 misdemeanor (§ 90-113.22).\nMarijuana paraphernalia is a separate, lesser offense: Class 3 misdemeanor (§ 90-113.22A).\nIf a person tells you about a needle or sharp object before a search, they can’t be charged with paraphernalia for it or for residue in it.\nCommon items: glass pipes with wire filters, push rods, burnt spoons, rolling papers, bongs, grinders, small baggies."},{"l":"cs","o":5,"t":"q","q":"Which statute defines drug paraphernalia?","a":["§ 90-95","§ 90-113.21","§ 20-138.1"],"c":1,"w":"§ 90-95 covers most controlled substance crimes; § 20-138.1 is DWI."},{"l":"cs","o":11,"t":"q","q":"A subject has only cigarette rolling papers he uses for marijuana. The charge is…","a":["Class 1 misdemeanor drug paraphernalia","Class 3 misdemeanor marijuana paraphernalia","Felony possession"],"c":1,"w":"Marijuana paraphernalia is charged separately under § 90-113.22A."},{"l":"cs","o":11,"t":"f","h":"Possession penalties","b":"Schedule I: Class I felony (except 1 gram or less of MDPV).\nSchedules II–IV: Class I felony for any amount of cocaine, meth, amphetamine or PCP, or over 100 dosage units.\nSchedule V: Class 2 misdemeanor.\nMarijuana: ½ ounce or less, Class 3 misdemeanor; over ½ to 1½ ounces, Class 1 misdemeanor; over 1½ ounces, Class I felony.\nInhaling toxic fumes to get intoxicated (§ 90-113.10): Class 1 misdemeanor, as is possessing the chemical for that purpose."},{"l":"cs","o":11,"t":"q","q":"During a search incident to arrest, you find one baggie with 12 grams of marijuana. The charge is…","a":["Class I felony possession","Class 3 misdemeanor possession","Class 1 misdemeanor possession"],"c":1,"w":"12 grams is under ½ ounce (about 14 grams), so it’s a Class 3 misdemeanor."},{"l":"cs","o":11,"t":"q","q":"A subject has a small amount of methamphetamine for personal use. The charge is…","a":["Class I felony possession","Class 1 misdemeanor","Infraction"],"c":0,"w":"Any amount of meth, cocaine, amphetamine or PCP is a Class I felony."},{"l":"cs","o":11,"t":"q","q":"A man is caught huffing gasoline to get high. The charge is…","a":["Possession of a Schedule VI substance","Inhaling toxic fumes, a Class 1 misdemeanor","No crime; gasoline is legal"],"c":1,"w":"§ 90-113.10 makes it a crime to inhale any substance to induce intoxication."},{"l":"cs","o":11,"t":"f","h":"Selling and trafficking","b":"Selling to someone under 16 (seller 18+): Class D felony; Class C if 13 or younger. Mistake of age is no defense.\nSelling or possessing with intent within 1,000 feet of a school, child care center or public park (seller 21+): Class E felony.\nTrafficking minimums: marijuana over 10 lb; cocaine or meth 28 g; heroin, opium or fentanyl 4 g; LSD or MDMA 100 dosage units.\nMaintaining a dwelling or vehicle for drugs: one sale from a car isn’t enough to prove it."},{"l":"cs","o":11,"t":"q","q":"What’s the minimum amount of heroin or fentanyl for trafficking?","a":["4 grams","28 grams","10 pounds"],"c":0,"w":"Cocaine and meth start at 28 grams; marijuana over 10 pounds."},{"l":"cs","o":6,"t":"f","h":"Drugs patrol officers see most","b":"Crack and powder cocaine, methamphetamine (“ice,” “crank,” “glass”), marijuana and hashish, heroin and fentanyl, prescription opioids, and LSD (“blotter,” “windowpane”).\nCrack paraphernalia: glass pipes with Brillo filters, push rods, burnt spoons, Pyrex cups with residue, small 1-inch baggies.\nMeth paraphernalia: glass pipes with a ball-shaped end, foil with burn lines, butane lighters, needles."},{"l":"cs","o":7,"t":"f","h":"Meth ingredients","b":"Pseudoephedrine: the key precursor. One box can make meth. N.C. limits sales to 3.6 g in 24 hours and 9 g in 30 days, tracked in the NPLEx database.\nSolvents: engine starting fluid, brake cleaner, acetone.\nAmmonium nitrate: cold packs.\nAcids: muriatic, sulfuric.\nLithium: batteries.\nThe “one-pot” or “shake and bake” method uses a plastic soda bottle."},{"l":"cs","o":7,"t":"q","q":"N.C. limits pseudoephedrine purchases to…","a":["3.6 grams in 24 hours and 9 grams in 30 days","One box per year","There’s no limit with ID"],"c":0,"w":"Sales are logged in NPLEx, a “stop sale” system any N.C. officer can access."},{"l":"cs","o":8,"t":"f","h":"Clandestine lab equipment","b":"Glass jars and kitchen glassware (chemicals dissolve plastic), containers with layered liquids, propane tanks (possibly holding anhydrous ammonia), white powdery residue, rubber tubing to jugs, funnels, masks, and plastic bottles from one-pot cooks.\nLabs may have guard dogs, cameras and booby traps like fishhooks hung at doorways."},{"l":"cs","o":9,"t":"f","h":"If you find a meth lab","b":"Retreat the way you came in. Don’t touch, smell or inhale anything.\nEliminate ignition sources: don’t use radios or phones inside.\nMove upwind and uphill.\nCall it in with the nature of the scene, exact location, wh
