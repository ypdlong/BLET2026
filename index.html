ler details can be withheld, for example by transcript)\n– The name of a complaining witness (with exceptions)"},{"l":"fn","o":7,"t":"q","q":"A reporter asks for the name, age and charge of someone you arrested yesterday. Under § 132-1, that information is…","a":["Confidential","A public record","Available only by court order"],"c":1,"w":"Investigative files generally aren’t public, but basic arrest information is."},{"l":"fn","o":7,"t":"q","q":"Are the records of a criminal investigation generally public records?","a":["Yes, all of them","No, though a court can order release, and certain listed information is public","Only after trial"],"c":1,"w":"Listed items like the arrest circumstances and 911 contents are public."},{"l":"eps","o":1,"t":"f","h":"Ethics, integrity, morals, discretion","b":"Ethics: principles of conduct based on what’s morally right and wrong.\nIntegrity: firm adherence to a code of moral values; incorruptible, honest and fair.\nMorals: concern with right and wrong in human behavior.\nDiscretion: the authority to choose where, how and how severely to act. Use it fairly (not favoring some or being too harsh) and impartially (treating everyone equally). Unethical discretion has legal and ethical consequences."},{"l":"eps","o":3,"t":"f","h":"Types of bias","b":"Explicit: conscious, admitted attitudes, like racism, prejudice or discrimination.\nImplicit: unconscious associations from experience, not hatred. The fast, intuitive brain fills in blanks using skin color, clothing, age, gender, body shape and more.\nConfirmation bias: favoring information that confirms what you already believe.\nBias-based policing: enforcement based on characteristics rather than behavior. Recognizing your own biases is the first step."},{"l":"eps","o":3,"t":"q","q":"An officer who sincerely believes he isn’t prejudiced still unconsciously links young men in hoodies with danger. This is…","a":["Explicit bias","Implicit bias","Noble cause corruption"],"c":1,"w":"Implicit bias operates outside conscious awareness; it isn’t denial."},{"l":"eps","o":4,"t":"f","h":"Legitimacy and procedural justice","b":"Legitimacy: the community’s belief that police can properly exercise authority and solve problems. It’s a social threshold, not a legal one, built through admitting errors, transparency, positive non-enforcement contact, diverse staff, and fair treatment.\nProcedural justice has four pillars:\n1. Be fair in processes\n2. Be transparent in actions (explain why)\n3. Give people a voice\n4. Be impartial in decision-making\nPeople accept outcomes they don’t like when they feel treated fairly."},{"l":"eps","o":4,"t":"q","q":"Explaining to a driver exactly why you stopped them supports which pillar of procedural justice?","a":["Transparency","Impartiality","Voice"],"c":0,"w":"Transparency means explaining the “why” behind your actions."},{"l":"eps","o":5,"t":"f","h":"Critical Decision-Making (C.D.M.)","b":"Five steps, circular and continuous:\n1. Collect information\n2. Assess the situation (risks, need for immediate action or help)\n3. Consider powers and policy (laws and agency policy)\n4. Identify options and determine the best course of action\n5. Act, review and assess\nCore elements at the center: ethics, values, trust, procedural justice, and proportionality."},{"l":"eps","o":5,"t":"q","q":"In C.D.M., which step checks your legal authority and agency policy?","a":["Step 1: Collect information","Step 3: Consider powers and policy","Step 5: Act, review and assess"],"c":1,"w":"Ask what laws govern your actions and what your agency’s policies say."},{"l":"eps","o":5,"t":"q","q":"C.D.M. is best described as…","a":["A one-time checklist","A circular process of constant reassessment","Only for use after an incident"],"c":1,"w":"New information can send you back to earlier steps."},{"l":"eps","o":6,"t":"f","h":"Six barriers to problem-solving","b":"1. Subculture attributes: cynicism, occupational solidarity, authoritarianism, isolationism, conservatism\n2. Groupthink: setting aside your judgment to keep group consensus\n3. Us vs. them\n4. Code of silence: actively covering up or passively staying silent about misconduct\n5. Corruption\n6. Noble cause corruption: breaking rules or law “for the greater good,” like false reports, perjury or planting evidence"},{"l":"eps","o":6,"t":"q","q":"A frustrated officer writes a false report to make sure a known drug dealer is convicted. This is…","a":["Groupthink","Noble cause corruption","Discretion"],"c":1,"w":"The officer gains nothing personally but believes the ends justify the means."},{"l":"eps","o":6,"t":"q","q":"An officer sees a partner steal cash from a scene and says nothing. Which barrier is that?","a":["Code of silence (passive)","Cynicism","Conservatism"],"c":0,"w":"Active code of silence is covering up; passive is staying silent."},{"l":"eps","o":8,"t":"f","h":"Human inhibitors to intervening","b":"Pluralistic ignorance: wrongly assuming everyone else sees things differently than you do, so you stay quiet.\nDiffusion of responsibility: with many bystanders and no clear leader, everyone thinks someone else will act.\nAmbiguity: people who need help rarely say so clearly; unsure bystanders don’t act.\nAgency culture, fear of retaliation, and lack of confidence add to these. Training and practice help officers overcome them."},{"l":"eps","o":8,"t":"q","q":"At roll call, nobody understands a new map, but everyone stays quiet assuming the others get it. This illustrates…","a":["Diffusion of responsibility","Pluralistic ignorance","Noble cause corruption"],"c":1,"w":"Each person wrongly assumes they’re the only one confused."},{"l":"eps","o":9,"t":"f","h":"R.I.G.H.T. peer intervention","b":"Recognize: realize something is wrong, and overcome your own inhibitors.\nIntervene: step in early; even subtle behavior warrants it.\nGet help: bring in other officers or a supervisor.\nTalk about it: debrief and report.\nFederal (§ 1983 bystander liability) and N.C. (§ 15A-401(d1)) law require intervening in excessive force when you have a reasonable chance, and N.C. requires reporting within 72 hours."},{"l":"fa","o":1,"t":"f","h":"Four cardinal rules","b":"1. Treat all guns as loaded.\n2. Point the muzzle in a safe direction at all times.\n3. Be sure of your target and what’s around and beyond it.\n4. Keep your finger off the trigger, outside the guard and on the frame until you’re on target, have a legal right to fire, and have made the conscious decision to fire."},{"l":"fa","o":1,"t":"q","q":"When may your finger go on the trigger?","a":["As soon as you draw","When you’re on target, have a legal right to fire, and have decided to fire","Whenever you feel threatened"],"c":1,"w":"Until then it stays outside the trigger guard on the frame."},{"l":"fa","o":2,"t":"q","q":"Where should a duty holster be placed?","a":["At the outside seam line of the pants on your dominant-hand side","Centered behind the hip","On the support side for a cross draw"],"c":0,"w":"It’s accessible with either hand and easier to defend. Keep Tasers on the opposite side to prevent confusion."},{"l":"fa","o":9,"t":"f","h":"Deadly force: § 15A-401(d)(2)","b":"An officer may use deadly force only when it is or appears reasonably necessary:\n1. To defend themselves or a third person from the use or imminent use of deadly force\n2. To arrest or prevent escape of someone escaping with a deadly weapon, or who poses an imminent threat of death or serious injury unless caught without delay\n3. To prevent escape from custody imposed for a felony conviction\nConstitutionally, it must also be objectively reasonable under Graham v. Connor and Tennessee v. Garner."},{"l":"fa","o":10,"t":"f","h":"After a shooting: four legal challenges","b":"1. Criminal investigation: usually by the SBI when someone dies. The officer will be read Miranda and is often placed on leave.\n2. Internal affairs investigation: automatic; decides justification and discipline.\n3. Federal civil rights charges: possible even without state charges.\n4. Civil lawsuit: the officer and agency can be sued, up to three years later.\nOutcomes can also include injury, property damage, and psychological effects."},{"l":"fa","o":10,"t":"q","q":"After a fatal officer-involved shooting in N.C., who usually conducts the criminal investigation?","a":["The officer’s supervisor","The State Bureau of Investigation (SBI)","The FBI only"],"c":1,"w":"An internal affairs investigation also happens automatically."},{"l":"fa","o":12,"t":"f","h":"The OODA loop","b":"Observe: take in what you see, hear and feel.\nOrient: organize and interpret it (the most important step).\nDecide: choose a lawful option and next step.\nAct: carry it out, then loop back to observe.\nThe goal is to keep a threat from completing its own loop, so they’re always behind you. The steps can come in any order."},{"l":"fa","o":12,"t":"q","q":"In the OODA loop, which step is described as the most important?","a":["Observe","Orient","Act"],"c":1,"w":"Orienting organizes and interprets the information you’ve observed."},{"l":"fa","o":13,"t":"f","h":"Stress responses in a shooting","b":"Tunnel vision: about 82% of officers. Good for one threat in the dark; bad with multiple threats.\nAuditory exclusion (diminished sound): about 88%; you may not hear your gun or your partner.\nTime distortion, extreme visual clarity, and disbelief (up to 42%) are common.\nIt’s fine to admit fear; deadly force is about preventing immediate harm."},{"l":"fa","o":13,"t":"q","q":"An officer in a shooting didn’t hear her own gun fire. This is…","a":["Tunnel vision","Auditory exclusion","A malfunction"],"c":1,"w":"It can also mean missing a partner’s warning about another threat."},{"l":"fa","o":16,"t":"q","q":"What’s the difference between sight alignment and sight picture?","a":["They’re the same thing","Alignment is front sight to rear sight; picture is aligned sights to the target","Alignment is sights to target; picture is front to rear"],"c":1,"w":"Use your dominant eye either way."},{"l":"fa","o":17,"t":"f","h":"Malfunctions and safe storage","b":"Malfunctions: failure to fire (no round chambered, bad ammo), failure to feed (riding the slide, magazine not seated), failure to eject (“stovepipe”), failure to extract.\nStorage (§ 14-315.1): it’s a Class 1 misdemeanor to leave a firearm where an unsupervised minor could get it, in a dischargeable condition, if the minor gets it and then takes it to school, displays it threateningly, or causes injury."},{"l":"fa","o":17,"t":"q","q":"A fired casing sticks straight up in the ejection port, jamming the slide. This is a…","a":["Failure to feed","Failure to eject (stovepipe)","Failure to fire"],"c":1,"w":"Riding the slide forward is a common cause of failure to feed."},{"l":"fr","o":1,"t":"f","h":"Legal implications of giving aid","b":"On duty: you have a professional duty to help within your training. Once you start, don’t leave until relieved by someone with equal or greater training, or it may be abandonment.\nOff duty: helping is a personal choice. The Good Samaritan law (§ 90-21.14) protects volunteers acting without pay in a real emergency, unless they’re grossly negligent, wanton or intentional. It covers AED use.\nAt a vehicle crash (§ 20-166(d)): no civil liability unless the conduct is wanton or intentional."},{"l":"fr","o":1,"t":"q","q":"You start CPR on duty, then get a priority call. When can you leave the patient?","a":["Whenever dispatch sends you elsewhere","When relieved by someone with equal or greater training","After five minutes"],"c":1,"w":"Leaving earlier may be abandonment."},{"l":"fr","o":2,"t":"f","h":"Consent to care","b":"Express (informed) consent: a conscious, competent adult agrees, for example “May I provide first aid until EMS arrives?” “Yes.” If they refuse and you treat anyway, it may be assault.\nChildren and incompetent adults can’t consent or refuse; get it from a parent or guardian.\nImplied consent: for an unconscious or incapacitated person needing emergency care, the law presumes consent. It applies to children too when no one authorized is present.\nDocument the type of consent."},{"l":"fr","o":2,"t":"q","q":"An adult driver is unconscious after a crash and no one else is around. Can you give first aid?","a":["No, there’s no consent","Yes, under implied consent","Only after EMS arrives"],"c":1,"w":"The law presumes an incapacitated person would consent to emergency care."},{"l":"fr","o":3,"t":"f","h":"HIPAA exceptions for law enforcement","b":"Officers shouldn’t discuss a patient’s care except with other providers. But covered entities can share health information with police:\n– To prevent a serious, imminent threat\n– Evidence of a crime on their premises\n– A death suspected to be criminal\n– When required by law (gunshot or stab wounds, dog bites)\n– Under a court order, warrant, subpoena or proper administrative request\n– To identify or locate a suspect, fugitive, witness or missing person (basic information only)\nAfter a crash, providers must tell the investigating officer the person’s name, location and whether they appear impaired."},{"l":"fr","o":3,"t":"q","q":"Which is a HIPAA exception that lets a hospital give information to police?","a":["Reporting a gunshot wound as required by law","Any request from an officer in uniform","A request from the patient’s employer"],"c":0,"w":"Court orders, warrants, suspected criminal deaths and imminent threats are other exceptions."},{"l":"fr","o":5,"t":"f","h":"Initial patient assessment","b":"1. Make sure the scene is safe.\n2. Request EMS and other resources, but don’t wait to give aid.\n3. Check responsiveness. Treat an unconscious person as having a spinal injury and don’t move them unless in immediate danger.\n4. Follow M.A.R.C.H.: Massive hemorrhage, Airway, Respirations, Circulation, Head injury/hypothermia.\n5. Do a head-to-toe secondary assessment.\nNormal breathing rates: adult 12–20, child 18–30, infant 30–60 per minute."},{"l":"fr","o":5,"t":"q","q":"In M.A.R.C.H., what comes first?","a":["Airway","Massive hemorrhage","Circulation"],"c":1,"w":"Bleeding from a compressible or extremity wound is the top survivable cause of death at the point of injury."},{"l":"fr","o":7,"t":"f","h":"START triage","b":"About 30 seconds per person.\nGreen (minor): walking, alert, breathing, can follow instructions.\nYellow (delayed): alert, radial pulse, breathing under 30 per minute, but can’t walk.\nRed (immediate): altered mental status, OR no radial pulse, OR breathing over 30 per minute.\nBlack (deceased/expectant): not breathing after opening the airway, or no pulse and no breathing."},{"l":"fr","o":7,"t":"q","q":"In START triage, a victim is confused and breathing 36 times a minute. Which category?","a":["Yellow","Red (immediate)","Green"],"c":1,"w":"Altered mental status, no radial pulse, or breathing over 30 a minute each mean red."},{"l":"fr","o":9,"t":"f","h":"Bleeding and shock","b":"Control bleeding with direct pressure, hemostatic agents, wound packing, or a tourniquet. Tourniquets are for extremities only, and are no longer a last resort. Use one when direct pressure fails, dressings soak through, or there are multiple wounds or crush injuries.\nShock signs: altered mental status, pale, cool, clammy skin, sweating, fast or weak pulse, fast breathing, dropping blood pressure.\nHemorrhagic (hypovolemic) shock: from blood loss.\nAnaphylactic shock: severe allergic reaction with throat or lip swelling and trouble breathing."},{"l":"fr","o":9,"t":"q","q":"Direct pressure isn’t stopping severe bleeding from a leg wound, and dressings keep soaking through. Next step?","a":["Keep pressing and wait for EMS","Apply a tourniquet","Elevate and leave it"],"c":1,"w":"Soaking dressings are a key sign direct pressure has failed."},{"l":"exp","o":1,"t":"f","h":"Hazmat and the ERG","b":"IFSTA defines hazardous material as any substance with an unreasonable risk to health, safety, property or the environment if not properly controlled.\nEmergency Response Guidebook color sections:\nYellow: look up by 4-digit ID number\nBlue: look up by material name\nOrange: response guides\nGreen: isolation and protective action distances (highlighted materials)\nWhite: glossary and phone numbers\nNo ID at all? Use Guide 111. A “P” means it may polymerize violently."},{"l":"exp","o":2,"t":"q","q":"You have a 4-digit UN number from a placard. Which ERG section do you use first?","a":["Yellow","Blue","Green"],"c":0,"w":"Yellow is the numerical index; blue is alphabetical by name."},{"l":"exp","o":2,"t":"q","q":"A tanker is leaking an unknown substance with no placard or paperwork. Which ERG guide applies?","a":["Guide 111","Guide 1","No guide; wait for hazmat"],"c":0,"w":"Guide 111 is for unidentified hazardous material."},{"l":"exp","o":4,"t":"f","h":"IED components (P.I.E.S.)","b":"Power supply: usually a battery.\nInitiator: often a blasting cap; can be improvised (even a Christmas light filament).\nExplosive: from black powder to ANFO or C-4.\nSwitch: command (radio, phone, tripwire), timed, or victim-operated (tilt, pressure, pull).\nThe container can be almost anything. Never try to identify components yourself; secure, evacuate, and call the bomb unit."},{"l":"exp","o":5,"t":"f","h":"Bomb threats","b":"The person in charge of the facility decides whether to ignore, evacuate, or search and evacuate, based on a risk assessment (low, medium, high).\nIf evacuating, recommend everyone stay at least 300 feet away.\nDon’t use radios or phones near a suspicious item.\nLow risk: vague or implausible, made by a known repeat threatener. Medium: direct and feasible but unlikely. High: specific, realistic, with signs of preparation."},{"l":"exp","o":5,"t":"q","q":"During a bomb threat evacuation, how far away should people stay?","a":["50 feet","At least 300 feet","Across the street is enough"],"c":1,"w":"The facility’s person in charge makes the evacuation decision; officers recommend the distance."},{"l":"exp","o":6,"t":"q","q":"What does P.A.S.S. stand for when using a fire extinguisher?","a":["Pull, Aim, Squeeze, Sweep","Point, Activate, Spray, Stop","Pull, Aim, Spray, Step back"],"c":0,"w":"Aim at the base of the fire. A 5-lb extinguisher can empty in about 15 seconds; range is about 5–20 feet."},{"l":"mp","o":1,"t":"f","h":"First task at a missing person call","b":"Your first job is to decide whether there are exigent circumstances: is the person in danger?\nPeople go missing for five common reasons: voluntary/out of reach, miscommunication, misadventure (hiking, a crash), disability or mental illness, and criminal activity.\nThe agency where the person was last seen or known to be alive takes the report, enters them in NCIC, and does the initial investigation, even if they live elsewhere."},{"l":"mp","o":1,"t":"q","q":"A woman lives in your town but vanished from a hotel in Montana. Which agency takes the missing person report?","a":["Your agency, where she lives","The agency with jurisdiction where she was last seen or known to be alive","Whichever agency the family calls"],"c":1,"w":"Collaboration with other agencies is still often critical."},{"l":"mp","o":2,"t":"f","h":"Preliminary missing person investigation","b":"Follow R.E.S.P.E.C.T.\nSomeone needing medication or medical care is a high-risk disappearance.\nSeparate family and friends; a sibling may not talk in front of parents.\nProtect the Point Last Seen (PLS) as a possible crime scene. Size the perimeter by travel mode and elapsed time: someone walking 2 mph for 4 hours could be 8 miles away.\nAssess risk from personal circumstances (personality, recent behavior changes, health) and the environment."},{"l":"mp","o":2,"t":"q","q":"A boy on foot was last seen at the mall at 2 p.m. and reported missing at 6 p.m. Walking at 2 mph, how far could he be?","a":["About 2 miles","About 8 miles in any direction","Still at the mall"],"c":1,"w":"Perimeter size depends on mode of travel and time since last seen."},{"l":"mp","o":4,"t":"f","h":"Entering missing persons in NCIC","b":"N.C. law requires immediately entering a report from a parent, spouse, guardian or custodian into NCIC.\nThere is no waiting period. Enter as soon as you have the minimum data.\nUnder 21: enter within 2 hours of having the minimum data (name, sex, race, height, weight, hair and eye color; an estimated date of birth is OK).\nCategories: disability, endangered, involuntary, juvenile, catastrophe victim, other."},{"l":"mp","o":4,"t":"q","q":"How long must you wait before entering a missing person into NCIC?","a":["24 hours","72 hours","There is no waiting period"],"c":2,"w":"Missing persons under 21 must be entered within 2 hours of getting the minimum data."},{"l":"mp","o":4,"t":"q","q":"A missing person under 21 must be entered into NCIC within how long of getting the minimum required information?","a":["2 hours","24 hours","48 hours"],"c":0,"w":"Minimum data: name, sex, race, height, weight, hair and eye color."},{"l":"mp","o":4,"t":"q","q":"Which NCIC category fits an adult who appears to have been abducted?","a":["Juvenile","Involuntary","Other"],"c":1,"w":"Endangered is for physical danger; involuntary is for disappearances that may not have been voluntary."},{"l":"mp","o":3,"t":"f","h":"N.C. alerts: who runs them","b":"The N.C. Center for Missing Persons (NCCMP) runs all state alerts: AMBER, Missing Endangered, Blue, and Ashanti. It’s available 24/7 at 800-522-5437.\nEnter the person in NCIC first, then request the alert through the NCCMP portal."},{"l":"mp","o":3,"t":"f","h":"AMBER Alert","b":"For a child 17 or younger who is suspected to have been abducted:\n– By someone other than a parent, OR\n– By a parent, if the child is in danger of serious injury or death\nThere must be enough identifying information (child, abductor, vehicle) to be useful.\nRunaways don’t qualify, but suspected online enticement can.\nGet a signed release from the reporting party. NCCMP gives you activation and deactivation codes for NCIC."},{"l":"mp","o":3,"t":"q","q":"A stranger drives off in a car with a 4-year-old inside. Which applies?","a":["NCIC entry only","NCIC “Missing – Endangered” entry and an AMBER Alert request","An Ashanti Alert"],"c":1,"w":"Also broadcast a BOLO and request investigators."},{"l":"mp","o":3,"t":"q","q":"A 15-year-old ran away after an argument, with no sign of danger or abduction. Does an AMBER Alert apply?","a":["Yes, any missing child qualifies","No; runaways don’t meet AMBER criteria","Only after 24 hours"],"c":1,"w":"Still enter the juvenile in NCIC, and suspected online enticement should go to NCCMP."},{"l":"mp","o":3,"t":"f","h":"Missing Endangered, Blue, and Ashanti Alerts","b":"Missing Endangered: someone with Alzheimer’s, dementia or another irreversible cognitive impairment, reported missing within 72 hours. Requires a signed medical release.\nBlue Alert: an officer is killed, seriously injured or missing on duty, and the suspect is a threat with enough identifying information. Runs 24 hours, extendable once.\nAshanti Alert: an adult 18 to 64 missing in danger, or possibly not voluntary (abduction). Request within about six hours of the report."},{"l":"mp","o":3,"t":"q","q":"A man with dementia wandered from home this morning. Which alert fits?","a":["AMBER","Missing Endangered","Blue"],"c":1,"w":"It’s designed for people with cognitive impairments who can’t meet their own needs or seek help."},{"l":"mp","o":3,"t":"q","q":"A deputy is shot and the suspect flees in an identified vehicle. Which alert?","a":["Blue Alert","Ashanti Alert","AMBER Alert"],"c":0,"w":"It requires an officer killed or seriously injured (or missing on duty) and a suspect posing a threat."},{"l":"mp","o":3,"t":"q","q":"A 30-year-old woman was forced into a van outside her job. Which alert?","a":["Missing Endangered","Ashanti","AMBER"],"c":1,"w":"Ashanti covers adults 18 to 64 whose disappearance may be involuntary or who are in danger."},{"l":"mp","o":5,"t":"f","h":"Related crimes","b":"Failure to report a child’s disappearance (§ 14-318.5): Class I felony for a parent or caregiver who knowingly and wantonly fails to report a child under 16 missing. “Disappearance” means no knowledge of the location and no contact for 24 hours.\nFelonious restraint (§ 14-43.3): Class F felony; unlawful restraint plus moving the person by vehicle.\nKeeping a child out of state in violation of a custody order more than 72 hours is evidence of intent to violate the order."},{"l":"mp","o":5,"t":"q","q":"Under § 14-318.5, a child’s “disappearance” means the caregiver hasn’t known their location or had contact for…","a":["6 hours","24 hours","72 hours"],"c":1,"w":"The statute applies to children under 16. It’s a Class I felony."},{"l":"hs","o":1,"t":"f","h":"Terrorism, violent extremism, hate crime","b":"N.C. terrorism (§ 14-10.1): an act of violence (murder, violent felonies, explosives, WMD) intended to intimidate the civilian population or a group, or to influence government through intimidation. One felony class higher than the underlying act, a separate offense, and enforceable by any N.C. officer.\nFederal terrorism (18 U.S.C. 2331) is enforced by federal agencies like the FBI.\nHate crimes usually target a single victim or property “downward” (majority against minority). Terrorism and extremism aim to spread fear among a group, and terrorism is often “upward.”"},{"l":"hs","o":1,"t":"q","q":"Can N.C. local officers charge terrorism?","a":["No, only federal agents can","Yes, under N.C.G.S. § 14-10.1","Only with an FBI warrant"],"c":1,"w":"Federal terrorism statutes are enforced by federal agencies."},{"l":"hs","o":1,"t":"q","q":"Under § 14-10.1, terrorism is punished…","a":["As a misdemeanor","One felony class higher than the underlying act of violence","The same as the underlying crime"],"c":1,"w":"It’s a separate offense that doesn’t merge; a Class A or B1 underlying act makes it a Class B1."},{"l":"hs","o":3,"t":"f","h":"Lone wolf assailants","b":"Domestic terrorists are often lone actors or small, loosely aligned groups with no clear organization.\nThey consume recruiting material that offers false belonging, their ideologies can be fluid and overlap with conspiracy theories, and they can mobilize quickly, which makes them hard to detect and disrupt."},{"l":"hs","o":4,"t":"f","h":"Three categories of indicators","b":"Mobilization: actions suggesting an attack or travel is imminent, days or hours away. Traveling to carry out violence, violently refusing police, releasing a martyrdom video or manifesto, a dry run, unusual goodbyes.\nPreparation: actions suggesting an attack in the near term, weeks away. Communicating intent or threats, unusual explosives testing, planning travel to join extremists or train.\nMotivation: actions that build or communicate violent beliefs, without necessarily signaling an imminent attack. Vowing to harm police if confronted, willingness to die for the ideology, threatening specific targets."},{"l":"hs","o":4,"t":"q","q":"A subject posts a farewell video and manifesto and says goodbye to family. Which indicator category is this?","a":["Motivation","Mobilization: an attack may be days or hours away","Preparation"],"c":1,"w":"Mobilization indicators suggest imminent action."},{"l":"hs","o":4,"t":"q","q":"Someone repeatedly says he’d be willing to die for his cause, with no specific plans. Which category?","a":["Motivation","Mobilization","Preparation"],"c":0,"w":"Motivation indicators don’t necessarily mean an attack is coming."},{"l":"hs","o":4,"t":"s","q":"Three people hold signs in front of city hall saying taxes are too high and they’ll vote politicians out, stepping aside for others. Your partner threatens to arrest them for disorderly conduct. What’s right?","a":["Arrest them; protesting requires a permit","Recognize this as protected speech and assembly, and intervene with your partner","Order them to leave the sidewalk"],"c":1,"w":"Lawful protest isn’t extremism. You could check whether a permit is required, but peaceful sign-holding on a sidewalk generally isn’t disorderly."},{"l":"hs","o":5,"t":"f","h":"Three common immigrant classifications","b":"Lawful permanent resident (LPR, “green card”): may live and work permanently in the U.S.\nNonimmigrant: admitted temporarily for a specific purpose (students, tourists, temporary workers, diplomats).\nUnauthorized immigrant: entered illegally or violated the terms of admission (overstayed, worked without authorization, entered by fraud).\nCommonly forged IDs: Social Security cards (most forged), military IDs, alien registration cards (I-551), driver’s licenses. Don’t rely on an N.C. license alone to establish citizenship."},{"l":"hs","o":5,"t":"q","q":"A student here on a temporary visa to attend college is classified as a…","a":["Lawful permanent resident","Nonimmigrant","Unauthorized immigrant"],"c":1,"w":"Nonimmigrants are admitted temporarily for specific purposes. A student who overstays would become unauthorized."},{"l":"hs","o":6,"t":"f","h":"Consular notification","b":"A foreign national is anyone who isn’t a U.S. citizen, including green card holders.\n1. Determine their nationality (assume the passport country).\n2. Not a mandatory-notification country: tell them without delay they may have their consulate notified; notify if they ask.\n3. Mandatory country: notify the consulate without delay regardless of their wishes, and tell them you did.\n4. Forward any communication to the consulate.\n5. Keep a written record of what you told them, their requests, and when and how you notified."},{"l":"hs","o":6,"t":"q","q":"You arrest a citizen of a mandatory-notification country who says, “Don’t tell my consulate.” What do you do?","a":["Respect the request and don’t notify","Notify the consulate anyway and tell the person you did","Notify only if charges are felonies"],"c":1,"w":"For mandatory countries, notification isn’t optional. For other countries, it happens only if the person asks."},{"l":"hs","o":6,"t":"q","q":"For consular notification purposes, is a lawful permanent resident (green card holder) a “foreign national”?","a":["No, they live here permanently","Yes, anyone who isn’t a U.S. citizen","Only if they have a passport"],"c":1,"w":"Green card holders keep their foreign nationality."},{"l":"hs","o":7,"t":"f","h":"Reporting terrorism and extremism","b":"In N.C., share suspicious activity with NCISAAC (N.C. Information Sharing and Analysis Center), the state fusion center for terrorism, run through the SBI.\nReport by phone (1-888-624-7222), the SBI website, the DCI Omnixx ISAAC form, or email.\nCertified officers should create an account to receive intelligence reports. Request federal help (like the FBI) for federal terrorism."},{"l":"hs","o":7,"t":"q","q":"What is North Carolina’s state fusion center for terrorism?","a":["NCISAAC","NCIC","NCCMP"],"c":0,"w":"NCIC is the FBI’s database; NCCMP runs missing person alerts."},{"l":"jv","o":1,"t":"f","h":"DHHS vs. DJJ","b":"DHHS (Health and Human Services, including social services) focuses on adults’ behavior that results in abuse, neglect or dependency, to protect children.\nDJJ (Division of Juvenile Justice and Delinquency Prevention) focuses on juveniles’ own behavior: delinquent and undisciplined conduct.\nA juvenile is anyone under 18 who isn’t married, emancipated, or in the armed forces."},{"l":"jv","o":1,"t":"q","q":"What’s the primary difference between DHHS and DJJ?","a":["DHHS handles teenagers; DJJ handles young children","DHHS addresses adults’ behavior toward children; DJJ addresses juveniles’ own behavior","There’s no difference"],"c":1,"w":"DHHS protects children from abuse and neglect; DJJ handles delinquency and undisciplined behavior."},{"l":"jv","o":2,"t":"f","h":"Abused, neglected, dependent","b":"Abused: a parent, guardian, custodian or caretaker inflicts or allows serious physical injury, creates a substantial risk of it, uses cruel discipline, commits or allows listed sex offenses, causes serious emotional damage, encourages delinquent acts involving moral turpitude, or the child is a trafficking victim.\nNeglected: not given proper care, supervision, discipline, or necessary medical or remedial care; abandoned; living in an injurious environment; or a trafficking victim.\nDependent: no parent, guardian or custodian responsible for care, or they can’t provide care and have no alternative arrangement."},{"l":"jv","o":2,"t":"q","q":"A child’s only parent is hospitalized long-term, and there’s no one else to care for the child. The child is…","a":["Abused","Neglected","Dependent"],"c":2,"w":"Dependency is about no responsible caregiver, not about wrongdoing by the parent."},{"l":"jv","o":2,"t":"q","q":"A parent regularly leaves a 7-year-old alone outside a housing project at 4 a.m. This most likely fits…","a":["Neglect","Dependency","Delinquency"],"c":0,"w":"It’s a lack of proper care and supervision, which triggers the duty to report to DHHS."},{"l":"jv","o":3,"t":"f","h":"Three duties to report","b":"§ 7B-301: every person must report suspected abuse, neglect, dependency, death from maltreatment, or child trafficking to DHHS in the county where the child lives or is found. Almost no privilege excuses it (the narrow exception: an attorney representing a client in that case).\n§ 14-318.6: anyone 18 or older who knows or should know a juvenile was the victim of a violent offense, sexual offense, or misdemeanor child abuse must immediately report to law enforcement.\n§ 90-21.20: physicians and hospitals must report non-accidental serious injuries or recurrent illness in children to law enforcement."},{"l":"jv","o":3,"t":"q","q":"Under § 7B-301, suspected abuse or neglect by a parent must be reported to…","a":["The district attorney","DHHS (social services) in the county where the child lives or is found","The child’s school"],"c":1,"w":"§ 14-318.6 separately requires adults to report violent or sexual offenses against juveniles to law enforcement."},{"l":"jv","o":5,"t":"f","h":"Investigation time limits","b":"When DHHS finds evidence a juvenile may have been abused, it must make an immediate oral report, then a written one, to the DA and law enforcement within 48 hours of receiving the report.\nLaw enforcement must start and coordinate a criminal investigation no later than 48 hours after receiving the information from DHHS.\nThe DA decides whether to prosecute.\nReports of abuse or neglect in a daycare go to the Division of Child Development within 24 hours or the next working day."},{"l":"jv","o":5,"t":"q","q":"After DHHS reports possible abuse, law enforcement must start a criminal investigation within…","a":["24 hours","48 hours","7 days"],"c":1,"w":"It must be coordinated with the DHHS investigation."},{"l":"jv","o":6,"t":"f","h":"Felony child abuse (§ 14-318.4)","b":"A parent or caregiver of a child under 16 who:\n– Intentionally inflicts serious bodily injury: Class B2\n– Intentionally inflicts serious physical injury: Class D\n– Commits, permits or encourages prostitution with the child: Class D\n– Commits or allows a sexual act on the child: Class D\n– Willful act or grossly negligent omission showing reckless disregard, causing serious bodily injury: Class E (serious physical injury: Class G)\nSerious bodily injury: substantial risk of death, permanent disfigurement, coma, protracted pain or loss, prolonged hospitalization. Serious physical injury: great pain and suffering, including serious mental injury."},{"l":"jv","o":6,"t":"q","q":"Felony and misdemeanor child abuse statutes protect children under what age?","a":["16","18","13"],"c":0,"w":"The offender must be a parent or someone providing care or supervision."},{"l":"jv","o":6,"t":"q","q":"What separates “serious bodily injury” from “serious physical injury”?","a":["Nothing; they’re the same","Serious bodily injury involves risk of death, permanent disfigurement, coma, or protracted loss; serious physical injury is great pain and suffering","Physical injury is always worse"],"c":1,"w":"Intentionally inflicting serious bodily injury is Class B2; serious physical injury is Class D."},{"l":"jv","o":6,"t":"f","h":"Misdemeanor child abuse and contributing","b":"Misdemeanor child abuse (§ 14-318.2): Class A1. A parent or caregiver of a child under 16 who inflicts or allows physical injury, or creates or allows a substantial risk of it, by other than accidental means.\nContributing to delinquency and neglect (§ 14-316.1): Class 1 misdemeanor. Anyone 18 or older who knowingly or willfully causes, encourages or aids a juvenile to be in a place or condition, or commit an act, where the juvenile could be adjudicated delinquent, undisciplined, abused or neglected. The juvenile doesn’t have to actually be adjudicated."},{"l":"jv","o":6,"t":"q","q":"A 25-year-old buys beer for a group of 15-year-olds and encourages them to skip school. Which charge fits?","a":["Contributing to delinquency and neglect","Felony child abuse","Indecent liberties with a student"],"c":0,"w":"The adult encouraged conduct that could get juveniles adjudicated. Proof that they were actually adjudicated isn’t required."},{"l":"jv","o":6,"t":"f","h":"Offenses involving students and household minors","b":"Indecent liberties with a student (§ 14-202.4): Class G felony. Teachers, administrators, student teachers, school safety officers and coaches of any age, or other school personnel at least 4 years older, who take indecent liberties with a student at their school. Also covers other school personnel less than 4 years older. Doesn’t include intercourse or sexual acts. Marriage is a defense.\nSexual activity with a student (§ 14-27.32): Class G felony, same categories, for intercourse or sexual acts.\nSomeone who has assumed the role of a parent in the home and has intercourse or a sexual act with a minor living there: Class E felony."},{"l":"jv","o":6,"t":"q","q":"A 23-year-old high school coach has sex with a 17-year-old student at his school. Is consent or the student’s age of consent a defense?","a":["Yes, 17 is above the age of consent","No; it’s a Class G felony for school personnel like coaches","Only if they’re dating"],"c":1,"w":"Teachers, administrators, student teachers, school safety officers and coaches are covered at any age. Only lawful marriage is a defense."},{"l":"jv","o":9,"t":"f","h":"Undisciplined and delinquent juveniles","b":"Undisciplined (ages 10–15): unlawfully absent from school, regularly beyond parental control, regularly found where juveniles can’t legally be, or a runaway for more than 24 hours. Ages 16–17: the same except truancy.\nDelinquent: ages 10–15 committing a crime or infraction; ages 16–17 committing a crime or infraction other than motor vehicle law violations (handled in adult court) and certain serious felonies (Class A–E handled as adults).\nCustody of a juvenile can also lead to release, release to parents, referral to resources, a petition, or a petition with a custody order."},{"l":"jv","o":9,"t":"q","q":"A 16-year-old commits a traffic offense under Chapter 20. Where is it handled?","a":["Juvenile court","Adult court","Teen court only"],"c":1,"w":"Since 16-year-olds can drive, their motor vehicle violations go to adult court. Under 16, they go to juvenile court."},{"l":"ht","o":1,"t":"f","h":"Human trafficking and sex trafficking","b":"Human trafficking (§ 14-43.11): knowingly or recklessly recruiting, enticing, harboring, transporting, providing, patronizing, soliciting or obtaining a person intending they be held in involuntary or sexual servitude (or causing a minor to be held).\nSex trafficking (sexual servitude, § 14-43.13): subjecting, maintaining, patronizing, soliciting or obtaining someone for sexual activity induced by coercion or deception, or from anyone under 18.\nLabor trafficking includes debt bondage (the most widely used method) and forced labor.\nTrafficking doesn’t require movement or crossing a border; U.S. citizens can be victims."},{"l":"ht","o":1,"t":"q","q":"How does human smuggling differ from trafficking?","a":["There’s no difference","Smuggling is voluntary, paid border crossing that ends at the border; trafficking is forced servitude","Smuggling is always a felony; trafficking a misdemeanor"],"c":1,"w":"Smuggling can become trafficking if the person is forced to work off the debt. In N.C., smuggling is a misdemeanor; trafficking is a felony."},{"l":"ht","o":2,"t":"f","h":"Who is targeted","b":"There’s no single profile. Traffickers target vulnerability:\n– Homeless people\n– Immigrants (language barriers, distrust of police, isolation)\n– People with addiction or mental illness\n– People in adverse circumstances: gang involvement, past domestic violence or sexual abuse, extreme debt\n– Children, especially with histories of abuse, running away, foster or group homes, LGBTQ rejection\nChildren are recruited online, at malls and theaters, at shelters and transit stations, and by other victims."},{"l":"ht","o":3,"t":"f","h":"How traffickers control victims","b":"It’s mainly psychological; victims don’t have to be beaten or locked up. Force, fraud or coercion is enough.\n– False promises of love, a job or a better life\n– Isolation from family and friends\n– Debt bondage with ever-growing fees and fines\n– Moving victims so they don’t know where they are\n– Taking all their money; controlling access to drugs\n– Shame and threats to expose them; threats against family\n– For immigrants: confiscating documents, threats of deportation, being their only translator"},{"l":"ht","o":3,"t":"q","q":"A worker can come and go but owes an ever-growing “debt” for housing and food that she can never pay off. This is…","a":["Not trafficking since she isn’t locked up","Debt bondage, a form of labor trafficking","Smuggling"],"c":1,"w":"Debt bondage is the least known but most widely used form of labor trafficking."},{"l":"ht","o":5,"t":"f","h":"Victim trauma responses","b":"– Loyalty, gratitude or dependence on the trafficker, sometimes an intimate bond\n– Repeating cover stories the trafficker coached\n– Fragmented, disorganized accounts\n– Immigrant victims may not tell the truth at first: unfamiliar with U.S. law, afraid of punishment for forced crimes, told police won’t help\n– Distrust of police from past arrests or being overlooked as a victim\nMany were already traumatized before being trafficked."},{"l":"ht","o":5,"t":"q","q":"A suspected trafficking victim tells a rehearsed story and defends the man controlling her. You should…","a":["Assume she isn’t a victim","Recognize these as common trauma responses and keep building trust","Arrest her for prostitution"],"c":1,"w":"Coached cover stories and loyalty to the trafficker are common."},{"l":"ht","o":7,"t":"f","h":"Trafficking crimes and classes","b":"Human trafficking: Class C (adult victim), Class B2 (minor).\nInvoluntary servitude: Class F (adult), Class C (minor).\nSexual servitude: Class D (adult), Class C (minor).\nEach violation is a separate offense. Mistake of age and a minor’s consent are not defenses.\nUnlawful sale, surrender or purchase of a minor: Class F felony.\nPromoting prostitution (willfully advancing or profiting from it): Class F felony.\nA party to a labor contract told of involuntary servitude must report it to the sheriff (failing to is a Class 1 misdemeanor)."},{"l":"ht","o":7,"t":"q","q":"A mother lets a man have sex with her 14-year-old daughter in exchange for heroin. Which crime fits?","a":["Unlawful sale, surrender, or purchase of a minor","Promoting prostitution only","Smuggling"],"c":0,"w":"Exchanging something of value for custody or access to a minor is a Class F felony."},{"l":"ht","o":7,"t":"q","q":"A trafficker claims he thought the 16-year-old was 19 and that she agreed. Are those defenses?","a":["Yes, both","No; mistake of age and a minor’s consent are not defenses","Only mistake of age"],"c":1,"w":"Trafficking a minor is a Class B2 felony."},{"l":"ii","o":9,"t":"f","h":"Cognitive load","b":"Cognitive load is the mental effort used in working memory, which has limited capacity.\nLying takes more effort than telling the truth: the liar must suppress the truth, keep the false story straight, monitor their own behavior, and watch your reactions.\nIncrease the load to magnify differences:\n– Reverse order recall: have them tell the story from the end backward. Rehearsed, overly chronological stories break down.\n– Ask for fine details (where exactly was the bar stool? What color?).\nDifferences can be small; look for patterns, not one sign."},{"l":"ii","o":9,"t":"q","q":"A witness gives a smooth, perfectly chronological account. How can you increase cognitive load to test it?","a":["Let them repeat it the same way","Ask them to tell it again starting from the end and working backward","Accuse them of lying"],"c":1,"w":"Truthful people recalling from memory can slowly reverse the order; rehearsed stories tend to fall apart."},{"l":"ii","o":9,"t":"q","q":"Why does lying increase cognitive load?","a":["Liars talk faster","Liars must suppress the truth, remember the false story, and monitor themselves and you","Liars are always nervous"],"c":1,"w":"The brain can only handle a few demanding functions at once."},{"l":"ii","o":9,"t":"q","q":"Which technique increases cognitive load by asking for specifics?","a":["Asking where an object was, its color and size","Asking only yes-or-no questions","Repeating their story back to them"],"c":0,"w":"Detailed descriptions are harder for deceivers than for truth-tellers."},{"l":"ii","o":2,"t":"f","h":"The cognitive interview","b":"For cooperative victims, witnesses or suspects. Recreating the context of the event helps memory; avoid leading them into false memories.\nFive phases:\n1. Introduction (build rapport, explain the process, encourage them to volunteer details)\n2. Open-ended narration\n3. Follow-up questions\n4. Review the statement\n5. Closing\nBenefits: more detailed, more accurate recall, with less anxiety competing for mental resources."},{"l":"ii","o":2,"t":"q","q":"In a cognitive interview, what comes right after the introduction?","a":["Follow-up questions","Open-ended narration","Reviewing the statement"],"c":1,"w":"Let them share everything before you ask specific questions."},{"l":"ii","o":3,"t":"f","h":"P.R.I.D.E.S. (non-custodial interviews)","b":"Plan the interview\nRapport building\nIdentify people\nDevelop information\nEvaluate information\nSummarize\nUsed for victims, witnesses and suspects who aren’t in custody."},{"l":"ii","o":3,"t":"q","q":"What’s the correct order of the P.R.I.D.E.S. interview method?","a":["Plan, Rapport, Identify, Develop, Evaluate, Summarize","Rapport, Plan, Identify, Evaluate, Develop, Summarize","Plan, Identify, Rapport, Develop, Summarize, Evaluate"],"c":0,"w":"It’s for non-custodial interviews. P.R.I.N.C.I.P.L.E.S. is for custodial interrogations."},{"l":"ii","o":4,"t":"f","h":"Field and canvass interviews","b":"Field interview: a brief interaction to learn information from people in public settings, usually non-custodial (no Miranda). Uses include preventing crime, starting conversations, gathering information, building relationships, and determining someone’s involvement. Document reasonable suspicion if it followed a stop.\nCanvass interview: quick questioning of as many people as possible in an area around a crime scene to identify potential witnesses. Do full field interviews with anyone who knows something, and note every address, including those with no answer."},{"l":"ii","o":4,"t":"q","q":"What’s the main purpose of a canvass interview?","a":["To get a confession","To find potential witnesses in the area around a crime","To read Miranda rights"],"c":1,"w":"Questions are brief. Potential witnesses then get a full field interview."},{"l":"ii","o":8,"t":"f","h":"P.R.I.N.C.I.P.L.E.S. (custodial interrogation)","b":"Plan the interrogation\nRapport building\nInterrogation rights (Miranda and waiver)\nNormalize honesty\nClarify information\nIdentify contradictions\nPush through denials\nListen and look\nEvidence gathering\nSummarize\nInterrogation goals: learn facts, get a truthful confession, recover evidence, corroborate theories, and identify or eliminate suspects."},{"l":"ii","o":8,"t":"q","q":"In P.R.I.N.C.I.P.L.E.S., what does the “I” right after Rapport stand for?","a":["Identify contradictions","Interrogation rights (Miranda)","Investigate"],"c":1,"w":"Rights come early, before substantive questioning."},{"l":"ii","o":7,"t":"q","q":"When does the Sixth Amendment right to counsel apply to questioning?","a":["Whenever a person is detained","After adversary proceedings begin (magistrate appearance, first court appearance, or indictment), for the charged offense","Only during trial"],"c":1,"w":"It’s offense-specific and applies in or out of custody."},{"l":"dr","o":2,"t":"f","h":"Officers and traffic laws","b":"§ 20-168(a): in non-emergency driving, officers in government vehicles must obey traffic laws like everyone else, or face criminal and civil liability and discipline.\nTOPS (Total Occupant Protection Strategies): seat belts, airbags, proper seat and mirror adjustment, and hand placement. 42% of officers killed in crashes over 28 years weren’t wearing seat belts.\nPatrol vehicle crashes are the second most common cause of officer deaths."},{"l":"dr","o":3,"t":"f","h":"The driving system","b":"Three components (the Driving Triangle): driver, vehicle, environment.\nHuman error causes about 94% of crashes, and the driver is the only flexible component.\nSafe drivers have a low-risk, high-gain attitude. Aggressiveness and overconfidence lead to high-risk, low-gain driving."},{"l":"dr","o":3,"t":"q","q":"Which component of the driving system causes about 94% of crashes?","a":["The vehicle","The driver","The environment"],"c":1,"w":"The driver is also the only flexible part of the triangle."},{"l":"dr","o":6,"t":"f","h":"S.I.P.D.E. defensive driving","b":"Search: scan the whole environment continuously, both sides and mirrors.\nIdentify: spot hazards early.\nPredict: anticipate what others will do.\nDecide: choose a response.\nExecute: carry it out.\nAny delay in these steps increases crash risk."},{"l":"dr","o":6,"t":"q","q":"What does S.I.P.D.E. stand for?","a":["Search, Identify, Predict, Decide, Execute","Stop, Inspect, Proceed, Drive, Exit","Signal, Inform, Pass, Decelerate, Exit"],"c":0,"w":"It’s the five-step defensive driving process."},{"l":"dr","o":7,"t":"f","h":"Emergency response and due regard","b":"§ 20-145: speed limits don’t apply to officers chasing or apprehending violators, but only when driving with due regard for safety. The exception doesn’t protect against liability for reckless disregard of others’ safety.\nDue regard factors: speed (at 60 mph you travel 88 feet per second, with a stopping distance about a football field), traffic density, visibility, road design, road conditions.\nEmergency response must also be authorized by agency policy."},{"l":"dr","o":7,"t":"q","q":"Under § 20-145, when may an officer exceed the speed limit?","a":["Any time on duty","When chasing or apprehending violators, driving with due regard for safety","Only with a supervisor’s approval"],"c":1,"w":"Reckless disregard for others’ safety still brings liability."},{"l":"mvl","o":6,"t":"f","h":"Stops, signals and turns","b":"Full stop at stop signs and yield to the through highway. Flashing red = stop sign.\nRight on red is allowed after a full stop, unless posted, yielding to pedestrians and traffic.\nMotorcycles and farm equipment may proceed on a steady red after waiting 3 minutes if nothing is coming.\nSignal at least 100 feet before turning; 200 feet in zones of 45 mph or more. No signal is needed if nobody could be affected.\nStop-sign and signal laws (§ 20-158) apply on streets and highways, not parking lots, except DOT-posted access signs."},{"l":"mvl","o":6,"t":"q","q":"In a 55 mph zone, how far before a turn must a driver signal?","a":["100 feet","200 feet","500 feet"],"c":1,"w":"100 feet below 45 mph; 200 feet at 45 mph or more. Only required if another vehicle or pedestrian could be affected."},{"l":"mvl","o":6,"t":"q","q":"A driver ignores a stop sign inside a mall parking lot. Is it a § 20-158 violation?","a":["Yes, always","Generally no; § 20-158 applies to streets and highways, except DOT or local signs controlling access to a highway","Only at night"],"c":1,"w":"Unsafe movement (§ 20-154) does apply in public vehicular areas."},{"l":"mvl","o":6,"t":"f","h":"Right-of-way","b":"Two vehicles arriving at once from different roads: the one on the left yields to the one on the right.\nTurning left: yield to oncoming traffic in or near the intersection.\nYield to pedestrians in marked or unmarked crosswalks.\nTraffic circle: yield to vehicles already in it.\nEntering from a driveway or private road: yield to everyone on the highway and sidewalk.\nGreen light: still proceed with due caution."},{"l":"mvl","o":6,"t":"q","q":"Two cars reach an uncontrolled intersection from different roads at the same time. Who yields?","a":["The car on the right","The car on the left","The faster car"],"c":1,"w":"§ 20-155(a): the driver on the left yields to the driver on the right."},{"l":"mvl","o":6,"t":"f","h":"Emergency vehicles and move over","b":"Failure to yield to an emergency vehicle (§ 20-157): pull to the right and stop when it approaches with lights AND a siren audible from 1,000 feet. Misdemeanor; Class 1 misdemeanor if it causes over $500 damage or injures a responder; Class F felony for serious injury or death. Doesn’t apply on the opposite side of a divided highway.\nMove over (§ 20-157(f)): for an emergency or public service vehicle stopped within 12 feet of the road with lights on, change to a non-adjacent lane if safe; on a one-lane road, slow down and be ready to stop."},{"l":"mvl","o":6,"t":"q","q":"For a driver to be required to yield to your patrol car under § 20-157, you must have activated…","a":["Blue lights only","Both lights and a siren","Siren only"],"c":1,"w":"The siren must be audible from at least 1,000 feet."},{"l":"mvl","o":6,"t":"q","q":"A two-lane road (one lane each way) has a deputy stopped on the shoulder with lights on. An approaching driver must…","a":["Change lanes into oncoming traffic","Slow down and be prepared to stop until past","Do nothing special"],"c":1,"w":"With two or more lanes in your direction, move to a lane not next to the stopped vehicle if safe."},{"l":"mvl","o":6,"t":"f","h":"Passing","b":"No passing: where you can’t see clear road ahead; within 500 feet of a hill or curve you can’t see past; at railroad crossings; at intersections in cities or marked intersections outside; where signs or lines prohibit; or when a car is stopped for pedestrians in a crosswalk.\nPassing on the right is allowed only when the other car is turning left, on multi-lane roads in the same direction, on two-lane one-way streets, or in a right-turn-on-red lane.\nFollowing too closely is an infraction."},{"l":"mvl","o":6,"t":"f","h":"Passing a stopped school bus (§ 20-217)","b":"Stop for a school bus stopped to load or unload with its stop arm out or red lights flashing, whichever direction you’re going. Stay stopped until the arm is withdrawn, the lights are off, and the bus starts moving.\nException: the bus is across an intervening space, like a median or a center turn lane on a road of four or more lanes.\nApplies to buses marked “School Bus” and painted primarily yellow, not church or activity buses.\nMisdemeanor; felony if a person is struck."},{"l":"mvl","o":6,"t":"q","q":"On a four-lane road with a center turn lane, a school bus is stopped with its arm out on the opposite side. Must oncoming traffic stop?","a":["Yes, always","No; the center turn lane is an intervening space on a road of at least four lanes","Only on school days"],"c":1,"w":"On a two-lane road, traffic in both directions must stop."},{"l":"mvl","o":6,"t":"f","h":"Speed laws","b":"Basic speed law: never faster than reasonable and prudent for conditions, even under the posted limit. Failure to reduce speed to avoid a crash is also a violation.\nDefaults: 35 mph in cities, 55 mph outside cities, unless posted.\nOnly black-on-white signs are enforceable; yellow signs are advisory.\nSchool zones apply only when signs give the days and hours (or a flashing light) and school is in session.\nWork zone speeding: $250 penalty, even if no one is working, if properly signed."},{"l":"mvl","o":6,"t":"q","q":"A yellow sign shows “35 MPH” before a curve; the posted limit is 55. A driver takes the curve at 50 in dry weather. Can you charge speeding over the posted limit?","a":["Yes, 15 over","No; yellow signs are advisory, though exceeding a safe speed could apply if conditions warrant","Only if there’s a crash"],"c":1,"w":"Only black-on-white regulatory signs set enforceable limits."},{"l":"mvl","o":6,"t":"q","q":"Without a posted sign, what’s the speed limit outside a city?","a":["45 mph","55 mph","65 mph"],"c":1,"w":"35 mph inside cities."},{"l":"mvl","o":6,"t":"f","h":"Speeding to elude arrest (§ 20-141.5)","b":"Fleeing an officer lawfully performing duties: misdemeanor.\nFelony if two or more aggravating factors: 15+ mph over the limit; gross impairment or 0.14+; reckless driving; negligent driving causing over $1,000 damage or injury; driving while revoked; speeding in a school or work zone; passing a stopped school bus; a child under 12 in the vehicle.\nFelony eluding requires seizing the vehicle. The registered owner is presumed to be the driver."},{"l":"mvl","o":6,"t":"s","q":"A driver flees your blue lights at 20 over the limit with his 8-year-old in the back. Misdemeanor or felony eluding?","a":["Misdemeanor; no one was hurt","Felony: two aggravating factors (15+ over and a child under 12)","Infraction"],"c":1,"w":"Two or more aggravating factors make it a felony, and the vehicle must be seized."},{"l":"mvl","o":6,"t":"f","h":"Reckless, aggressive, racing","b":"Reckless driving (§ 20-140): driving carelessly and heedlessly in willful or wanton disregard of others, or without due caution so as to endanger people or property. Possible even under the speed limit. Misdemeanor.\nAggressive driving: speeding plus reckless driving plus two or more of: red light, stop sign, illegal passing, failing to yield, following too closely.\nRacing: willful (spontaneous) or prearranged; no speeding is needed. Seize vehicles in prearranged racing and street takeovers. A street takeover is Class A1; a repeat offense is Class H."},{"l":"mvl","o":6,"t":"f","h":"Hit and run (§ 20-166)","b":"A driver who knows or should know they were in a crash must stop, regardless of fault. Contact between vehicles isn’t required.\nWith serious injury or death: must stay until an officer allows them to leave (they may leave briefly to get help and return). Willfully failing is a felony.\nInjury crashes: failing to give name, address, license and registration, or to render reasonable aid, is a misdemeanor.\nProperty damage only: must stop and exchange information.\nPassengers can’t drive the vehicle away or help remove it."},{"l":"mvl","o":6,"t":"q","q":"A driver swerves to avoid another car, which crashes into a pole without touching his car. Was he “involved in a crash”?","a":["No, there was no contact","Possibly yes; contact isn’t required if he knew or should have known his vehicle was part of the crash","Only if he was at fault"],"c":1,"w":"The duty to stop applies regardless of fault."},{"l":"mvl","o":7,"t":"f","h":"Motorcycles and autocycles","b":"Motorcycle: an “M” endorsement (or permit), headlight and taillight on at all times, mirror, and DOT helmets on operator and passengers with straps fastened. The operator gets the ticket for a passenger without a helmet. Under 18 can’t carry a passenger. No more than two abreast in one lane.\nAutocycle (three wheels, steering wheel, seat belts): regular license, no “M” needed. Helmets are required unless fully enclosed or with a roll cage."},{"l":"mvl","o":7,"t":"q","q":"A motorcycle passenger has no helmet. Who gets the citation?","a":["The passenger","The operator","Both"],"c":1,"w":"The operator is responsible for passengers complying with the helmet law. The same applies to mopeds."},{"l":"mvl","o":7,"t":"f","h":"Mopeds","b":"Two or three wheels, no external shifting, 50 cc or less, can’t exceed 30 mph on level ground.\nNot a motor vehicle or motorcycle.\nNo driver’s license required, but riders must be 16 or older on public roads or PVAs.\nHelmets required for driver and passenger.\nMust be registered with DMV and insured.\nLaws for all “vehicles” apply, including DWI and red lights; laws only for “motor vehicles” don’t."},{"l":"mvl","o":7,"t":"q","q":"A 15-year-old is riding a moped on a public street. Is that legal?","a":["Yes, no license is needed","No; moped riders must be at least 16 on public roads and PVAs","Yes, if wearing a helmet"],"c":1,"w":"Under 16 may only ride on private property."},{"l":"mvl","o":7,"t":"f","h":"Bicycles","b":"Parents can’t knowingly let a child under 16 ride or be a passenger without a properly fastened helmet.\nChild passengers must sit upright alone on a saddle seat; under 40 pounds or 40 inches requires a restraining seat.\nAt night: a front lamp visible 300 feet and a rear red lamp visible 300 feet (or a bright reflective vest), plus a rear reflector.\nBicycles are vehicles, so DWI can apply."},{"l":"mvl","o":8,"t":"f","h":"DWI (§ 20-138.1)","b":"Driving ANY vehicle (except a horse) on a street, highway or PVA:\n– Under the influence of an impairing substance, OR\n– With an alcohol concentration of 0.08 or more at any relevant time after driving, OR\n– With any amount of a Schedule I drug or its metabolites in blood or urine\nAt 0.08+, no other proof of impairment is needed. You don’t have to prove which substance caused impairment.\nA/C is reported to the hundredth, truncated (0.089 → 0.08)."},{"l":"mvl","o":8,"t":"q","q":"A breath result is 0.089. How is it reported?","a":["0.09","0.08","0.089"],"c":1,"w":"Results are reported to the hundredth and not rounded up."},{"l":"mvl","o":8,"t":"q","q":"Can a person on a bicycle be charged with DWI in N.C.?","a":["No, only motor vehicles","Yes; the statute covers any vehicle except a horse","Only on highways"],"c":1,"w":"It applies on streets, highways and public vehicular areas."},{"l":"mvl","o":8,"t":"f","h":"Implied consent rights and procedures","b":"After charging, the request is made in front of a chemical analyst, who reads the rights orally and in writing:\n– You may refuse, but your license will be revoked for a year\n– Results or refusal are admissible\n– Immediate 30-day revocation at 0.08+ (0.04+ in a commercial vehicle; above 0.01 if under 21)\n– You may get your own test after release\n– You may call a lawyer and pick a witness, but testing won’t wait more than 30 minutes\nBreath test: two samples within 0.02; the lower one proves the per se offense.\nA driver may request a pre-arrest breath test; you must honor it, but don’t have to mention it."},{"l":"mvl","o":8,"t":"q","q":"After implied consent rights are read, how long can testing be delayed for the defendant to reach a lawyer or witness?","a":["No more than 30 minutes","1 hour","Until the lawyer arrives"],"c":0,"w":"30 minutes from the time the defendant is notified of their rights."},{"l":"mvl","o":8,"t":"q","q":"A 19-year-old driver blows 0.02. Is there an immediate 30-day civil revocation?","a":["No, it’s under 0.08","Yes; for drivers under 21, any result above 0.01 triggers it","Only if it’s a commercial vehicle"],"c":1,"w":"Thresholds: 0.08 generally, 0.04 in a commercial vehicle, above 0.01 under 21."},{"l":"mvl","o":8,"t":"q","q":"A DWI suspect is unconscious at the hospital. Does implied consent apply?","a":["Yes, read the rights anyway","No; implied consent doesn’t apply, but a warrant or exigent circumstances can support a blood draw","Nothing can be done"],"c":1,"w":"Refusal also doesn’t prevent getting blood by search warrant."},{"l":"mvl","o":9,"t":"f","h":"Checking stations (§ 20-16.3A)","b":"An exception to the reasonable suspicion requirement, so follow the plan exactly.\nRequirements:\n– Set the pattern in advance (every car, every third car) for stopping and for asking for documents; no officer discretion\n– Operate under a written policy (yours or another agency’s, adopted in writing)\n– At least one patrol car with blue lights on\nThe pattern changes only if traffic becomes hazardous.\nYou need separate reasonable suspicion to stop a car avoiding the checkpoint; an illegal U-turn qualifies, a lawful turn may not.\nIf the driver drank or has an open container, you can request an alcohol screening test."},{"l":"mvl","o":9,"t":"q","q":"A driver makes a lawful right turn onto a side street just before your checkpoint. Can you stop him for avoiding it?","a":["Yes, avoiding a checkpoint is enough","Not on that alone; you need other reasonable suspicion","Yes, if he looked nervous"],"c":1,"w":"An illegal U-turn to avoid the checkpoint would provide reasonable suspicion."},{"l":"mvl","o":9,"t":"q","q":"At a checkpoint where the plan is every third car, can an officer also stop a car he thinks looks suspicious?","a":["Yes","No; officers have no discretion over which cars are stopped under the pattern","Only with supervisor approval"],"c":1,"w":"Any deviation from the plan can make the stop unconstitutional."},{"l":"prc","o":1,"t":"f","h":"Real vs. personal property","b":"Personal property: money, goods, and all things capable of ownership. Larceny applies to personal property.\nReal property: land and anything affixed to it: buildings, fences, water, growing things, minerals.\nThe type and value of property affect the charge: stealing a dog is a Class I felony; property over $1,000 makes larceny a Class H felony."},{"l":"prc","o":2,"t":"f","h":"Larceny terms","b":"Taking: having the property in your possession or control, even for an instant.\nCarry away: any removal from where it was, however slight (moving an AC unit 4–6 inches counts).\nDoctrine of recent possession: possession of recently stolen property, exclusively under the defendant’s control, soon enough after the theft that innocent acquisition is unlikely, supports an inference of guilt.\nBreaking: making any opening, however slight, even opening an unlocked door. Constructive breaking: getting in by trickery or threats.\nEntering: putting any part of the body or an instrument inside."},{"l":"prc","o":2,"t":"q","q":"A suspect opens an unlocked back door and steps in. Is that a “breaking”?","a":["No, nothing was broken","Yes; opening an unlocked door is a breaking","Only if forced"],"c":1,"w":"Breaking means making any opening, however slight. No force or damage is required."},{"l":"prc","o":2,"t":"q","q":"A thief moves a TV a few inches off its stand before being caught. Has he “carried it away”?","a":["No, it didn’t leave the room","Yes; any removal from its original place is enough","Only if he left the building"],"c":1,"w":"Even a bare removal satisfies the element."},{"l":"prc","o":3,"t":"f","h":"Misdemeanor vs. felony larceny","b":"Larceny: taking and carrying away another’s personal property, without consent, intending to permanently deprive, knowing you’re not entitled to it. Class 1 misdemeanor.\nClass H felony if:\n– Value over $1,000 (items in one incident can be added)\n– From the person (any value)\n– From a building, during a breaking or entering or burglary (any value)\n– A firearm (any value), or explosive\n– State Archives records, or livestock (a dog is Class I)\nAlso felony with four prior larceny convictions.\nForce or threats beyond the minimum make it robbery."},{"l":"prc","o":3,"t":"q","q":"A pickpocket lifts a $40 wallet from a man’s back pocket without him noticing. The charge is…","a":["Misdemeanor larceny","Felony larceny from the person","Common law robbery"],"c":1,"w":"Value doesn’t matter for larceny from the person. Violence or intimidation would make it robbery."},{"l":"prc","o":3,"t":"q","q":"Someone steals a $300 handgun from an unlocked truck in a driveway. The charge is…","a":["Misdemeanor larceny, under $1,000","Felony larceny; a firearm makes it a felony regardless of value","Breaking or entering only"],"c":1,"w":"Breaking or entering a vehicle may also apply if he went inside the truck."},{"l":"prc","o":3,"t":"q","q":"A woman steals three items worth $400, $350 and $300 from one store in a single trip. Felony or misdemeanor larceny?","a":["Misdemeanor; each item is under $1,000","Felony; items in one incident can be added ($1,050)","It depends on the store"],"c":1,"w":"Several items taken in one continuous act are one larceny, and their values combine."},{"l":"prc","o":3,"t":"f","h":"Stolen goods and vehicles","b":"Possession of stolen goods: possessing (actually or constructively) property you know or should know is stolen, with dishonest purpose. Class 1 misdemeanor (felony if the larceny was a felony). Buying or selling at a fraction of value suggests knowledge.\nReceiving stolen goods: receiving or concealing property stolen by another, same knowledge.\nPossession of a stolen vehicle: Class H felony. Driving it is enough; being a passenger isn’t.\nUnauthorized use (“joyriding”): taking or operating a motor vehicle, boat or aircraft without consent, with no intent to keep it. Class 1 misdemeanor (aircraft: Class H)."},{"l":"prc","o":3,"t":"q","q":"A passenger is in a car that turns out to be stolen. Is that enough for possession of a stolen vehicle?","a":["Yes","No; mere presence as a passenger isn’t possession","Only if he knew the driver"],"c":1,"w":"Driving the vehicle is sufficient to show possession."},{"l":"prc","o":3,"t":"q","q":"Two teens take a parent’s car without permission for a joyride and return it that night. The best charge is…","a":["Larceny of a motor vehicle","Unauthorized use of a motor vehicle","Possession of a stolen vehicle"],"c":1,"w":"They had no intent to permanently deprive, which larceny requires."},{"l":"prc","o":3,"t":"f","h":"Retail theft","b":"Shoplifting by concealment: willfully concealing unpaid merchandise while still in the store. No intent to permanently deprive is required. Class 3 misdemeanor first offense; higher with priors; Class H felony with a foil-lined bag.\nPrice substitution: switching or altering price tags, then presenting for purchase. Class 3 misdemeanor.\nLarceny from a merchant (Class H felony): larceny plus taking over $200 out an emergency exit, defeating an anti-theft device, using a fake barcode, infant formula over $100, or returning stolen goods for cash or a gift card.\nOrganized retail theft (Class H): conspiring to steal over $1,500 within 90 days to sell for gain; thefts in different counties can be added."},{"l":"prc","o":3,"t":"q","q":"A woman hides a shirt in her purse while still shopping and is stopped before leaving. What’s the charge?","a":["Nothing yet; she hasn’t left","Shoplifting by concealment","Felony larceny from a merchant"],"c":1,"w":"Concealment on the premises is enough. Intent to permanently deprive isn’t an element."},{"l":"prc","o":3,"t":"q","q":"A man takes $250 of merchandise out through a store’s emergency exit. Which charge fits best?","a":["Misdemeanor larceny","Larceny from a merchant (Class H felony)","Shoplifting by concealment"],"c":1,"w":"Over $200 through an emergency exit triggers the felony."},{"l":"prc","o":3,"t":"q","q":"Larceny of a motor vehicle part (like a catalytic converter) is a Class I felony when…","a":["Any part is taken","The cost to repair the vehicle is $1,000 or more","The part is worth over $200"],"c":1,"w":"Repair cost includes the replacement part and installation."},{"l":"prc","o":4,"t":"f","h":"Card, fraud and identity crimes","b":"Financial transaction card theft (Class I): taking a card without consent, intending to use it. Use isn’t required. Cards in two or more other people’s names (not family) is prima facie evidence.\nCard fraud: using a stolen, forged, expired or fraudulently obtained card to get value. Class 2 misdemeanor up to $500 in six months; Class I felony above.\nObtaining property by false pretenses (Class H): a false representation intended to deceive that does deceive and gets something of value.\nIdentity theft (Class G): knowingly using another’s identifying information (living or dead) to pose as them for credit, to avoid legal consequences, or to get anything of value. Class F with three or more victims or if the victim is arrested."},{"l":"prc","o":4,"t":"q","q":"During a traffic stop, a driver gives his brother’s name and license number to avoid a ticket. What crime is that?","a":["Only resisting an officer","Identity theft","Obtaining property by false pretenses"],"c":1,"w":"Using another’s identifying information to avoid legal consequences is identity theft, even if it fails."},{"l":"prc","o":4,"t":"f","h":"Embezzlement","b":"Embezzlement by an employee (Class H): willfully converting a thing of value that was entrusted to them by the employer, intending to steal and defraud.\nThe key is trust: the property must have been in the employee’s care because of the job. A worker who grabs cash from a register they’re never allowed to touch commits larceny, not embezzlement."},{"l":"prc","o":4,"t":"q","q":"A mechanic who never handles payments takes $300 from the open front-office register. The charge is…","a":["Embezzlement","Larceny","False pretenses"],"c":1,"w":"The money wasn’t entrusted to him through his job."},{"l":"prc","o":4,"t":"f","h":"Breaking or entering","b":"B&E of a building: breaking or entering without consent. Class 1 misdemeanor; Class H felony if intending a felony, larceny, or to terrorize or injure an occupant; Class G for a place of worship with that intent.\nB&E of a vehicle (Class I): breaking or entering a motor vehicle, boat, trailer, aircraft or railcar containing something of value, intending a felony or larceny inside.\nPossession of burglar’s tools (Class I): picklocks, crowbars, screwdrivers, etc., possessed without lawful reason for breaking in."},{"l":"prc","o":4,"t":"f","h":"Burglary","b":"First-degree (Class D): breaking AND entering a dwelling of another, at night, while it’s actually occupied, intending a felony or larceny inside.\nSecond-degree (Class G): the same, but the dwelling doesn’t have to be occupied, and it includes buildings within the curtilage (like a detached garage in the yard).\nNight: after sunset and before sunrise, too dark to see a face without artificial light.\nThe offender doesn’t have to know anyone was home. If the intent formed only after entering, it’s misdemeanor B&E."},{"l":"prc","o":4,"t":"q","q":"At 2 a.m., a man breaks into a house to steal while the family sleeps upstairs. The charge is…","a":["Second-degree burglary","First-degree burglary","Felony breaking or entering"],"c":1,"w":"Dwelling, night, and actually occupied make it first-degree."},{"l":"prc","o":4,"t":"q","q":"At midnight a man breaks into a detached garage in a family’s backyard to steal tools. No one is in the garage. The charge is…","a":["First-degree burglary","Second-degree burglary","Misdemeanor trespass"],"c":1,"w":"Second-degree covers buildings within the curtilage and doesn’t require occupancy."},{"l":"prc","o":4,"t":"q","q":"At 2 p.m., a man breaks into an occupied home to steal. Why isn’t it burglary?","a":["It is burglary","Burglary requires nighttime; this is felony breaking or entering","Because someone was home"],"c":1,"w":"Intent to commit larceny inside makes B&E of a building a Class H felony."},{"l":"prc","o":4,"t":"f","h":"Trespass and property damage","b":"First-degree trespass (Class 2 misdemeanor): entering or remaining without authorization in another’s building, or on premises enclosed or secured to keep people out.\nSecond-degree trespass (Class 3 misdemeanor): entering or remaining after being told not to, on property posted so it’s likely to be noticed, or on a home’s curtilage between midnight and 6 a.m. Proof they saw the sign isn’t required.\nInjury to real property: Class 1 misdemeanor.\nInjury to personal property: Class 1 misdemeanor over $200; Class 2 at $200 or less (measured by drop in market value or repair cost)."},{"l":"prc","o":4,"t":"q","q":"A man walks onto a fenced, locked construction site after hours. Which trespass?","a":["First-degree (premises enclosed to keep out intruders)","Second-degree","None, since nothing was damaged"],"c":0,"w":"Second-degree covers being told to leave, posted property, or a home’s curtilage between midnight and 6 a.m."},{"l":"pc","o":1,"t":"f","h":"Three points of contact for evidence","b":"1. The crime scene and adjoining areas: clothing, fingerprints, impressions, damaged property, DNA (an alternate light source helps find fluids), weapons and casings, trace evidence, tools, video, phones.\n2. The victim and their possessions: injuries, clothing, offender DNA, trace, suspect prints on skin.\n3. The suspect and their possessions: injuries, clothing, victim DNA, trace, weapons."},{"l":"pc","o":2,"t":"f","h":"Assault basics","b":"Assault: an overt attempt or show of force that puts a reasonable person in fear of immediate injury. Also a show of violence that makes a victim change what they do.\nBattery: any force applied, however slight. Charged together as simple assault (Class 2 misdemeanor).\nClass A1 misdemeanor if: serious injury (cuts needing stitches, bruises), a deadly weapon, a male 18+ assaulting a female, a child under 12, a government employee on duty, school personnel, a transit operator, or a person with a disability.\nAssault on a sports official: Class 1 misdemeanor."},{"l":"pc","o":2,"t":"q","q":"A 20-year-old man slaps a woman during an argument; she isn’t seriously hurt. The charge is…","a":["Simple assault","Assault on a female (Class A1)","Affray"],"c":1,"w":"It requires a male at least 18 assaulting a female."},{"l":"pc","o":2,"t":"f","h":"Felony assaults","b":"Assault inflicting serious bodily injury: Class F.\nAssault by strangulation causing physical injury: Class H. Visible marks aren’t required.\nAssault with a deadly weapon (AWDW) with intent to kill: Class E.\nAWDW inflicting serious injury: Class E.\nAWDW with intent to kill inflicting serious injury: Class C.\nAssault with a firearm on an officer on duty: Class D.\nAssault inflicting physical injury on an officer: Class H; Class E with serious injury.\nAWDW (not a firearm) on a government employee: Class E.\nPointing a gun at someone (loaded or not, even jokingly): Class A1 misdemeanor."},{"l":"pc","o":2,"t":"q","q":"A suspect shoots at a deputy during a traffic stop but misses. Which charge carries the higher punishment?","a":["AWDW on a government employee (Class E)","Assault with a firearm on a law enforcement officer (Class D)","Simple assault"],"c":1,"w":"With a firearm against an officer, charge § 14-34.5. For other deadly weapons, use § 14-34.2."},{"l":"pc","o":2,"t":"q","q":"A man jokingly points an unloaded pistol at a friend. Is it a crime?","a":["No, it was a joke","Yes, assault by pointing a gun (Class A1)","Only if the gun was loaded"],"c":1,"w":"Pointing a gun intentionally, loaded or unloaded, even in fun, meets the elements. Airsoft and pellet guns don’t count."},{"l":"pc","o":2,"t":"q","q":"A suspect pushes an officer during an arrest, causing a scraped knee. What’s the charge?","a":["Simple assault","Assault inflicting physical injury on an officer (Class H)","Resisting only"],"c":1,"w":"Physical injury includes cuts, scrapes and bruises. Serious injury raises it to Class E."},{"l":"pc","o":2,"t":"q","q":"What’s the difference between “serious injury” and “serious bodily injury”?","a":["They’re identical","Serious injury (like stitches) needs less proof; serious bodily injury involves risk of death, permanent disfigurement,
