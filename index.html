<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PATROLscroller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7ebf0; --surface:#ffffff; --ink:#141a22; --muted:#596476; --line:#d2d9e1;
  --assc:#2450a6; --cp:#1d7552; --cct:#a03825; --mvl:#6b3fa0; --cde:#00707a; --crt:#7a5b12; --cs:#a1306b; --crp:#3d6b1f; --ori:#4a5563; --cap:#8a4b00; --ci:#3b4fb8; --cri:#007a5e; --dp:#5a4a78; --dv:#b0244f; --crw:#5f6b00; --hc:#9c2a1c; --fn:#2d6a8a; --eps:#6d4c1f; --fa:#3a3a3a; --fr:#c0392b; --exp:#b35c00; --mp:#1f6f8b; --hs:#4b5d23; --jv:#8e3b8e; --ht:#a3341f; --ii:#2f4f9e; --dr:#5c6670; --prc:#7a5200; --pc:#8a1f3d; --ohw:#2e7d4f; --pt:#34495e; --rd:#7b1f1f; --tc:#3d3d8f; --sa:#7a2e5c; --rcv:#2a7a7a; --tp:#555b2a; --tle:#1f5f99; --tci:#996b1f; --hot:#b3261e; --saved:#9a6a00;
  --right:#1d7552; --right-bg:#e2f3ea; --wrong:#b3261e; --wrong-bg:#fbe5e3;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1319; --surface:#171f29; --ink:#e7ecf2; --muted:#97a3b4; --line:#283442;
    --assc:#86a8f2; --cp:#5fc797; --cct:#f2907a; --mvl:#bb9cf2; --cde:#5cc9d2; --crt:#e0bd6a; --cs:#f08cc0; --crp:#9fd27a; --ori:#aeb8c6; --cap:#f0a65c; --ci:#9eacf5; --cri:#56d1ae; --dp:#c2b2e6; --dv:#f58aa8; --crw:#c9d45a; --hc:#f2937f; --fn:#86c3e3; --eps:#d9b27a; --fa:#c8c8c8; --fr:#ff9a8f; --exp:#ffb366; --mp:#7fc9e3; --hs:#b8cf7a; --jv:#e3a1e3; --ht:#f4a08e; --ii:#9fb5f2; --dr:#b6c0c9; --prc:#e0b866; --pc:#f08fae; --ohw:#7fd6a3; --pt:#a9bccf; --rd:#f29b9b; --tc:#a8a8f0; --sa:#e8a0cc; --rcv:#7fd9d9; --tp:#c4cc80; --tle:#8fc3f2; --tci:#e6c27a; --hot:#ff8a80; --saved:#e8b64a;
    --right:#5fc797; --right-bg:#123326; --wrong:#ff8a80; --wrong-bg:#3a1a19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#171f29; --ink:#e7ecf2; --muted:#97a3b4; --line:#283442;
  --assc:#86a8f2; --cp:#5fc797; --cct:#f2907a; --mvl:#bb9cf2; --cde:#5cc9d2; --crt:#e0bd6a; --cs:#f08cc0; --crp:#9fd27a; --ori:#aeb8c6; --cap:#f0a65c; --ci:#9eacf5; --cri:#56d1ae; --dp:#c2b2e6; --dv:#f58aa8; --crw:#c9d45a; --hc:#f2937f; --fn:#86c3e3; --eps:#d9b27a; --fa:#c8c8c8; --fr:#ff9a8f; --exp:#ffb366; --mp:#7fc9e3; --hs:#b8cf7a; --jv:#e3a1e3; --ht:#f4a08e; --ii:#9fb5f2; --dr:#b6c0c9; --prc:#e0b866; --pc:#f08fae; --ohw:#7fd6a3; --pt:#a9bccf; --rd:#f29b9b; --tc:#a8a8f0; --sa:#e8a0cc; --rcv:#7fd9d9; --tp:#c4cc80; --tle:#8fc3f2; --tci:#e6c27a; --hot:#ff8a80; --saved:#e8b64a;
  --right:#5fc797; --right-bg:#123326; --wrong:#ff8a80; --wrong-bg:#3a1a19;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:1rem; line-height:1.55;
  display:grid; grid-template-rows:auto 1fr; grid-template-columns:minmax(0,1fr); overflow:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--assc);outline-offset:2px}

header{background:var(--surface);border-bottom:1px solid var(--line);z-index:5;min-width:0}
.bar{max-width:40rem;margin:0 auto;padding:.6rem 1rem .5rem;display:flex;align-items:center;gap:.75rem}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.5rem;letter-spacing:.01em;margin:0;flex:1;line-height:1;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.stats{all:unset;flex:none;cursor:pointer;display:flex;gap:.9rem;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;border-radius:6px;padding:.2rem .3rem}
.stats b{color:var(--ink)}
.iconbtn{all:unset;flex:none;cursor:pointer;width:2rem;height:2rem;display:grid;place-items:center;border-radius:8px;font-size:1.05rem}
.chips{max-width:40rem;margin:0 auto;padding:0 1rem .6rem;display:flex;gap:.45rem;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{all:unset;cursor:pointer;white-space:nowrap;font-size:.85rem;font-weight:600;padding:.3rem .75rem;border-radius:999px;border:1.5px solid var(--line);color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--surface);background:var(--ink);border-color:var(--ink)}
.chip[data-f="assc"][aria-pressed="true"]{background:var(--assc);border-color:var(--assc)}
.chip[data-f="cp"][aria-pressed="true"]{background:var(--cp);border-color:var(--cp)}
.chip[data-f="cct"][aria-pressed="true"]{background:var(--cct);border-color:var(--cct)}
.chip[data-f="mvl"][aria-pressed="true"]{background:var(--mvl);border-color:var(--mvl)}
.chip[data-f="hot"][aria-pressed="true"]{background:var(--hot);border-color:var(--hot)}
.chip.sel{padding:0;display:flex;align-items:center}
.chip.sel select{font:inherit;font-weight:600;color:inherit;background:transparent;border:0;padding:.3rem 1.6rem .3rem .75rem;border-radius:999px;cursor:pointer;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 8px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.chip.sel[aria-pressed="true"]{background:var(--lc,var(--ink));border-color:var(--lc,var(--ink));color:var(--surface)}
.chip.sel select option{color:#141a22;background:#fff}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.chip[data-f="saved"][aria-pressed="true"]{background:var(--saved);border-color:var(--saved)}
.chip[data-f="missed"][aria-pressed="true"]{background:var(--wrong);border-color:var(--wrong)}

#feed{min-width:0;overflow-x:hidden;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;height:100%}
.card{
  scroll-snap-align:start; scroll-snap-stop:always;
  min-height:100%; display:flex; align-items:center; justify-content:center;
  padding:1.25rem 1rem 2.5rem;
}
.sheet{width:100%;max-width:36rem}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:.35rem .6rem;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:.9rem}
.tag{white-space:nowrap;flex:none;color:var(--surface);background:var(--lc);padding:.15rem .55rem;border-radius:5px;font-weight:700}
.tag{background:var(--lc)}
.hy{white-space:nowrap;flex:none;color:var(--hot);font-weight:700}
.kind{margin-left:auto;font-weight:700;white-space:nowrap;flex:none}
.kind{color:var(--lc)}
.headline{
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;
  font-size:clamp(2rem,7.5vw,3rem);line-height:1.02;letter-spacing:-.005em;margin:0 0 1rem;
  text-wrap:balance;
}
.question{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:clamp(1.45rem,5.2vw,1.95rem);line-height:1.15;margin:0 0 1.1rem;text-wrap:pretty}
.body p{margin:0 0 .7rem;max-width:62ch}
.body ul{margin:0 0 .7rem;padding-left:1.15rem}
.body li{margin:.2rem 0}
.body li::marker{color:var(--lc)}
.opts{display:grid;gap:.55rem}
.opt{
  all:unset;cursor:pointer;display:flex;gap:.7rem;align-items:flex-start;
  background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:.8rem .95rem;line-height:1.35;
}
.opt .k{flex:none;width:1.5rem;height:1.5rem;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.78rem;font-weight:700;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--right);background:var(--right-bg)}
.opt.right .k{background:var(--right);border-color:var(--right);color:var(--surface)}
.opt.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.opt.wrong .k{background:var(--wrong);border-color:var(--wrong);color:var(--surface)}
.opt.dim{opacity:.55}
.why{margin-top:.9rem;padding:.8rem .95rem;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.why strong{display:block;margin-bottom:.2rem}
.why.ok strong{color:var(--right)} .why.no strong{color:var(--wrong)}
.actions{display:flex;gap:.5rem;margin-top:1.1rem}
.act{all:unset;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted);padding:.35rem .7rem;border-radius:999px;border:1.5px solid var(--line)}
.act[aria-pressed="true"]{color:var(--saved);border-color:var(--saved)}

.intro .headline{font-size:clamp(2.6rem,11vw,4.2rem)}
.intro .lede{font-size:1.08rem;margin:0 0 1rem;max-width:34rem}
.legend{display:grid;gap:.4rem;margin:1.2rem 0;font-size:.92rem}
.legend span{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-right:.5rem;vertical-align:-1px}
.hint{font-size:.85rem;color:var(--muted);margin-top:1.4rem}
.empty .headline{font-size:2rem}

#panel{position:fixed;inset:0;z-index:20;display:none;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px)}
#panel.show{display:grid;place-items:center;padding:1rem}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.3rem;width:100%;max-width:26rem}
.pbox h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.7rem;margin:0 0 .8rem;line-height:1}
.prow{display:grid;grid-template-columns:1fr auto;gap:.15rem .8rem;margin-bottom:.8rem;font-size:.92rem}
.pbar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%}
.pbtns{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem}
.pbtns button{cursor:pointer;border-radius:999px;padding:.45rem 1rem;border:1.5px solid var(--line);background:transparent;font-weight:600}
.pbtns .primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
@media (prefers-reduced-motion:reduce){#feed{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>PATROLscroller</h1>
    <button class="stats" id="statsBtn" aria-label="Show progress"><span><b id="sAns">0</b> done</span><span><b id="sPct">–</b> right</span></button>
    <button class="iconbtn" id="theme" aria-label="Switch light or dark">◐</button>
  </div>
  <div class="chips" role="toolbar" aria-label="Filter cards">
    <button class="chip" data-f="all" aria-pressed="true">All</button>
    <button class="chip" data-f="hot" aria-pressed="false">High-yield</button>
    <label class="chip sel" aria-pressed="false"><span class="vh">Lesson</span><select id="lessonSel" aria-label="Pick a lesson"><option value="">One lesson…</option></select></label>
    <button class="chip" data-f="missed" aria-pressed="false">Missed</button>
    <button class="chip" data-f="saved" aria-pressed="false">Saved</button>
  </div>
</header>
<main id="feed" aria-label="Study cards"></main>
<div id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <div class="pbox">
    <h2 id="ptitle">Your progress</h2>
    <div id="prows"></div>
    <div class="pbtns"><button id="reset">Reset progress</button><button class="primary" id="pclose">Back to scrolling</button></div>
  </div>
</div>

ame":"Patrol Techniques","short":"Patrol Techniques","obj":{"3":"Types of patrol","4":"Contact & cover"}},"rd":{"name":"Rapid Deployment","short":"Rapid Deployment","obj":{"4":"Response priorities","5":"Contact team","7":"Suspect options"}},"tc":{"name":"Testifying in Court","short":"Testifying in Court","obj":{"1":"N.C. courts","2":"Initial appearance","3":"Administrative court","4":"District vs. superior","5":"Plea bargaining","6":"Impeachment","7":"Hearsay","8":"Preparing for court","10":"Giglio"}},"sa":{"name":"Sexual Assaults","short":"Sexual Assaults","obj":{"1":"Myths","2":"Underreporting","3":"Survivor reactions","6":"Sexual assault crimes"}},"rcv":{"name":"Responding to Crime Victims","short":"Crime Victims","obj":{"1":"Definitions","2":"Signs of trauma","3":"Communicating with victims","5":"Victims’ rights","6":"Victims compensation"}},"tp":{"name":"Transporting & Processing Arrestees","short":"Transport & Processing","obj":{"4":"Arrestee photos","5":"Arrestee DNA"}},"tle":{"name":"Traffic Law Enforcement","short":"Traffic Enforcement","obj":{"1":"Phases of enforcement"}},"tci":{"name":"Traffic Crash Investigation","short":"Crash Investigation","obj":{"3":"Reportable crashes"}}};
const CARDS=[{"l":"assc","o":1,"t":"f","h":"Four sources of law","b":"Constitutional law: the U.S. and N.C. constitutions plus court interpretations.\nStatutory law: written by legislatures. In N.C., the General Assembly.\nOrdinances: laws written by cities and counties.\nCommon law: judge-made case law. N.C. examples include conspiracy and voluntary and involuntary manslaughter."},{"l":"assc","o":1,"t":"q","q":"N.C.G.S. 20-138.1 (Driving While Impaired) is an example of which kind of law?","a":["Constitutional law","Statutory law","Common law"],"c":1,"w":"Statutes are enacted by a legislature. The General Assembly writes N.C. statutes; cities and counties write ordinances."},{"l":"assc","o":1,"t":"q","q":"Which kind of law is made by judges and fills gaps where no statute exists?","a":["Procedural law","Common law","Statutory law"],"c":1,"w":"Common law is case law. It stays binding unless a statute or court decision expressly abandons it."},{"l":"assc","o":2,"t":"f","h":"Substantive vs. procedural","b":"Substantive law defines rights and duties and prohibits conduct. Robbery, larceny and assault are substantive.\nProcedural law sets out how substantive law is enforced. The statutes for issuing, executing and returning search warrants are procedural."},{"l":"assc","o":2,"t":"q","q":"The rules for issuing, executing and returning a search warrant are…","a":["Substantive law","Procedural law","Common law"],"c":1,"w":"Procedural law specifies the methods and requirements for enforcing substantive law."},{"l":"assc","o":3,"t":"f","h":"Speech the First Amendment doesn’t protect","b":"– Obscenity\n– Fighting words meant and likely to provoke immediate violence\n– True threats\n– Incendiary speech urging imminent lawless action\nOfficers are expected to tolerate more verbal abuse than ordinary civilians because of their training."},{"l":"assc","o":3,"t":"q","q":"A bystander is video-recording you during a traffic stop. Under the First Amendment, this is…","a":["Protected","Obstruction","Protected only with the driver’s permission"],"c":0,"w":"People have a First Amendment right to record police performing duties in public, and that extends to traffic stops."},{"l":"assc","o":3,"t":"f","h":"Fourth, Fifth and Sixth at a glance","b":"4th: No unreasonable searches or seizures. The exclusionary rule (Mapp v. Ohio) keeps illegally obtained evidence out of court.\n5th: No double jeopardy and no compelled self-incrimination.\n6th: Right to be told the charges, a speedy public trial, an impartial jury, to confront witnesses, and to counsel."},{"l":"assc","o":3,"t":"q","q":"A defendant is tried in state court for conduct that also violates federal law. Can the federal government prosecute too?","a":["No, that’s double jeopardy","Yes, separate sovereigns may each prosecute","Only if the state trial ended in acquittal"],"c":1,"w":"When conduct violates the laws of two sovereigns, each may try and punish it. Double jeopardy also doesn’t apply to civil actions."},{"l":"assc","o":3,"t":"f","h":"Why the Fourteenth matters to you","b":"The Fourteenth Amendment applies most Bill of Rights protections to the states. Without it, the U.S. Supreme Court couldn’t review state decisions on search and seizure, self-incrimination and right to counsel.\nIt guarantees due process and equal protection."},{"l":"assc","o":4,"t":"q","q":"The state must give a driver notice and a chance to rebut the evidence before suspending a license. That is…","a":["Substantive due process","Procedural due process","Equal protection"],"c":1,"w":"Procedural due process: no taking of life, liberty or property without notice and a meaningful opportunity to be heard. Substantive due process bars infringing fundamental liberties at all unless narrowly tailored to a compelling state interest."},{"l":"assc","o":5,"t":"f","h":"Civil liability","b":"Civil liability is potential responsibility to pay money damages or other court sanctions from a lawsuit. Under 42 U.S.C. § 1983, officers can be sued personally for violating clearly established constitutional rights.\nCommon claims:\n– False arrest (no probable cause)\n– Unreasonable force\n– Malicious prosecution\n– Failure to intervene"},{"l":"assc","o":6,"t":"f","h":"Sheriff vs. city jurisdiction","b":"Sheriffs and deputies: anywhere in the county, on county property outside the county, and anywhere in N.C. for a felony committed in their county.\nCity officers: within the city, within one mile of city limits, and on city property outside the city."},{"l":"assc","o":6,"t":"q","q":"A city officer may make an arrest within how far of the city limits?","a":["Half a mile","One mile","Three miles"],"c":1,"w":"City officers may arrest inside the city, within one mile of the limits, and on city property outside the city."},{"l":"assc","o":6,"t":"f","h":"Immediate and continuous pursuit","b":"If an offense is committed in your jurisdiction, you can pursue and arrest anywhere in N.C. You must keep pursuing and not stop to do something else, but you don’t have to keep the suspect in sight.\nOut of state: only into Georgia, Virginia, South Carolina or Tennessee, and only for a felony committed in N.C. (plus DWI in Georgia and South Carolina)."},{"l":"assc","o":6,"t":"q","q":"Which agency’s officers have statewide jurisdiction?","a":["County ABC officers","Campus police","N.C. State Highway Patrol"],"c":2,"w":"Statewide: Highway Patrol, DMV, SBI, ALE, Wildlife Resources Commission, and Probation and Parole."},{"l":"assc","o":6,"t":"q","q":"A foreign diplomat with full immunity is speeding. You may…","a":["Arrest and hold for the State Department","Issue a citation but not arrest or detain","Detain until the consulate arrives"],"c":1,"w":"Diplomats with immunity may get traffic citations, but they can’t be arrested, detained or prosecuted. Verify status with the State Department’s Office of Protocol."},{"l":"assc","o":9,"t":"f","h":"Reasonable suspicion","b":"Particularized, articulable facts that lead a reasonable officer, based on training and experience, to believe criminal activity has happened, is happening, or is about to happen.\nMore than a hunch, less than probable cause. You don’t have to rule out innocent explanations.\nIt’s the standard for investigative stops and frisks."},{"l":"assc","o":9,"t":"f","h":"Probable cause","b":"Facts and reasonably trustworthy information that would lead a prudent person to believe a crime was probably committed and the suspect probably committed it.\nThe level is a fair probability: more than reasonable suspicion, less than “more likely than not.”\nArrests and most searches require it."},{"l":"assc","o":9,"t":"q","q":"Which level of proof is required to frisk someone?","a":["A hunch","Reasonable suspicion that the person is armed and dangerous","Probable cause"],"c":1,"w":"A frisk is a limited weapons search, not a full search, so reasonable suspicion is enough. But it has to be suspicion the person is armed and dangerous, not just suspicion of a crime."},{"l":"assc","o":9,"t":"f","h":"When illegally obtained evidence can still come in","b":"The exclusionary rule has exceptions: inevitable discovery, independent source, and a non-Mirandized statement used to impeach a defendant who testifies.\nUnder N.C. law, evidence is also excluded for a substantial violation of Chapter 15A. An officer’s objectively reasonable good-faith belief is a defense to a 15A-based motion to suppress."},{"l":"assc","o":7,"t":"f","h":"Miranda needs two things","b":"Custody AND interrogation.\nIn custody but not being questioned: no warnings needed.\nQuestioned but not in custody: no warnings needed."},{"l":"assc","o":7,"t":"f","h":"The custody test","b":"Would a reasonable person in the suspect’s position believe they were under arrest, or restrained to the degree of a formal arrest?\nIt’s objective. What the officer privately intends doesn’t matter if nothing is said or done to show it.\nFor juveniles (J.D.B. v. North Carolina), ask what a reasonable child of that age would believe."},{"l":"assc","o":7,"t":"q","q":"You stop a car for weaving and ask the driver, “Have you had anything to drink?” before any Miranda warnings. The driver says “Two beers.” Is the answer admissible?","a":["No, the driver was seized so Miranda applied","Yes, an ordinary traffic stop isn’t custody","Only if you had probable cause first"],"c":1,"w":"A traffic stop is a Fourth Amendment seizure but not Fifth Amendment custody (Berkemer v. McCarty)."},{"l":"assc","o":7,"t":"q","q":"An officer handcuffs a man, puts him in a patrol car and says “You’re not under arrest, you’re in secure custody.” For Miranda, he is…","a":["Not in custody, because the officer said so","In custody","In custody only after transport"],"c":1,"w":"State v. Johnston: a reasonable person handcuffed and placed in a police car would believe he was under arrest, whatever the label."},{"l":"assc","o":7,"t":"f","h":"Interrogation is more than questions","b":"It includes any words or actions officers should know are reasonably likely to draw an incriminating response (Rhode Island v. Innis).\nBrewer v. Williams: the “Christian burial speech” to a religious suspect counted as interrogation.\nInnis: a few offhand remarks between officers about a missing shotgun did not."},{"l":"assc","o":7,"t":"f","h":"When Miranda isn’t required","b":"– Routine booking questions (Pennsylvania v. Muniz)\n– Public safety questions, such as where a gun is (New York v. Quarles)\n– Spontaneous or volunteered statements\n– Ordinary traffic stops\n– Questioning by private persons not acting for police"},{"l":"assc","o":7,"t":"q","q":"A man is arrested for statutory rape. Before Miranda, booking asks his date of birth. Is that answer admissible?","a":["Yes, it’s a routine booking question","No, his age is an element of the crime","Yes, if it’s written on a form"],"c":1,"w":"State v. Locklear: a booking question that goes to an element of the charged crime needs Miranda warnings and a waiver first."},{"l":"assc","o":7,"t":"q","q":"Under the public safety exception, once the emergency is resolved you must…","a":["Keep questioning until the case is complete","Obtain a Miranda waiver before further interrogation","Release the suspect"],"c":1,"w":"Public safety questions must be limited to what’s reasonably needed to address the danger. After that, warnings and a waiver are required."},{"l":"assc","o":7,"t":"f","h":"Adult Miranda warnings","b":"1. You have the right to remain silent.\n2. What you say may be used in court against you.\n3. You have the right to have a lawyer present during interrogation.\n4. You have the right to an appointed lawyer if you can’t afford one.\nBest practice: read them word for word from a card, not from memory."},{"l":"assc","o":7,"t":"f","h":"Juvenile rights under 18 (§ 7B-2101)","b":"1. You have the right to remain silent.\n2. Any statement can be used against you.\n3. Ages 16–17: right to a parent, guardian, custodian or caretaker present. Under 16: right to a parent, guardian or custodian present.\n4. Right to consult an attorney and to have one appointed before questioning, regardless of ability to pay."},{"l":"assc","o":7,"t":"q","q":"A 15-year-old in custody knowingly waives his rights with no parent, guardian, custodian or attorney present and confesses. The confession is…","a":["Admissible, the waiver was knowing","Inadmissible","Admissible if recorded"],"c":1,"w":"Under 16, no in-custody confession from interrogation is admissible unless made with a parent, guardian, custodian or attorney present. A 15-year-old can’t waive that right."},{"l":"assc","o":7,"t":"q","q":"A 17-year-old in custody wants to waive his rights, but his mother isn’t there. Can he?","a":["No, a parent must be present","Yes, if the waiver is knowing, willing and understanding","Only with a judge’s order"],"c":1,"w":"16- and 17-year-olds can waive without a parent present. Also remember a parent can never waive rights on a juvenile’s behalf."},{"l":"assc","o":7,"t":"f","h":"A valid waiver is…","b":"Knowing: they were properly informed and understand the rights.\nVoluntary: a free choice, not coercion, threats or false promises.\nIntelligent: they understand the rights and the consequences of waiving them.\nThe State must prove the waiver by a preponderance of the evidence. Waivers can be express (written or spoken) or implied by conduct (Berghuis v. Thompkins)."},{"l":"assc","o":7,"t":"q","q":"Which statement by an officer would most likely make a confession involuntary?","a":["“I’ll tell the DA you cooperated.”","“If you don’t confess, your wife gets arrested.”","“We found your prints at the scene,” when they hadn’t"],"c":1,"w":"Veiled threats are prohibited. Lying about evidence isn’t automatically involuntary; it’s one factor in the totality of the circumstances. Telling the DA about cooperation is allowed."},{"l":"assc","o":7,"t":"q","q":"During custodial questioning a suspect says, “Maybe I should talk to a lawyer.” This is…","a":["A clear invocation, stop immediately","Ambiguous, so clarify what they want","A waiver"],"c":1,"w":"The invocation must be unambiguous. You may continue, but best practice is to ask, for example, “Are you invoking your right to counsel?”"},{"l":"assc","o":7,"t":"f","h":"Clear vs. unclear invocation","b":"Clear silence: “I do not want to talk.” “I don’t have anything to say.” “I will not talk to the police.”\nUnclear silence: “Do I have to say anything?” “I’m not sure I can talk to you.” Simply not answering.\nClear counsel: “I want an attorney.” “I will not talk without my lawyer.”\nUnclear counsel: “Do I need an attorney?” “What can a lawyer do for me?”"},{"l":"assc","o":7,"t":"f","h":"Re-approaching after silence","b":"If the suspect only invoked silence, you may re-approach if you scrupulously honored it and waited a significant period (Michigan v. Mosley: two hours). N.C. cases treat at least two hours as a meaningful break.\nStop immediately, don’t coax, wait, re-read Miranda, and get a new waiver.\nFifteen minutes was held too short."},{"l":"assc","o":7,"t":"f","h":"After the right to counsel is invoked","b":"While the suspect stays in custody, no officer may start interrogation on any crime unless:\n– The lawyer is present\n– The suspect starts the conversation\n– There’s been a break in custody of at least 14 days (Maryland v. Shatzer)\nAll officers, even from other agencies, are presumed to know about the invocation."},{"l":"assc","o":7,"t":"q","q":"A suspect asked for a lawyer and was released. Twenty days later he’s arrested on a new charge. May officers seek a Miranda waiver?","a":["No, the request lasts forever","Yes, the 14-day break in custody has passed","Only with his lawyer present"],"c":1,"w":"After a break in custody of 14 days or more, the earlier invocation no longer bars questioning. Give fresh warnings and get a waiver. A pending charged case still needs a Sixth Amendment waiver."},{"l":"assc","o":7,"t":"f","h":"Recorded interrogations (§ 15A-211)","b":"At a place of detention, custodial interrogations must be recorded in their entirety for:\n– Class A, B1 and B2 felonies\n– Class C rape, sex offense, or assault with a deadly weapon with intent to kill inflicting serious injury\n– All juveniles, for any crime\n“In its entirety” means from the reading of rights through the end of questioning."},{"l":"assc","o":7,"t":"f","h":"Sixth Amendment right to counsel","b":"Attaches at whichever comes first: initial appearance before a magistrate, first appearance in district court, or indictment.\nIt’s offense-specific (Texas v. Cobb) and applies in or out of custody.\nOfficers and informants can’t deliberately elicit statements about a charged offense without a waiver (the Massiah rule), but an informant can act as a “listening post.”"},{"l":"assc","o":7,"t":"q","q":"Does the issuance of an arrest warrant trigger the Sixth Amendment right to counsel?","a":["Yes, always","No, unless it’s based on an indictment","Only for felonies"],"c":1,"w":"The warrant alone doesn’t start adversary judicial proceedings. The magistrate appearance, district court first appearance or indictment does."},{"l":"assc","o":8,"t":"f","h":"Graham v. Connor","b":"Force is judged by objective reasonableness: from the view of a reasonable officer on the scene, not with 20/20 hindsight, allowing for split-second decisions.\nFour factors, none ranked above the others:\n– Severity of the crime\n– Immediate threat to officers or others (must be present for force likely to cause serious injury)\n– Active resistance\n– Attempting to evade by flight"},{"l":"assc","o":8,"t":"q","q":"In Graham v. Connor, the officer’s intent or motivation is…","a":["The most important factor","Irrelevant to whether force was reasonable","Required to be documented"],"c":1,"w":"The question is whether a reasonable officer in the same circumstances would have concluded the force was justified."},{"l":"assc","o":8,"t":"f","h":"Armstrong v. Village of Pinehurst","b":"A man under a commitment order wrapped himself around a post. Within about 30 seconds of being told, officers used a conducted energy weapon five times in two minutes. He died.\nThe Fourth Circuit held a CEW may only be used on an actively resisting subject who poses a risk of immediate danger that force could reduce. Physical resistance doesn’t automatically equal immediate danger."},{"l":"assc","o":8,"t":"q","q":"A calm, unarmed subject passively holds onto a fence and refuses to move. Under Armstrong, using a Taser is…","a":["Justified because he’s noncompliant","Likely unreasonable, since there’s no risk of immediate danger","Justified after one warning"],"c":1,"w":"Noncompliance justifies some force, but serious injurious force like a CEW requires a risk of immediate danger."},{"l":"assc","o":8,"t":"f","h":"Deadly force under N.C. law","b":"Justified only:\n1. To defend yourself or a third person from what you reasonably believe is the use or imminent use of deadly force.\n2. To arrest or prevent escape of someone escaping with a deadly weapon, or who shows they pose an imminent threat of death or serious injury unless caught without delay.\n3. To prevent escape of someone in custody because of a felony conviction (check agency policy)."},{"l":"assc","o":8,"t":"q","q":"An unarmed burglary suspect runs from you and poses no threat to anyone. Deadly force is…","a":["Justified because burglary is a felony","Not justified","Justified if he’s a convicted felon"],"c":1,"w":"Deadly force against a fleeing felony suspect who poses no immediate threat is unconstitutional. The “convicted felon” provision covers escape from custody imposed by a conviction, not suspects."},{"l":"assc","o":8,"t":"f","h":"Duty to intervene","b":"Federal: under § 1983, an officer who knows a fellow officer is violating someone’s rights, has a reasonable chance to stop it, and doesn’t can be liable (bystander liability).\nN.C.: § 15A-401(d1) requires intervening when you see unreasonable force and reporting it to a supervisor within 72 hours, whether or not you were able to stop it."},{"l":"assc","o":8,"t":"q","q":"You witness a fellow officer use excessive force. Under N.C. law, you must report it to a supervisor within…","a":["24 hours","48 hours","72 hours"],"c":2,"w":"§ 15A-401(d1) requires timely reporting to a supervisor within 72 hours."},{"l":"assc","o":10,"t":"f","h":"Objective factors courts accept","b":"– Your observations, training and experience\n– Information from other officers or civilians\n– Time of day\n– Known high-crime area (not enough alone)\n– Proximity to a recent crime\n– Flight from a crime scene\n– Suspect is a stranger to the area\n– Suspect’s reaction to police, including flight\n– Relevant prior criminal record"},{"l":"assc","o":10,"t":"q","q":"A man sees your patrol car and runs. That’s the only fact you have. Can you stop him?","a":["Yes, flight is reasonable suspicion","No, flight alone isn’t enough","Yes, if it’s daytime"],"c":1,"w":"Flight is one factor. Flight plus another, such as a high-crime area (Illinois v. Wardlow), is reasonable suspicion."},{"l":"assc","o":10,"t":"f","h":"When is someone seized?","b":"When they submit to a show of authority (“Stop!”, pulling over for blue lights), or when an officer intentionally applies physical force, even if the person gets away.\nThe test is objective: would a reasonable, innocent person feel free to leave or end the encounter?\nThe more intrusive the seizure, the more proof you need."},{"l":"assc","o":10,"t":"s","q":"You see a man snatch a purse. You yell “Police! Stop!” and chase him. Another officer catches him four blocks away. When was he seized?","a":["When you yelled “Stop!”","When the other officer caught him","He was never seized"],"c":1,"w":"A show of authority is a seizure only when the person submits. He kept running, so he was seized when caught."},{"l":"assc","o":10,"t":"s","q":"A deputy lightly touches a man’s shoulder at a flea market and says, “Please hold up a minute; I need to talk to you.” The man stops. Voluntary encounter or seizure?","a":["Voluntary encounter","Seizure","Arrest"],"c":1,"w":"Physical contact plus a command to stop would make a reasonable person feel they can’t leave."},{"l":"assc","o":10,"t":"f","h":"Keeping an encounter voluntary","b":"– Tell them they’re not under arrest, are free to leave, and don’t have to answer\n– Avoid commands like “Stop,” “Come here,” “I need you to stay”\n– Don’t touch them\n– Don’t block their path or surround them\nAs long as it stays voluntary, the Fourth Amendment doesn’t apply."},{"l":"assc","o":10,"t":"f","h":"Terry stops","b":"A brief, warrantless seizure on reasonable suspicion to confirm or dispel suspicion of crime.\nBe brief and diligent. Twenty minutes is a rough guide, not a rule; serious or dangerous cases allow more time.\nDon’t move the suspect elsewhere without strong justification like safety.\nAn anonymous tip alone, even a detailed one, isn’t enough. Corroborate it."},{"l":"assc","o":10,"t":"s","q":"You stop Mark on a warrant. He shows it was cleared yesterday, and you confirm it. Backup keeps questioning him for 15 more minutes. Lawful?","a":["Yes, the stop was valid at the start","No, the reasonable suspicion ended when the warrant was confirmed cleared","Yes, under 20 minutes is always fine"],"c":1,"w":"Once suspicion is dispelled, the detention must end. Further questioning is OK only if the encounter becomes voluntary."},{"l":"assc","o":10,"t":"f","h":"Frisks","b":"A stop and a frisk must each be justified. The stop needs reasonable suspicion of crime. The frisk needs reasonable suspicion the person is armed and dangerous.\nStops for violent crimes or drug dealing justify an automatic frisk.\nUse a slide touch with continuous contact, not pats, over outer clothing."},{"l":"assc","o":10,"t":"s","q":"During a lawful frisk, you feel an object, squeeze and move it inside the pocket, then decide it’s packets of heroin. Is the seizure lawful?","a":["Yes, under plain feel","No, you manipulated the object","Yes, because the stop was lawful"],"c":1,"w":"Minnesota v. Dickerson: plain feel only works if it’s immediately apparent the item is contraband without manipulating it."},{"l":"assc","o":10,"t":"f","h":"Vehicle frisk vs. vehicle search","b":"Frisk: with reasonable suspicion a person is dangerous and could get a weapon, check the passenger compartment, including unlocked containers within reach. Not the trunk or locked containers.\nMotor vehicle exception: with probable cause the vehicle has evidence and it’s in a public place, search anywhere evidence could be, including the trunk and locked containers."},{"l":"assc","o":14,"t":"q","q":"You arrest a driver only for driving while license revoked. Under Arizona v. Gant, may you search the passenger compartment incident to arrest?","a":["Yes, always after an arrest","No, there’s no reason to believe evidence of that crime is inside","Yes, if he’s handcuffed"],"c":1,"w":"Gant allows a search incident to arrest only if there’s reason to believe evidence of the crime of arrest may be in the passenger compartment."},{"l":"assc","o":14,"t":"f","h":"Protective sweeps","b":"A quick check for people only, not evidence, done with an arrest inside a building.\nSpaces immediately adjoining the place of arrest can be checked automatically. Going further needs reason to believe a dangerous person is there.\nLook only where a person could hide, and only as long as needed. Evidence in plain view may be seized; otherwise freeze the scene and get a warrant."},{"l":"assc","o":14,"t":"s","q":"Deputies arrest Eric in a bedroom. Seeing a light under the cracked basement door, one deputy sweeps the basement and finds a handgun inside a small cardboard box. Can the gun be seized?","a":["Yes, the sweep was lawful","No, a person couldn’t hide in the box","Yes, weapons are always seizable"],"c":1,"w":"Entering the basement was a lawful sweep. Opening a box too small to hold a person wasn’t."},{"l":"assc","o":11,"t":"f","h":"Required on every arrest (§ 15A-401(c)(2))","b":"1. Identify yourself as an officer unless it’s obvious.\n2. Tell the person they’re under arrest.\n3. Tell them the charge as promptly as reasonable, unless it’s evident."},{"l":"assc","o":11,"t":"f","h":"Warrantless arrest (§ 15A-401)","b":"Any criminal offense committed in your presence.\nOutside your presence, with probable cause:\n– Any felony\n– A misdemeanor where the person won’t be caught or may cause injury or property damage unless arrested now\n– Concealment of merchandise, domestic criminal trespass, DWI (including commercial vehicle)\n– Certain assaults against someone they have a personal relationship with\n– Violating a domestic violence protective order\n– Violating certain pretrial release orders"},{"l":"assc","o":11,"t":"q","q":"A store clerk reports a shoplifter concealed merchandise before you arrived. You have probable cause. Can you arrest without a warrant?","a":["No, it wasn’t in your presence","Yes, concealment of merchandise is a listed exception","Only if the value exceeds $1,000"],"c":1,"w":"Concealment of merchandise is one of the misdemeanors you can arrest for without a warrant even if it happened outside your presence."},{"l":"assc","o":11,"t":"q","q":"Two strangers had a fistfight (simple assault) before you arrived. Both are calm and you know where they live. Can you arrest without a warrant?","a":["Yes, any assault qualifies","Generally no; get a warrant or use a citation","Yes, if one wants to press charges"],"c":1,"w":"Out-of-presence simple assault qualifies only with a personal (domestic) relationship, or if they won’t be caught or may cause injury or damage unless arrested now."},{"l":"assc","o":11,"t":"f","h":"Entering a home with an arrest warrant","b":"Under § 15A-401(e):\n– You have the warrant or a valid copy (electronic display counts)\n– Reasonable cause to believe the person is inside\n– Give notice of authority and purpose, unless that would present a clear danger to human life\n– Force is OK if entry is denied or unreasonably delayed\nA third party’s home also needs a search warrant, absent consent or exigency."},{"l":"assc","o":11,"t":"q","q":"An unserved paper arrest warrant must be returned after how many days?","a":["30","90","180"],"c":2,"w":"Paper warrants: return after 180 days. Electronic warrants printed and not served within 24 hours are recorded unserved and paper copies destroyed. Missing either deadline doesn’t invalidate the warrant."},{"l":"assc","o":11,"t":"q","q":"Under Lange v. California, chasing a misdemeanor suspect into his home is…","a":["Always allowed as hot pursuit","Allowed only if exigent circumstances exist","Never allowed"],"c":1,"w":"The pursuit itself doesn’t create exigency. You need a real need to protect life or prevent evidence destruction."},{"l":"assc","o":11,"t":"f","h":"Other criminal processes","b":"Order for arrest: issued by a judicial official, often after failure to appear or an indictment.\nCitation: issued by the officer, orders appearance on a misdemeanor or infraction.\nCriminal summons: charges a crime and orders appearance; no arrest.\nMagistrate’s order: charges an offense after a warrantless arrest, on a finding of probable cause."},{"l":"assc","o":12,"t":"f","h":"Private-person detention (§ 15A-404)","b":"North Carolina has no “citizen’s arrest.” A private person with probable cause may detain someone who committed in their presence:\n1. A felony\n2. A breach of the peace\n3. An offense causing physical injury to another\n4. An offense involving theft or destruction of property\nThey must immediately notify police, surrender the person, and act reasonably."},{"l":"assc","o":12,"t":"q","q":"Which is NOT one of the four grounds for a private person to detain someone in N.C.?","a":["A felony in their presence","A breach of the peace","A misdemeanor they heard about from a friend"],"c":2,"w":"The offense must be committed in the private person’s presence, and they need probable cause."},{"l":"assc","o":13,"t":"f","h":"Civilians assisting officers (§ 15A-405)","b":"When an officer asks, a private person may help make an arrest or prevent escape. They aren’t required to.\nIf they help, they have the same authority as an officer, aren’t criminally or civilly liable when lawfully helping, and get workers’ comp if hurt and an officer’s death benefits if killed."},{"l":"assc","o":11,"t":"f","h":"After the arrest","b":"– Take them to a magistrate without unnecessary delay\n– Let them contact a lawyer, family and friends\n– Look for a Medic Alert bracelet on anyone unconscious or disabled\n– Place minor children with an approved adult, or call DSS\n– Get a qualified interpreter immediately for a deaf arrestee\n– Give the prosecutor your complete file. Willfully withholding is a Class H felony."},{"l":"assc","o":14,"t":"f","h":"What is a search?","b":"A government intrusion where a person has a reasonable expectation of privacy: they expect privacy, and society agrees that’s reasonable.\nAlso a search: physically trespassing to get information, like a GPS tracker on a car (U.S. v. Jones) or a drug dog on a front porch (Florida v. Jardines)."},{"l":"assc","o":14,"t":"f","h":"Curtilage","b":"The area around a home tied to home life: driveways, decks, gardens, pools, garages, sheds. It carries the home’s privacy.\nAsk:\n– How close is it to the house?\n– Is it inside an enclosure that also surrounds the house?\n– How is it used?\n– Did the resident block public access or view?\nUsing the normal front path for a knock and talk is not a search."},{"l":"assc","o":14,"t":"q","q":"Officers walk through a fenced field posted “No Trespassing,” well away from the house, and see marijuana plants. Was this a Fourth Amendment search?","a":["Yes, the fence created privacy","No, open fields have no reasonable expectation of privacy","Yes, because they trespassed"],"c":1,"w":"Open fields beyond the curtilage aren’t protected, even with fences and signs."},{"l":"assc","o":14,"t":"s","q":"As officers approach, a suspect on the sidewalk tosses a locked canister into her own fenced yard. Officers hop the fence and open it. Lawful?","a":["Yes, she abandoned it","No, you can’t abandon property inside your own curtilage","Yes, it was in plain view"],"c":1,"w":"State v. Reed: tossing an item into your own curtilage isn’t abandonment. Had she dropped it on the sidewalk, that would be different."},{"l":"assc","o":14,"t":"q","q":"Trash bags left at the curb for pickup, outside the curtilage, can be searched…","a":["Only with a warrant","Without a warrant","Only with consent"],"c":1,"w":"California v. Greenwood: there’s no reasonable expectation of privacy in garbage left at the curb for collection."},{"l":"assc","o":14,"t":"f","h":"Plain view: three requirements","b":"1. You’re lawfully in the place where you see it.\n2. Its incriminating nature is immediately apparent (probable cause).\n3. You have a lawful right of access to it.\nSeeing contraband through a home’s window from the sidewalk still requires a warrant, consent or exigency to go in and get it."},{"l":"assc","o":14,"t":"s","q":"Executing a warrant for a stolen TV, an officer sees a gun on the coffee table with its serial number visibly removed, without touching it. Can it be seized?","a":["No, it’s not on the warrant","Yes, it’s in plain view","Only with a second warrant"],"c":1,"w":"It’s plainly contraband. If the officer had to move the gun to see the serial number, that would be a search (Arizona v. Hicks)."},{"l":"assc","o":14,"t":"f","h":"Devices, dogs and drones","b":"Flashlights and binoculars are fine.\nA drug dog sniff in public or around a lawfully stopped car isn’t a search, but the dog can’t go where you couldn’t.\nThermal imaging and similar tech not available to the public needs a warrant.\nAircraft in lawful navigable airspace are fine. Drones over private property generally need a warrant, with listed exceptions such as imminent danger, a missing person, or terrorism."},{"l":"assc","o":14,"t":"f","h":"Consent searches","b":"No level of suspicion is needed, but consent must be voluntary and clear.\nYou don’t have to tell them they can refuse.\nYou may say you’ll apply for a warrant if you have grounds, but never claim you have one when you don’t.\nThey control the scope and can stop the search anytime.\nIf two co-occupants are present and one objects, there’s no valid consent."},{"l":"assc","o":14,"t":"s","q":"A suspect says, “You can search my car for the television.” You lift the hood and find heroin in the engine compartment. Lawful?","a":["Yes, consent covers the whole car","No, it exceeded the scope of consent","Yes, under plain view"],"c":1,"w":"A 40-inch TV can’t fit in an engine compartment. Scope is what a reasonable person would understand from the exchange."},{"l":"assc","o":14,"t":"q","q":"Who can consent to a search of a rented apartment the tenant still lives in?","a":["The landlord","The tenant","The property manager"],"c":1,"w":"Only the tenant, unless the tenant has abandoned or permanently left. Similarly, an employer can’t consent to an employee’s exclusive locker or desk."},{"l":"assc","o":14,"t":"f","h":"Exigent circumstances","b":"You need both probable cause to search and a likelihood that, without immediate action, officers are endangered or evidence will be destroyed or removed.\nFactors: imminent destruction of evidence, risk of violence, seriousness of the offense, and how long a warrant would take.\nOnce the scene is secure and the urgency is gone, get a warrant."},{"l":"assc","o":14,"t":"s","q":"Officers answer an alarm: the back door is open and a window broken. They enter to check for intruders, find no one, then open a kitchen drawer and see heroin. Which part was lawful?","a":["Both","The entry, not the drawer","Neither"],"c":1,"w":"Entry was justified by exigency. No person could be in a drawer, so opening it went beyond the purpose (State v. Woods)."},{"l":"assc","o":14,"t":"f","h":"Urgent necessity (§ 15A-285)","b":"When reasonably believed urgently necessary to save a life, prevent serious bodily harm, or avert or control a public catastrophe, you may enter premises, limit who’s present, and control others’ property.\nIt can’t be used to enforce the law or seize evidence, but plain-view items inside may be seized.\nYou can’t enter a home just to remove weapons without a warrant, consent or exigency."},{"l":"assc","o":14,"t":"f","h":"Search incident to arrest","b":"Automatic with a valid custodial arrest, done close in time and place.\nIt’s a full search of the person and the area within immediate control (wallet, purse, pockets).\nNo search incident to a citation.\nYou may search just before announcing the arrest if probable cause already existed and what you find isn’t part of it."},{"l":"assc","o":14,"t":"q","q":"You arrest someone and seize their cell phone. May you scroll through it?","a":["Yes, incident to arrest","No, not without a warrant, consent or exigency","Yes, if unlocked"],"c":1,"w":"Riley v. California: phones can be seized at arrest, but their data needs a warrant, consent or exigency. The rule covers tablets and laptops too."},{"l":"assc","o":14,"t":"f","h":"Strip and cavity searches","b":"Strip search: probable cause the person hid a weapon or evidence of the arrest crime that a normal search wouldn’t find. Do it in private, with one witness, same gender, without touching the arrestee.\nBody cavity search: requires a search warrant and a licensed medical professional."},{"l":"assc","o":15,"t":"f","h":"Who can issue a search warrant","b":"Appellate and superior court judges: valid statewide.\nDistrict court judges: valid in their judicial district.\nClerks of superior court (and assistant and deputy clerks) and magistrates: valid in their county."},{"l":"assc","o":15,"t":"f","h":"Executing a search warrant","b":"Execute within 48 hours of issuance, or it’s void and returned marked “not executed.”\nAny officer with territorial and subject-matter jurisdiction may execute it; the affiant doesn’t have to.\nDay or night is OK, but be ready to explain why you went at night."},{"l":"assc","o":15,"t":"q","q":"A search warrant must be executed within how many hours of issuance?","a":["24","48","72"],"c":1,"w":"48 hours. Double-check that the executed date and time fall within that window before the return."},{"l":"assc","o":15,"t":"f","h":"Knock, announce, read, leave copies","b":"Give notice of identity and purpose before entering, even if that might let evidence be destroyed. No-knock entry only with probable cause that notice would endanger life.\nRead the warrant (not the application) to the person in control. Give them copies of the warrant and application, or leave copies conspicuously if no one’s home.\nGive a signed receipt (AOC-CR-206) for items taken, and return the warrant to the clerk without unnecessary delay."},{"l":"assc","o":15,"t":"f","h":"People present during a warrant","b":"Public place: you may detain only people named in the warrant; frisk others only with reasonable suspicion they’re armed and dangerous.\nPrivate place: you may detain anyone present and frisk if armed or dangerous. Fully search an unnamed person only if the named contraband hasn’t been found and could be on them."},{"l":"assc","o":15,"t":"q","q":"Can officers get historical cell-site location records from a phone carrier without a warrant?","a":["Yes, it’s third-party data","No, Carpenter v. U.S. requires a warrant","Yes, with a subpoena"],"c":1,"w":"Historical location data needs a warrant. The Fourth Circuit allows exigent real-time location access (U.S. v. Hobbs)."},{"l":"assc","o":15,"t":"f","h":"No crime-scene exception","b":"Mincey v. Arizona: a four-day warrantless search of a homicide scene was unconstitutional. Exigency justified entering and a sweep for victims and suspects, nothing more.\nAfter the sweep, freeze the scene and get a warrant or valid consent."},{"l":"assc","o":16,"t":"f","h":"Nontestimonial identification orders","b":"Used for fingerprints, hair, saliva, handwriting, voice, photos, lineups, GSR, and similar, but not blood.\nRequested by a prosecutor. Issued only by a judge (not magistrates or clerks). Not for suspects in custody, and not for interrogation.\nThe affidavit must show:\n1. Probable cause a felony or Class A1 or Class 1 misdemeanor was committed\n2. Reasonable grounds to suspect the named person did it\n3. Results will materially aid the investigation"},{"l":"assc","o":16,"t":"q","q":"Which two legal standards does a nontestimonial ID order rest on?","a":["Probable cause the person did it, and a warrant","Probable cause a crime occurred, and reasonable suspicion the person did it","Reasonable suspicion of both"],"c":1,"w":"It fills the gap when a crime is clearly established but you only have reasonable suspicion about who did it."},{"l":"assc","o":16,"t":"q","q":"A nontestimonial ID order must be served at least how long before the procedure?","a":["24 hours","48 hours","72 hours"],"c":2,"w":"72 hours, unless the judge modifies it. The person can’t be held more than six hours unless arrested, and the order is returned within 90 days."},{"l":"assc","o":16,"t":"q","q":"A person refuses to comply with a nontestimonial ID order. That refusal is…","a":["Probable cause to arrest","Grounds for contempt of court, not arrest","A felony"],"c":1,"w":"Resisting isn’t probable cause to arrest by itself, but the court may hold the person in contempt."},{"l":"cp","o":1,"t":"f","h":"Four functions of civil process","b":"1. Giving notice\n2. Preserving the status quo\n3. Providing remedies for parties\n4. Enforcing decisions of the courts"},{"l":"cp","o":1,"t":"q","q":"Which is NOT one of the four functions of civil process?","a":["Giving notice","Punishing the defendant","Preserving the status quo"],"c":1,"w":"Punishment belongs to criminal actions. A civil action is legally defined as everything that isn’t a criminal action."},{"l":"cp","o":1,"t":"f","h":"Which court hears what","b":"Small claims (magistrate): usually $10,000 or less, and summary ejectments.\nDistrict court: usually $10,001 to $25,000, plus domestic matters. 50B and 50C cases must be filed here.\nSuperior court: usually over $25,000, plus special proceedings.\nNo filing fee for domestic violence protective orders or civil no-contact orders."},{"l":"cp","o":2,"t":"f","h":"Who can serve","b":"The sheriff or a deputy of the county where service is made. Municipal officers also have statutory authority.\nThe plaintiff can also serve without the sheriff by certified or signature-confirmation mail, return receipt requested, or a delivery service like FedEx or UPS.\nA summons isn’t validly issued until the clerk, assistant clerk or deputy clerk signs and dates it."},{"l":"cp","o":2,"t":"f","h":"Six types of parties","b":"1. Natural person (including sole proprietorships)\n2. Natural person under disability (minor or incompetent)\n3. Domestic or foreign corporation\n4. Partnership\n5. Unincorporated association\n6. Political subdivisions: the State or a state agency, and units of local government"},{"l":"cp","o":2,"t":"q","q":"A summons names “Sam Barber d/b/a Main Street Esso.” Serve it as…","a":["A corporation","A partnership","A natural person"],"c":2,"w":"“d/b/a” (doing business as) or “t/a” (trading as) signals a sole proprietorship. The owner is the defendant, so serve Sam Barber as a natural person."},{"l":"cp","o":2,"t":"q","q":"For civil service purposes, a person in prison is…","a":["Under a legal disability","Not under a legal disability","Served only through the warden"],"c":1,"w":"Disability means a minor (under 18) or someone incompetent to manage their affairs. Incarceration or physical disability alone doesn’t count."},{"l":"cp","o":3,"t":"f","h":"Eight types of civil process","b":"1. Magistrate summons (AOC-CVM-100)\n2. Civil summons (AOC-CV-100)\n3. Juvenile summons: delinquent/undisciplined (AOC-J-340) and abuse/neglect/dependency (AOC-J-142)\n4. Termination of parental rights summons (AOC-J-208)\n5. Subpoena (AOC-G-100)\n6. Domestic violence (50B) process\n7. Civil no-contact (50C) process\n8. Workplace violence prevention (Chapter 95) process"},{"l":"cp","o":3,"t":"q","q":"After being served with a civil summons (AOC-CV-100), the defendant has how long to file an answer?","a":["10 days","30 days","60 days"],"c":1,"w":"30 days after service. If they don’t answer, a default judgment may be entered without a trial."},{"l":"cp","o":3,"t":"q","q":"A subpoena duces tecum orders a person to…","a":["Testify only","Produce documents or other evidence","Pay a judgment"],"c":1,"w":"A subpoena to produce evidence. AOC-G-100 can serve as a subpoena to testify, to produce, or both."},{"l":"cp","o":3,"t":"q","q":"What separates a 50C civil no-contact case from a 50B domestic violence case?","a":["50C has a filing fee","In 50C the parties have no “personal relationship”","50C is filed in superior court"],"c":1,"w":"50C covers stalking or nonconsensual sexual conduct where the parties don’t have a personal relationship as defined in § 50B-1."},{"l":"cp","o":4,"t":"f","h":"Serving a natural person","b":"Any of three methods, all equally valid:\n1. Hand it to the defendant personally, anywhere in your county, any day or time.\n2. Leave it at their dwelling or usual place of abode with a person of suitable age and discretion who lives there.\n3. Deliver it to an agent authorized by appointment or by law.\nYou don’t have to try one method before another. Only publication requires showing the others weren’t feasible."},{"l":"cp","o":4,"t":"q","q":"Can you leave a summons with the defendant’s 15-year-old son at their home?","a":["Never, he’s a minor","Possibly, if he’s mature enough to understand and pass it on","Only with a parent’s permission"],"c":1,"w":"N.C. upheld service on a 15-year-old son. The person must live there and understand what’s happening. Ask questions and note your reasoning on the return."},{"l":"cp","o":4,"t":"s","q":"A wife has sued her husband for divorce but they still live together. Can you serve him by leaving the papers with her at home?","a":["Yes, she lives there","No, leaving it with the plaintiff isn’t valid","Yes, if he’s at work"],"c":1,"w":"Leaving papers with the plaintiff is never valid substitute service, even if they share the dwelling."},{"l":"cp","o":4,"t":"q","q":"You see the defendant’s roommate at the grocery store. Can you leave the papers with the roommate there?","a":["Yes, the roommate lives with him","No, substitute service must be at the dwelling","Yes, if he promises to deliver it"],"c":1,"w":"Leaving papers with a co-resident only works at the dwelling or usual place of abode."},{"l":"cp","o":4,"t":"q","q":"An out-of-state driver causes a crash in N.C. By law, their agent for service is…","a":["Their insurance company","The N.C. Commissioner of Motor Vehicles","The Secretary of State"],"c":1,"w":"Driving in N.C. automatically appoints the Commissioner of Motor Vehicles as agent for actions arising from the accident."},{"l":"cp","o":4,"t":"f","h":"Persons under disability: serve twice","b":"Serve the defendant AND a second person:\n– Minor: a parent or guardian with custody, or the person caring for the child. If none, a guardian ad litem.\n– Adjudicated incompetent: their general guardian. A guardian of the person alone can’t accept service. Ask to see letters of appointment (AOC-E-413).\n– Not adjudicated: a guardian ad litem."},{"l":"cp","o":4,"t":"f","h":"Serving a corporation","b":"1. Deliver to an officer, director or managing agent.\n2. Leave it in their office with the person apparently in charge (ask questions; after-hours service on an impostor failed).\n3. Deliver to the registered agent, found on the Secretary of State’s website.\nIf there’s no registered agent or they can’t be found, the Secretary of State becomes the agent. LLCs and PLLCs also have registered agents."},{"l":"cp","o":4,"t":"q","q":"You’re serving a limited partnership. Which person can you NOT serve to reach the partnership?","a":["A general partner","A limited partner","An attorney-in-fact for the partnership"],"c":1,"w":"Serving a limited partner isn’t valid. Also, serving one general partner doesn’t serve the other partners sued as individuals; each must be served."},{"l":"cp","o":4,"t":"f","h":"Serving government","b":"State of N.C.: personally deliver to the Attorney General or a deputy or assistant AG.\nState agency: its designated process agent, or the AG if none.\nCity: the mayor, city manager or city clerk.\nCounty: the county manager, chair or any member of the board of commissioners, or the clerk to the board.\nIt must be personal delivery. Leaving it at their office or home isn’t valid, and neither is serving the county attorney."},{"l":"cp","o":4,"t":"q","q":"You leave a summons against the county with the county manager’s secretary. Is that valid?","a":["Yes, she’s apparently in charge","No, local governments must be served by personal delivery to the listed officials","Yes, if she signs"],"c":1,"w":"The “apparently in charge” option applies to corporations and partnerships, not local governments."},{"l":"cp","o":4,"t":"f","h":"Juvenile summonses","b":"Delinquent or undisciplined (AOC-J-340): personally serve the juvenile AND the parent, guardian or custodian separately, at least five days before the hearing. Leaving it with someone else at the home is not valid. Return to the clerk if still unserved after 30 days.\nAbuse, neglect or dependency (AOC-J-142): any civil-summons method, at least five days before the hearing."},{"l":"cp","o":4,"t":"f","h":"Summary ejectment: four steps","b":"1. Mail the summons and complaint to the defendant by the end of the next business day, in the plaintiff’s stamped envelope.\n2. You MAY phone within five days of issuance to arrange service.\n3. Make at least one visit within five days of issuance, at least two days before the hearing, at a time likely to find them home. Serve personally or leave with a suitable resident.\n4. If that fails, post copies conspicuously on the premises."},{"l":"cp","o":4,"t":"q","q":"A summary ejectment complaint asks for back rent, and you serve it only by posting. The court can…","a":["Award possession and back rent","Award possession but not money damages","Award nothing"],"c":1,"w":"Posting is enough to return the property but not for a money judgment. Try hard to serve personally when money is requested (line 5 on AOC-CVM-201)."},{"l":"cp","o":4,"t":"f","h":"Serving subpoenas","b":"Anyone 18 or older who isn’t a party may serve. Always include side two.\nTo testify: personal delivery, or by telephone by a sheriff’s designee who confirms they’re talking to the named person. No voicemail, texts or messages with others. Parties can also use certified mail.\nTo produce: personal delivery or certified mail only. Never by phone.\nDon’t serve out-of-state subpoenas. The party must get an N.C. subpoena from the clerk."},{"l":"cp","o":4,"t":"q","q":"You call a witness to serve a subpoena to testify and get voicemail. You leave the details. Is the witness served?","a":["Yes, the message has the details","No, you must actually speak to the named person","Yes, if you text too"],"c":1,"w":"Telephone service requires speaking with the person named and confirming their identity."},{"l":"cp","o":4,"t":"f","h":"Domestic violence (50B) process","b":"Serve the complaint (CV-303), summons (CV-317), notice of hearing (CV-305), and any ex parte order (CV-304). Any natural-person method works, but law enforcement must serve. No fee.\nWith an ex parte order, the hearing must be within 10 days of issuance or 7 days after service, whichever is later. Serve promptly.\nA show-cause order for contempt (CV-308) must be personally delivered."},{"l":"cp","o":4,"t":"f","h":"Mandatory arrest for DVPO violations","b":"You SHALL arrest without a warrant on probable cause that the defendant violated an order excluding them from the residence or ordering them to refrain from threatening, abusing, following, harassing, cruelty to a pet, or otherwise interfering.\nA knowing violation is a Class A1 misdemeanor; repeated violations or violations while armed can be felonies.\nEnforce out-of-state and tribal orders as if issued here. They don’t need to be registered."},{"l":"cp","o":4,"t":"q","q":"A woman shows you a valid Virginia protective order and says her ex just violated it. It isn’t registered in N.C. Can you enforce it?","a":["No, it must be registered","Yes, enforce it like an N.C. order","Only with a Virginia officer present"],"c":1,"w":"Foreign orders must be enforced. You may rely on a copy and her statement that it’s in effect, and check NCIC. A false statement about validity is a Class 2 misdemeanor."},{"l":"cp","o":4,"t":"q","q":"Someone violates a 50C civil no-contact order. The ordinary remedy is…","a":["Mandatory arrest","Contempt of court","A Class A1 misdemeanor charge"],"c":1,"w":"Violating a 50C or workplace violence no-contact order is not by itself a crime. The remedy is contempt. 50C papers must be served personally, and the defendant has 10 days to respond."},{"l":"cp","o":4,"t":"f","h":"When they refuse service","b":"A defendant can’t refuse to be served. After telling them what it is, you may drop the papers at their feet.\nIn Lemon v. Combs, a deputy identified herself, said she had a summons and they had 30 days to respond, then dropped the papers at the defendant’s feet as he walked away. Service was valid.\nDescribe exactly what happened on the return."},{"l":"cp","o":5,"t":"f","h":"Making the return","b":"The return is your sworn statement to the court. Answer who, what, when, where, why and how.\nState facts, not conclusions. Instead of “after due and diligent search, not to be found,” list the dates, times and attempts.\nYou can cross out form boxes or attach a signed sheet.\nA return showing legal service is prima facie evidence of service."},{"l":"cp","o":5,"t":"q","q":"Which return entry is better?","a":["“After due and diligent search, not to be found.”","“Went to 12 Oak St. on 5/6 at 10 a.m. and 5/8 at 6:30 p.m.; no answer; two cars in driveway on 5/8.”","“Defendant avoiding service.”"],"c":1,"w":"Courts want facts. The others are conclusions."},{"l":"cp","o":5,"t":"f","h":"Return contents by party","b":"Personal service: defendant’s name, date, that it was personal, and place (best practice).\nSubstitute service: date, place, name of the person it was left with, and that they’re of suitable age and discretion and live there.\nCorporation: the corporation as defendant, plus date, place, and name and title of who received it. Example: “ABC, Inc. served by delivering to Robert Smith, Registered Agent, at 4505 Main St.”"},{"l":"cp","o":5,"t":"q","q":"A sheriff’s office willfully makes a false return. What’s the criminal penalty?","a":["Infraction","Class 1 misdemeanor","Class H felony"],"c":1,"w":"A willful false return or refusal to return process is a Class 1 misdemeanor. The sheriff can also owe up to $500 to the person harmed."},{"l":"cp","o":5,"t":"q","q":"The service fee wasn’t paid. What do you do with the paper?","a":["Throw it out","Return it to the court noting it wasn’t served because the fee wasn’t paid","Serve it anyway and bill later"],"c":1,"w":"Nonpayment excuses service, but not the duty to return it with the reason."},{"l":"cp","o":6,"t":"f","h":"Time limits","b":"Civil summons and TPR summons: serve within 60 days of issuance.\nMagistrate summons (not ejectment): valid 60 days; serve at least 5 days before the hearing.\nSummary ejectment: within 5 days of issuance and at least 2 days before the hearing.\nJuvenile summonses: at least 5 days before the hearing. Delinquent ones are returned if unserved after 30 days.\n50B, 50C and workplace summonses: 60 days, but treat as urgent."},{"l":"cp","o":6,"t":"q","q":"An ordinary civil summons must be served within how many days of issuance?","a":["5","30","60"],"c":2,"w":"60 days, counting weekends and holidays. Return it immediately after service or when the 60 days expire."},{"l":"cp","o":6,"t":"q","q":"A summary ejectment magistrate summons must be served within ___ days of issuance and at least ___ days before the hearing.","a":["5 and 2","10 and 5","30 and 5"],"c":0,"w":"Cases must be set for trial within seven working days, so service is fast."},{"l":"cp","o":6,"t":"f","h":"Counting days","b":"Don’t count the day of the act; do count the last day. If the last day is a weekend or court holiday, it rolls to the next business day.\nFor periods under seven days, skip intermediate weekends and holidays. For seven days or more, count them.\nA “holiday” means the courthouse is closed. Columbus Day and Presidents’ Day don’t count if it’s open."},{"l":"cp","o":7,"t":"f","h":"AOC forms and fees","b":"Standard forms are at nccourts.gov/documents/forms. Search by number only (for example, 100 for AOC-CV-100). The number is in the form’s bottom-left corner.\nService fees are collected in advance, one fee per party served. Several papers served on the same party at once count as one fee.\nNo service fee for juror summonses, 50B papers, or 50C papers."},{"l":"cp","o":7,"t":"q","q":"One civil summons must be served on three defendants. How many service fees are charged?","a":["One","Two","Three"],"c":2,"w":"The fee is per party served."},{"l":"cp","o":8,"t":"f","h":"Child custody orders","b":"You may take physical custody of a child only with a Warrant Directing Law Enforcement to Take Immediate Physical Custody (AOC-CV-667) signed by an N.C. judge.\nAn order saying “assist plaintiff with taking custody” isn’t enough without that warrant.\nOut-of-state orders also need N.C. registration or an expedited-enforcement order, plus the CV-667.\nThe normal remedy for violations is civil contempt."},{"l":"cp","o":8,"t":"q","q":"A mother shows you an N.C. temporary custody order directing law enforcement to deliver the child to her. There’s no AOC-CV-667. Can you take the child?","a":["Yes, the order directs it","No, you need the separate CV-667 warrant","Yes, if the child agrees"],"c":1,"w":"A temporary custody order alone doesn’t authorize taking a child. A judge must also sign the CV-667."},{"l":"cp","o":8,"t":"f","h":"Repossessions","b":"Self-help repossession is legal only without a breach of the peace. If anyone objects, the repossessor must stop and go to court.\nWithout a court order, officers don’t assist or hinder. Your role is keeping the peace, and your presence can’t be used to intimidate.\nThe owner gets back personal belongings that aren’t part of the collateral."},{"l":"cp","o":8,"t":"q","q":"A repair shop won’t release a car until the owner pays a disputed bill. The owner asks you to make them give it back. You…","a":["Order the shop to release it","Explain the shop may keep it; the owner can post a bond and go to small claims","Arrest the mechanic"],"c":1,"w":"A mechanic’s lien lets the shop hold the vehicle. The owner can post a bond for an Order for Release (AOC-CVM-901M), enforced by contempt, not by officers."},{"l":"cp","o":8,"t":"f","h":"Evictions","b":"Landlords can’t lock tenants out, cut utilities, or remove doors. They must go to court.\nGuests (no rent agreement) and squatters can be removed as trespassers.\nAfter judgment, there are 10 days to appeal. Then the clerk issues a Writ of Possession, and the sheriff removes the tenant within five days.\nAfterward, tenants have five days to retrieve property worth $500 or less, or seven days if more.\nMobile home lot renters get 60 days’ notice to end a lease."},{"l":"cp","o":8,"t":"q","q":"A hotel says a long-term “guest” won’t leave. The status is unclear. Officers should…","a":["Remove them as a trespasser","Treat doubts in favor of a residential tenant and resolve it civilly","Arrest for theft of services"],"c":1,"w":"A hotel license isn’t conclusive. Resolve all doubts in favor of tenant status, which requires summary ejectment, unless there’s probable cause of a crime."},{"l":"cp","o":8,"t":"q","q":"After a magistrate rules for the landlord, when can the tenant be removed?","a":["Immediately","After the 10-day appeal period, with a Writ of Possession","After 30 days"],"c":1,"w":"The landlord can’t remove the tenant until the 10-day appeal period ends, whether or not the tenant appeals."},{"l":"cct","o":5,"t":"f","h":"Four phases of instruction","b":"1. Instruction: lecture, demonstration, practice\n2. Evaluation: performing without help\n3. Remedial: only if a technique fails\n4. Re-evaluation: final attempt at each failed technique\nEach phase is separate and can’t be combined."},{"l":"cct","o":5,"t":"f","h":"Two course segments","b":"Segment One: 40 hours early in BLET. Lecture, demonstration, practice and skills evaluation.\nSegment Two: 16 hours later in BLET. Refresher, then at least two use-of-force scenarios. Scenario One is required."},{"l":"cct","o":5,"t":"f","h":"Mat room safety rules","b":"– 50 square feet of mat per student\n– Remove watches, rings, glasses, jewelry\n– Clean mats after every use with 10:1 water-to-bleach\n– No horseplay; practice only what’s taught\n– Go slow; never full speed\n– Passive resistance only unless wearing a protective “red suit”\n– Learn how to tap out\n– No functional firearms"},{"l":"cct","o":5,"t":"q","q":"What’s the required instructor-to-trainee ratio for BLET practical exercises?","a":["1 to 6","1 to 8","1 to 10"],"c":1,"w":"One certified instructor per eight BLET trainees (one per ten for DOCC). Reality-based scenarios need at least two certified instructors."},{"l":"cct","o":5,"t":"q","q":"Each technique is practiced in two steps. Step one is…","a":["Applying the technique","Getting the subject into position for the technique","Handcuffing"],"c":1,"w":"Step one puts the subject in position; step two applies the technique. Practice them separately, then together."},{"l":"cct","o":8,"t":"f","h":"Handcuffing: standing","b":"Put the subject in a position of disadvantage (feet wide or together).\nGrip the right hand with your non-weapon palm on the back of their hand; rotate slightly clockwise.\nBottom cuff goes on the radial bone (above the thumb) of the right wrist; press so the single blade cycles.\nHold the top cuff in a fist, move to the left hand palm-to-palm, and cuff it.\nCheck fit and double-lock."},{"l":"cct","o":8,"t":"q","q":"Why double-lock handcuffs?","a":["So they can be removed faster","So they can’t tighten further as the subject moves","To make them harder to pick"],"c":1,"w":"Always try to double-lock unless it would compromise safety with a noncompliant subject."},{"l":"cct","o":8,"t":"f","h":"Removing handcuffs","b":"Stay in the escort position and put the subject in a position of disadvantage.\nWith your weapon hand, control the left cuff’s lock housing. Remove the left cuff first; have them put that hand on their head or out to the side, palm back.\nThen remove the right cuff, close both cuffs, step back turning your weapon side away, and have them step forward.\nKneeling, sitting or prone positions add safety."},{"l":"cct","o":8,"t":"q","q":"When removing handcuffs, which cuff comes off first?","a":["Right","Left","Both together"],"c":1,"w":"Left first, with the key in the non-dominant hand, while the weapon hand controls the lock housing."},{"l":"cct","o":8,"t":"f","h":"Prone handcuffing safety","b":"Your knee can rest across the shoulder blade in a “check” position with no downward force.\nOnly lean weight onto the subject temporarily if they resist. Remove it once resistance stops.\nNever kneel on the head or neck.\nAfterward, roll them onto their right side and help them up through a knee. Watch for positional asphyxia."},{"l":"cct","o":8,"t":"f","h":"Hidden arms","b":"High (arms under the chest): if needed, use your knee on the elbow to make space. Grab the wrist with both hands, put a shoulder or knee on their rear deltoid, and walk your hips toward their head to free the arm.\nLow (hands near the waistband): trap one arm under them with your shin, pull the other free with both hands, and don’t let it go back under. Use a bent wrist to get the second arm."},{"l":"cct","o":5,"t":"f","h":"Ground defense","b":"Three points of support: the hand, the forearm or elbow, and the side of the buttock.\nTop leg coiled to kick at knees or torso.\nBottom leg curled in so it can’t be grabbed or stepped on.\nTop hand up to protect your face.\nKeep the subject in front of your legs, and stand (stand in base) as soon as it’s safe."},{"l":"cct","o":5,"t":"q","q":"How many points of support does the ground defense position use?","a":["Two","Three","Four"],"c":1,"w":"Hand, forearm/elbow, and side of the buttock."},{"l":"cct","o":5,"t":"f","h":"Stand in base","b":"1. Turn slightly to your right hip and place your right hand on the ground behind you.\n2. Plant your left foot in front, left hand up to protect your face.\n3. Pull your right foot under you, next to your right hand.\n4. Stand with a low center of gravity and disengage."},{"l":"cct","o":5,"t":"f","h":"Mount vs. side mount","b":"Mount: on top with one knee on each side. Stay low, chest to chest. Use hip-to-hip pressure and hook their legs to keep from being rolled.\nSide mount: on top, chest to chest, with both knees on the same side. Keep hips low so you’re not top heavy."},{"l":"cct","o":5,"t":"f","h":"Escape from the mount","b":"Raise your hips to break their balance and pull them forward.\nWrap their torso and keep your head tight.\nTrap one arm above the elbow and trap the same-side leg with your foot.\nPlant your free foot, bridge your hips, and roll them. Then move to control or stand.\nIn practice, the partner being rolled turns that palm up to protect the wrist."},{"l":"cct","o":5,"t":"q","q":"In the ground headlock defense, how do you break the grip?","a":["Pull your head up hard","Frame with your forearm on their jaw and lean your body weight into it","Roll away"],"c":1,"w":"Pulling with your neck wastes energy and strains it. Lean your weight on the frame against the jaw; strikes to soft tissue can help."},{"l":"cct","o":5,"t":"f","h":"Punch defense in guard","b":"Wrap both legs around their back (closed guard) to control posture.\nOverhook one arm, preferably the one on your weapon side.\nGrip the back of their neck or head with your other hand and stay tight to limit strikes.\nIf they pull away, push them off with your feet and go to ground defense or stand."},{"l":"cct","o":5,"t":"f","h":"Bent wrist","b":"From escort or side position, grab their right wrist and the bend of their right elbow.\nLift the wrist, push the elbow down, and tuck it tight under your left armpit.\nOne thumb on top of their hand, the other under the wrist.\nPress down and away over the index and middle finger knuckles.\nGo slow in practice; it takes very little torque to injure a wrist."},{"l":"cct","o":5,"t":"f","h":"Arm bar takedown","b":"Gr
