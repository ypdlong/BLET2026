coma, or prolonged hospitalization","Serious injury is worse"],"c":1,"w":"Assault inflicting serious bodily injury is a Class F felony on its own."},{"l":"pc","o":2,"t":"f","h":"Affray and threats","b":"Simple affray (Class 2 misdemeanor): fighting with another in a public place, to the terror of the public. Someone who provokes a fight but never throws a punch should be charged with affray, not assault.\nCommunicating threats (Class 1 misdemeanor): willfully threatening to injure a person, their family, or property, communicated so a reasonable person would believe it, and the victim does believe it. Conditional threats count; jokes don’t.\nLaser at an officer, firefighter or medic on duty: Class I felony."},{"l":"pc","o":2,"t":"q","q":"A man says, “If you keep talking, I’ll knock your teeth out,” and the victim believes him. Communicating threats?","a":["No, it was conditional","Yes; a conditional threat counts when there’s no right to impose the condition","Only if written"],"c":1,"w":"The victim must actually believe it, and it must be a true threat, not a joke."},{"l":"pc","o":2,"t":"f","h":"Harassment, cyberstalking, stalking","b":"Harassing phone calls (Class 2 misdemeanor): by phone, using lewd language, threats, or extortion, calling repeatedly to harass (even without talking), or false statements about death or injury.\nCyberstalking (Class 2 misdemeanor): the same by electronic communication, plus installing a tracking device on someone without consent.\nStalking (Class A1): on more than one occasion or a course of conduct (two or more acts), harassing or following someone when the stalker knows or should know it would make a reasonable person fear for safety or suffer substantial emotional distress. Class H with a court order in place; Class F with a prior stalking conviction."},{"l":"pc","o":2,"t":"q","q":"An ex-boyfriend secretly puts a GPS tracker on his ex’s car to follow her. Which crime fits?","a":["Cyberstalking","Harassing phone calls","Nothing, unless he contacts her"],"c":0,"w":"Installing an electronic tracking device without consent is cyberstalking. Repeated following could also be stalking."},{"l":"pc","o":2,"t":"f","h":"Robbery","b":"Common law robbery (Class G): larceny from the person or their presence by violence or intimidation. Actual violence isn’t required if the victim is put in fear.\nArmed robbery (Class D): larceny (or attempt) from the person or presence by possession, use or threatened use of a firearm or dangerous weapon that endangers or threatens a life. Just having a weapon isn’t enough; it must be used to threaten. The victim doesn’t have to fear for their life.\nThe property only needs to be in the victim’s presence or control, not in their hand."},{"l":"pc","o":2,"t":"q","q":"A robber shows a gun in his waistband and says, “Give me the register cash.” The clerk complies. The charge is…","a":["Common law robbery","Armed robbery","Larceny from the person"],"c":1,"w":"Displaying a gun to get the money is threatened use that endangers life."},{"l":"pc","o":2,"t":"q","q":"A man shoves a woman to the ground and grabs her purse. No weapon. The charge is…","a":["Felony larceny from the person","Common law robbery","Armed robbery"],"c":1,"w":"Violence beyond what’s needed to take the property turns larceny into robbery."},{"l":"pc","o":2,"t":"f","h":"Kidnapping, restraint, false imprisonment","b":"Kidnapping: confining, restraining or removing someone without consent (parent’s consent if under 16) for ransom, hostage, a shield, to commit or flee a felony, to do serious harm, to terrorize, or for servitude or trafficking.\nFirst-degree (Class C): victim not released in a safe place, or seriously injured, or sexually assaulted. Otherwise second-degree (Class E).\nFelonious restraint (Class F): unlawful restraint plus transporting the person by vehicle.\nFalse imprisonment (Class 1 misdemeanor): intentionally restraining or detaining someone without consent."},{"l":"pc","o":2,"t":"q","q":"A store manager locks a shoplifter in a dark storeroom for two hours “to teach her a lesson.” The charge is…","a":["False imprisonment","Kidnapping","Nothing; she was shoplifting"],"c":0,"w":"Unlawfully restraining or detaining someone without consent, with no vehicle transport or kidnapping purpose."},{"l":"pc","o":2,"t":"q","q":"A man forces a jogger into his truck, drives her around for two hours, then releases her unharmed in a store parking lot. Which degree of kidnapping?","a":["First-degree","Second-degree","Felonious restraint only"],"c":1,"w":"She was released in a safe place, unhurt and not sexually assaulted, so it isn’t first-degree."},{"l":"ohw","o":4,"t":"f","h":"Stress and PTSD","b":"General stress: physical, mental, emotional demands of the job.\nCumulative stress: unmanaged stress that builds up, causing headaches, fatigue, sleep problems and mood changes.\nPTSD: reliving a critical incident. 15–30% of emergency workers develop it; repeated incidents raise the risk.\nFour symptom groups: avoidance, re-experiencing (flashbacks, nightmares), cognitive and mood changes, and arousal and reactivity (startle, poor sleep, quick anger)."},{"l":"ohw","o":4,"t":"q","q":"An officer keeps having nightmares about a fatal crash and avoids driving that road. Which disorder fits?","a":["General stress","PTSD (re-experiencing and avoidance)","Burnout only"],"c":1,"w":"Seeking help early matters; it’s a treatable condition."},{"l":"pt","o":3,"t":"f","h":"Three types of patrol","b":"Conspicuous: high visibility and random movement to make offenders believe there’s no opportunity. Marked cars, foot, bike.\nInconspicuous: to gather evidence and catch criminals in the act, using unmarked cars, surveillance, or plain clothes (not the same as undercover).\nDirected: resources focused on specific places, times and people identified through crime data."},{"l":"pt","o":4,"t":"f","h":"Contact and cover","b":"Contact officer (only one): does all the talking, takes notes, handles the radio, and starts frisks, searches and arrests.\nCover officer (one or more): watches people and protects the contact officer, staying mobile and positioned to avoid crossfire."},{"l":"rd","o":4,"t":"f","h":"Active attacker response","b":"Priorities: stop the killing, then stop the dying.\nGo to the threat immediately without waiting for backup, following any “driving force” (gunshots, screams, fleeing people).\nContact team movement goals: locate the threat, isolate it, then confront and stop or apprehend the attacker. Contact teams get radio priority.\nThe attacker’s options once officers arrive: keep shooting, suicide, shoot at officers, escape, surrender, or take a hostage. Before officers arrive, their only option is to keep shooting; your presence changes that."},{"l":"rd","o":5,"t":"q","q":"What are the three movement goals of the contact team?","a":["Locate, isolate, confront/stop","Evacuate, rescue, treat","Contain, negotiate, wait"],"c":0,"w":"Rescue and evacuation teams come after the threat is addressed."},{"l":"tc","o":1,"t":"f","h":"Five N.C. courts","b":"Supreme Court: highest; seven justices; no juries or fact-finding; reviews legal error; automatic appeal of death sentences.\nCourt of Appeals: panels of three judges; hears most appeals from trial courts.\nSuperior Court: trial court for felonies and misdemeanor appeals (jury trials); civil cases over $25,000.\nDistrict Court: all misdemeanors and infractions, felony probable cause hearings, juvenile, commitments, domestic cases, civil under $25,000. Where officers testify most.\nJuvenile Court: a division of District Court for defendants under 18 (except 16–17-year-olds’ motor vehicle cases)."},{"l":"tc","o":4,"t":"q","q":"Where is a misdemeanor case usually tried first?","a":["Superior Court","District Court","Court of Appeals"],"c":1,"w":"A conviction can be appealed to Superior Court for a jury trial."},{"l":"tc","o":4,"t":"q","q":"Which court has original jurisdiction over felony trials?","a":["District Court","Superior Court","Magistrate’s court"],"c":1,"w":"District Court handles felony probable cause hearings, but the trial is in Superior Court."},{"l":"tc","o":4,"t":"q","q":"Which court has a court reporter recording criminal trials?","a":["Superior Court","District Court","Both"],"c":0,"w":"There are no court reporters in District Court criminal trials."},{"l":"tc","o":2,"t":"f","h":"Initial appearance and magistrates","b":"When you arrest someone, identify yourself, tell them they’re under arrest, and tell them why as soon as reasonable.\nThe arrestee goes before a magistrate, who sets the type and amount of bond and the first court date (or first appearance before a District Court judge for felonies).\nMagistrates also issue arrest and search warrants and handle small claims up to $10,000.\nThe Sixth Amendment right to counsel attaches at the first appearance."},{"l":"tc","o":2,"t":"q","q":"What’s the main purpose of taking an arrestee before a magistrate?","a":["To hold the trial","To set bond (pretrial release conditions) and the court date","To take a plea"],"c":1,"w":"Officers aren’t required to appear at later bail hearings."},{"l":"tc","o":3,"t":"f","h":"Administrative court and your court date","b":"Administrative (disposition) court handles infractions and motor vehicle misdemeanors other than DWI. Defendants plead guilty or work out a plea; no trials are held, and the officer doesn’t have to appear.\nCases not resolved there go to the officer’s regular District Court date (same weekday each month)."},{"l":"tc","o":5,"t":"f","h":"Plea bargaining","b":"The DA agrees to dismiss or reduce charges in exchange for a guilty plea. The judge must be told and can reject a specific sentence.\nWhy: crowded courts, weak evidence, the defendant fears a harsher verdict, or the interest of justice (like a first offender).\nOnly the DA can plea bargain. Officers have no authority to negotiate charges."},{"l":"tc","o":5,"t":"q","q":"A defense attorney asks you to agree to reduce a DWI to reckless driving. You should…","a":["Agree if you think it’s fair","Decline; only the district attorney can plea bargain","Agree only for first offenders"],"c":1,"w":"Refer them to the DA."},{"l":"tc","o":6,"t":"f","h":"Impeachment and corroboration","b":"Impeachment attacks a witness’s credibility so the jury won’t believe them:\n– Prior bad acts or crimes\n– Prior inconsistent statements\n– Contradiction by other witnesses\n– Physical facts (fingerprints where he claims he never was)\n– Bias and prejudice\n– Poor perception or no personal knowledge\n– Bad character and reputation\nCorroboration is the opposite: prior consistent statements, other witnesses, physical facts, no bias, good perception, good character."},{"l":"tc","o":6,"t":"q","q":"Your testimony differs from what you wrote in your report. The defense will likely use this to…","a":["Corroborate you","Impeach you with a prior inconsistent statement","Object to hearsay"],"c":1,"w":"That’s why reviewing your report before court matters."},{"l":"tc","o":7,"t":"f","h":"Hearsay","b":"An out-of-court statement by someone other than the testifying witness, offered to prove the truth of what it says. Generally not allowed.\nExceptions:\n– A defendant’s own statements (admission by a party opponent)\n– Prior consistent or inconsistent statements to impeach or corroborate\n– Statements offered to explain conduct (a dispatcher’s call explains why you went somewhere)\n– Spontaneous (excited) utterances made under stress"},{"l":"tc","o":7,"t":"q","q":"A witness testifies, “My neighbor told me she saw the defendant break the window.” This is…","a":["Direct evidence","Hearsay","Opinion testimony"],"c":1,"w":"It repeats someone else’s out-of-court statement to prove it’s true."},{"l":"tc","o":7,"t":"q","q":"A victim screams “He has a knife!” seconds after being attacked. Under which hearsay exception might it come in?","a":["Spontaneous (excited) utterance","Admission by a party opponent","None; it’s inadmissible"],"c":0,"w":"Statements made in the heat of the moment are considered unlikely to be fabricated."},{"l":"tc","o":8,"t":"f","h":"Preparing for court","b":"– Know your court dates and never miss one; clear absences with the DA\n– Make sure lab testing is done and results are sent to the DA; be ready to show chain of custody\n– Make sure witnesses are subpoenaed for the right date\n– Work with your court liaison officer\n– Meet with the DA when needed (especially for Superior Court)\n– Review your notes, reports and evidence\nOn the stand: if you don’t know or can’t recall, say so. Ask permission to refresh your memory from your report."},{"l":"tc","o":10,"t":"f","h":"Giglio","b":"Giglio v. United States: prosecutors must disclose information affecting a witness’s credibility, and presenting or failing to correct false evidence violates due process. Brady v. Maryland: suppressing material evidence requires a new trial, regardless of good faith.\nA DA can issue a “Giglio letter” deciding an officer’s truthfulness is impaired and they won’t be called to testify. That officer can’t effectively make arrests, handle evidence or interview suspects, and is almost always fired.\nYour honesty is your career."},{"l":"tc","o":10,"t":"q","q":"What’s the usual career result of a Giglio letter about an officer?","a":["A brief suspension","The officer can no longer testify and is almost always terminated","Mandatory retraining only"],"c":1,"w":"Never guess or shade testimony; say “I don’t recall” when that’s true."},{"l":"sa","o":1,"t":"f","h":"Myths about sexual assault","b":"Myth: most rapes are by strangers. Fact: about 8 in 10 are by someone the victim knows.\nMyth: many reports are false. Fact: only a small percentage; a recantation doesn’t make a report false.\nMyth: it only happens to certain people. Fact: anyone can be a survivor.\nMyth: a spouse can’t rape a spouse. Fact: in N.C., spouses can be prosecuted.\nMyth: assaults are spontaneous. Fact: offenders often stalk, test and groom.\nMyth: the survivor must fight back. Fact: resistance isn’t required, and there’s no typical reaction."},{"l":"sa","o":1,"t":"q","q":"A survivor didn’t physically resist during the assault. Does that mean it wasn’t rape?","a":["Yes, resistance is required","No; physical resistance isn’t necessary to prove lack of consent","Only if a weapon was used"],"c":1,"w":"Survivors may freeze; there is no typical response."},{"l":"sa","o":2,"t":"f","h":"Why survivors don’t report","b":"– Shame or guilt\n– Fear of being blamed or not believed\n– Wanting to forget\n– Knowing or being related to the assailant\n– Intimidation by the assailant’s power or status\n– Fear of retaliation\n– Fear the offender won’t be held accountable\n– Embarrassment or alienation\n– Religious concerns\nReactions vary: laughing, crying, calm or no emotion are all possible. Don’t judge."},{"l":"sa","o":6,"t":"f","h":"Forcible rape and sex offense","b":"First-degree forcible rape (Class B1): vaginal intercourse by force and against the person’s will, plus a weapon (used, threatened or displayed), serious personal injury to the victim or another, or being aided by others.\nSecond-degree forcible rape (Class C): vaginal intercourse by force against the will, OR with someone mentally disabled, incapacitated or physically helpless whom the defendant knew or should have known was.\nFirst- and second-degree forcible sex offense: the same, but for a sexual act other than vaginal intercourse (oral, anal, or penetration with any object or finger).\nConsent can be revoked during the act. Penetration of the labia is enough."},{"l":"sa","o":6,"t":"q","q":"A man has intercourse with a woman who is passed out drunk at a party. No force or weapon was used. The charge is…","a":["No crime without force","Second-degree forcible rape (physically helpless victim)","Sexual battery"],"c":1,"w":"When the victim is physically helpless and he knew or should have known, force isn’t required."},{"l":"sa","o":6,"t":"q","q":"A suspect forces a victim to perform oral sex at knifepoint. The charge is…","a":["First-degree forcible rape","First-degree forcible sex offense","Second-degree forcible sex offense"],"c":1,"w":"Oral sex is a “sexual act,” not vaginal intercourse; the knife makes it first-degree."},{"l":"sa","o":6,"t":"q","q":"What makes forcible rape first-degree instead of second-degree?","a":["The victim’s age","A weapon, serious personal injury, or being aided by others","Whether it happened at night"],"c":1,"w":"Serious personal injury can be mental injury that lasts well beyond the crime."},{"l":"sa","o":6,"t":"f","h":"Sexual battery","b":"Class A1 misdemeanor. For sexual arousal, gratification or abuse, engaging in sexual contact (touching the sexual organ, anus, breast, groin or buttocks, directly or through clothing) by force and against the person’s will, or with someone mentally disabled, incapacitated or physically helpless.\nFor adult offenders, the sexual purpose can be inferred from the act itself."},{"l":"sa","o":6,"t":"q","q":"In a crowded bar, a man forcibly grabs a woman’s groin through her jeans as she tries to pull away. The charge is…","a":["Simple assault only","Sexual battery","Second-degree forcible sex offense"],"c":1,"w":"Touching through clothing counts. No sexual act occurred, so it isn’t a forcible sex offense."},{"l":"sa","o":6,"t":"f","h":"Statutory rape and sex offenses","b":"Victim under 13:\n– Defendant 18+: statutory rape (or sex offense) of a child by an adult, Class B1\n– Defendant at least 12 and at least 4 years older: first-degree statutory rape (or sex offense), Class B1\nVictim 15 or younger:\n– Defendant at least 12 and at least 6 years older: Class B1\n– More than 4 but less than 6 years older: Class C\n(Marriage is a defense to the 15-and-under offenses.)\nConsent and mistake of age are not defenses. Measure age gaps birthday to birthday."},{"l":"sa","o":6,"t":"q","q":"A 22-year-old has intercourse with a 15-year-old who says she consented. The charge is…","a":["No crime; she consented","Statutory rape of a person 15 or younger (Class B1; he’s at least 6 years older)","Sexual battery"],"c":1,"w":"Consent and mistake of age are not defenses."},{"l":"sa","o":6,"t":"q","q":"A 19-year-old has intercourse with a 15-year-old (about 4½ years apart). What class?","a":["Class B1","Class C","Not a crime"],"c":1,"w":"More than 4 but less than 6 years older is Class C; 6 or more years is B1."},{"l":"sa","o":6,"t":"f","h":"Indecent liberties with a child","b":"Class F felony: a person at least 16 who, for sexual arousal or gratification, willfully takes or attempts an indecent liberty or lewd act with a child under 16 who is at least 5 years younger.\nNo touching is required; sexually explicit phone calls to a child have qualified."},{"l":"sa","o":6,"t":"q","q":"A 30-year-old has sexually explicit phone conversations with a 12-year-old, but never touches her. Indecent liberties?","a":["No, there was no contact","Yes; touching isn’t required","Only if he met her in person"],"c":1,"w":"Indecent liberties requires the defendant be 16+ and the child under 16 and at least 5 years younger."},{"l":"rcv","o":1,"t":"f","h":"Key definitions","b":"Victim: someone against whom there’s probable cause to believe a crime was committed.\nCrime: a felony or serious misdemeanor (as the DA decides), or a juvenile act that would be one.\nFamily member: spouse, child, parent, guardian, custodian, sibling or grandparent, never the accused.\nWitness: someone summoned or likely to be called to testify for the prosecution in a felony case."},{"l":"rcv","o":2,"t":"f","h":"Signs of trauma","b":"Physical: wide or glassy eyes, rapid eye movement, trembling, being easily startled, shock symptoms (fast heart rate, changes in breathing), insomnia, headaches, nausea.\nEmotional: denial (“I can’t believe this happened”), confusion, trouble concentrating or remembering, mood swings, anger or desire for revenge, fear, guilt or self-blame, withdrawal.\nThere’s no right or wrong reaction; laughter or a blank face are possible. Inconsistent statements aren’t automatically lies."},{"l":"rcv","o":3,"t":"f","h":"Communicating with victims","b":"Help restore their sense of control.\nUse open-ended questions; let them tell it start to finish without interruption, as often as needed.\nAvoid “why did you…” questions that sound like blame.\nBe patient, objective and empathetic.\nPostpone if they’re too injured, upset or impaired, but minimize the number of interviews.\nDon’t share what others told you or compare them to other victims.\nExplain what happens next.\nIf they’re unsure about charges: most misdemeanors must be charged within 2 years; felonies have no statute of limitations."},{"l":"rcv","o":3,"t":"q","q":"A victim isn’t ready to press charges for a misdemeanor assault. Generally, how long do they have?","a":["30 days","2 years","There is no limit"],"c":1,"w":"Malicious misdemeanors are an exception, and felonies have no statute of limitations in N.C."},{"l":"rcv","o":5,"t":"f","h":"Victims’ rights: the 72-hour rule","b":"For victims of crimes covered by § 15A-830 (felonies and certain misdemeanors against persons, and felony property crimes), the investigating agency must, as soon as practical but within 72 hours of identifying the victim, provide in writing:\n– Availability of medical services\n– Availability of crime victims’ compensation and how to contact the program\n– The DA’s office address and phone\n– A contact at your agency if they haven’t heard of an arrest within six months\n– Information about the accused’s opportunity for pretrial release"},{"l":"rcv","o":5,"t":"q","q":"Within how long must the agency give an eligible victim the required written rights information?","a":["24 hours","72 hours","30 days"],"c":1,"w":"It includes medical services, compensation, the DA’s contact, and an agency contact."},{"l":"rcv","o":6,"t":"f","h":"Crime Victims Compensation","b":"Covers victims of rape, assault, child sexual abuse, domestic violence and drunk driving, and families of homicide victims.\nUp to $45,000 for medical expenses, counseling, lost wages, loss of support and replacement services, plus up to $10,000 for funeral expenses in homicides.\nStolen or damaged property is NOT covered. Motor vehicle crimes qualify only for DWI and hit and run.\nClaims must be filed within 2 years. The offender or accomplice can’t claim."},{"l":"rcv","o":6,"t":"q","q":"A burglary victim asks whether the Crime Victims Compensation Program will pay for her stolen TV. The answer is…","a":["Yes, up to $45,000","No; property loss isn’t covered","Only if the burglar is convicted"],"c":1,"w":"It covers personal injury costs like medical bills, counseling and lost wages."},{"l":"rcv","o":6,"t":"q","q":"What’s the maximum award for medical expenses, counseling and lost wages under N.C. Crime Victims Compensation?","a":["$10,000","$45,000","$100,000"],"c":1,"w":"An additional $10,000 may be awarded for funeral expenses in homicides."},{"l":"tp","o":4,"t":"f","h":"Photographing arrestees","b":"Usually taken during fingerprinting, always in color:\n1. Overall (full body)\n2. Mid-range: face, left and right profiles, distinctive features\n3. Close-ups of scars, marks, tattoos and distinctive features"},{"l":"tp","o":5,"t":"f","h":"Arrestee DNA samples","b":"For certain offenses (murder, sexual assaults and other violent crimes), the arresting officer must obtain a DNA sample at arrest or fingerprinting, by cheek (buccal) swab unless a court orders blood.\nArrested without a warrant: don’t take it until the magistrate finds probable cause at the initial appearance.\nRecord the date, time, who took it, the arrestee’s name and address, and the offenses.\nGive the arrestee written notice of how to seek expunction.\nIf they refuse, ask the DA to apply for a nontestimonial identification order.\nProfiles go into CODIS."},{"l":"tp","o":5,"t":"q","q":"You arrest a suspect for a qualifying violent felony without a warrant. When can you take the DNA swab?","a":["Immediately at arrest","After the magistrate makes a probable cause determination","Only after conviction"],"c":1,"w":"With a warrant, it can be taken at arrest or fingerprinting."},{"l":"tle","o":1,"t":"f","h":"Five phases of traffic enforcement","b":"1. Detection (police)\n2. Apprehension (police)\n3. Prosecution\n4. Adjudication\n5. Penalization\nA stop requires reasonable suspicion: articulable facts, more than a hunch. You may infer the registered owner is driving when stopping a car whose owner’s license is suspended or revoked, absent facts to the contrary."},{"l":"tle","o":1,"t":"q","q":"You run a plate and find the registered owner’s license is revoked. Can you stop the car without first confirming the owner is driving?","a":["No, you must see the driver first","Yes, absent facts to the contrary you may infer the owner is driving","Only with a warrant"],"c":1,"w":"If you can see the driver clearly doesn’t match the owner, that inference no longer holds."},{"l":"tci","o":3,"t":"f","h":"Reportable crashes","b":"A crash is any event causing injury or property damage directly from the motion of a motor vehicle or its load.\nIt’s reportable (DMV-349 required) when a motor vehicle crash results in:\n– A death or personal injury (observed or claimed), OR\n– Total property damage of $1,000 or more (add up all vehicles and property)\nReportable crashes must be investigated and reported within 24 hours. Injury to domestic animals counts as property damage; wild animals don’t if nothing else is damaged."},{"l":"tci","o":3,"t":"q","q":"Two cars bump in a parking lot: $600 damage to one and $500 to the other; no injuries. Is it reportable?","a":["No, neither car hit $1,000","Yes; total damage is $1,100","Only if police were called"],"c":1,"w":"Add all damage to all vehicles and property together."}];

/* Priority from the CJS Division's 2025 BLET Test Insights bulletin.
   fail = first-attempt failure rate (%) by block. hot = objectives named as
   most-missed or most-tested. Add blocks here as lessons are added. */
const PRIORITY = {
  base: 5, defaultFail: 10, hotBoost: 1.6, missedBoost: 2.5,
  fail: { mvl:29.5, assc:24.9, cde:17.5, cri:16.9, dp:16.9, crt:11.6, cap:11.9, ci:9.4, hc:24.2, fn:17.8, mp:17.5, hs:16.3, jv:14.1, ht:12.7, ii:7.5, dr:7.2, eps:10.9, fr:8.8, fa:8.2, exp:4.4, cp:7.2, cs:6.7, cct:6.4, dv:4.4, ori:3.2, crp:2.4, crw:0.3, prc:14.5, pc:8.1, ohw:3.2, pt:0.8, rd:0.1, tc:12.6, rcv:7.0, sa:6.1, tp:3.6, tle:2.6, tci:1.9 },
  hot: { assc:[7,10,14], ci:[9], cri:[6], cap:[2], jv:[6], ii:[9], prc:[3], pc:[2] }
};

(function(){
  CARDS.forEach((c,i)=>c.id=i);
  const KEY="blet-doomscroll-v1";
  let st={ans:{},saved:{}};
  try{const raw=localStorage.getItem(KEY); if(raw) st=Object.assign(st,JSON.parse(raw));}catch(e){}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};

  const feed=document.getElementById("feed");
  let filter="all", recent=[], rendered=0, retry=[];

  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const LCOUNT={}; CARDS.forEach(c=>LCOUNT[c.l]=(LCOUNT[c.l]||0)+1);
  const LAVG=CARDS.length/Object.keys(LCOUNT).length;
  function isMissed(c){return st.ans[c.id]&&!st.ans[c.id].last;}
  const isHot=c=>(PRIORITY.hot[c.l]||[]).includes(c.o);
  const pool=()=>CARDS.filter(c=>{
    if(filter==="all") return true;
    if(filter==="saved") return st.saved[c.id];
    if(filter==="missed") return isMissed(c);
    if(filter==="hot") return isHot(c);
    return c.l===filter;
  });
  // Weighted pick: each block's share of the feed follows its 2025 first-attempt
  // failure rate; high-yield objectives and missed questions show up more often.
  function weight(c,counts){
    // Bigger blocks have more questions in the 900-question bank, so size counts too.
    const share=(PRIORITY.base+(PRIORITY.fail[c.l]||PRIORITY.defaultFail))*Math.sqrt(LCOUNT[c.l]/LAVG);
    let w=share/counts[c.l];
    if(isHot(c)) w*=PRIORITY.hotBoost;
    if(isMissed(c)) w*=PRIORITY.missedBoost;
    return w;
  }
  function pick(){
    const p=pool(); if(!p.length) return null;
    const win=Math.min(Math.floor(p.length*0.6),60);
    let cand=p.filter(c=>!recent.slice(-win).includes(c.id));
    if(!cand.length) cand=p;
    const counts={}; cand.forEach(c=>counts[c.l]=(counts[c.l]||0)+1);
    const ws=cand.map(c=>weight(c,counts)); let r=Math.random()*ws.reduce((a,b)=>a+b,0);
    for(let i=0;i<cand.length;i++){ r-=ws[i]; if(r<=0) return cand[i]; }
    return cand[cand.length-1];
  }

  function el(tag,cls,text){const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e;}
  function renderBody(text){
    const wrap=el("div","body"); let ul=null;
    text.split("\n").forEach(line=>{
      if(line.startsWith("– ")){ if(!ul){ul=el("ul");wrap.appendChild(ul)} ul.appendChild(el("li",null,line.slice(2))); }
      else { ul=null; wrap.appendChild(el("p",null,line)); }
    });
    return wrap;
  }
  function meta(c){
    const m=el("div","meta");
    m.appendChild(el("span","tag",LESSONS[c.l].short));
    m.appendChild(el("span",null,"Objective "+c.o+": "+LESSONS[c.l].obj[c.o]));
    if(isHot(c)) m.appendChild(el("span","hy","High-yield"));
    m.appendChild(el("span","kind",c.t==="f"?"Know it":c.t==="s"?"Scenario":"Quiz"));
    return m;
  }
  function saveBtn(c){
    const b=el("button","act",st.saved[c.id]?"★ Saved":"☆ Save");
    b.setAttribute("aria-pressed",!!st.saved[c.id]);
    b.addEventListener("click",()=>{
      if(st.saved[c.id]) delete st.saved[c.id]; else st.saved[c.id]=1;
      b.textContent=st.saved[c.id]?"★ Saved":"☆ Save"; b.setAttribute("aria-pressed",!!st.saved[c.id]); save();
    });
    return b;
  }
  function card(c){
    const sec=el("section","card l-"+c.l); sec.dataset.id=c.id; sec.style.setProperty("--lc","var(--"+c.l+")");
    const s=el("div","sheet"); s.appendChild(meta(c));
    if(c.t==="f"){
      s.appendChild(el("h2","headline",c.h));
      s.appendChild(renderBody(c.b));
    }else{
      s.appendChild(el("h2","question",c.q));
      const opts=el("div","opts"); opts.setAttribute("role","group");
      // shuffle option order, track correct
      const order=shuffle(c.a.map((t,i)=>i));
      const btns=order.map((oi,n)=>{
        const b=el("button","opt"); b.dataset.oi=oi;
        b.appendChild(el("span","k","ABC"[n])); b.appendChild(el("span",null,c.a[oi]));
        b.addEventListener("click",()=>answer(c,oi,btns,s,sec));
        opts.appendChild(b); return b;
      });
      s.appendChild(opts);
    }
    const acts=el("div","actions"); acts.appendChild(saveBtn(c)); s.appendChild(acts);
    sec.appendChild(s); return sec;
  }
  function answer(c,oi,btns,s,sec){
    if(sec.dataset.done) return; sec.dataset.done="1";
    const ok=oi===c.c;
    btns.forEach(b=>{
      b.disabled=true; const i=+b.dataset.oi;
      if(i===c.c) b.classList.add("right"); else if(i===oi) b.classList.add("wrong"); else b.classList.add("dim");
    });
    const w=el("div","why "+(ok?"ok":"no")); w.setAttribute("role","status");
    w.appendChild(el("strong",null,ok?"Correct.":"Not quite. The answer is: "+c.a[c.c]));
    w.appendChild(el("span",null,c.w));
    s.insertBefore(w,s.querySelector(".actions"));
    const r=st.ans[c.id]||{n:0,r:0}; r.n++; if(ok) r.r++; r.last=ok?1:0; st.ans[c.id]=r; save();
    if(!ok && filter!=="missed") retry.push({id:c.id,at:rendered+6});
    updateStats();
  }
  function intro(){
    const sec=el("section","card intro"); const s=el("div","sheet");
    s.appendChild(el("h2","headline","Scroll your way to the state exam."));
    s.appendChild(el("p","lede","Bite-sized cards from your BLET lesson plans, tied to the learning objectives the certification exam tests. Swipe up for the next card. It never runs out."));
    const lg=el("div","legend");
    byPriority().map(k=>[k,LESSONS[k].name]).forEach(([k,n])=>{
      const d=el("div"); const sw=el("span"); sw.style.background="var(--"+k+")"; d.appendChild(sw); d.appendChild(document.createTextNode(n)); lg.appendChild(d);
    });
    s.appendChild(lg);
    s.appendChild(el("p","body","Lessons with higher statewide failure rates show up more often, and High-yield cards cover the objectives the state flagged as most missed. Every quiz has three choices, just like the real exam. Questions you miss come back a few cards later. Tap ☆ Save to keep a card for review. Your progress stays on this device."));
    s.appendChild(el("p","hint","Tap your score up top to see progress by lesson. On a keyboard: ↓ or J for next, ↑ or K for back, 1–3 to answer."));
    sec.appendChild(s); return sec;
  }
  function emptyCard(){
    const sec=el("section","card empty"); const s=el("div","sheet");
    s.appendChild(el("h2","headline",filter==="saved"?"Nothing saved yet.":"No missed questions."));
    s.appendChild(el("p","body",filter==="saved"?"Tap ☆ Save on any card to add it here.":"Answer some quiz cards; anything you get wrong collects here."));
    sec.appendChild(s); return sec;
  }
  function more(n){
    const frag=document.createDocumentFragment();
    for(let k=0;k<n;k++){
      const due=retry.findIndex(r=>r.at<=rendered);
      let c;
      if(due>-1){ c=CARDS[retry.splice(due,1)[0].id]; }
      else { c=pick(); if(!c) break; }
      recent.push(c.id); if(recent.length>200) recent.shift();
      frag.appendChild(card(c)); rendered++;
    }
    feed.insertBefore(frag,sentinel);
  }
  const sentinel=el("div"); sentinel.style.height="1px";
  function reset(){
    feed.innerHTML=""; recent=[]; retry=[]; rendered=0;
    if(filter==="all") feed.appendChild(intro());
    feed.appendChild(sentinel);
    if(!pool().length){ feed.insertBefore(emptyCard(),sentinel); return; }
    more(6); feed.scrollTop=0;
  }
  new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting) && pool().length) more(6); },{root:feed,rootMargin:"200% 0px"}).observe(sentinel);

  function byPriority(){ return Object.keys(LESSONS).sort((a,b)=>(PRIORITY.fail[b]||0)-(PRIORITY.fail[a]||0)); }
  const sel=document.getElementById("lessonSel"), selChip=sel.closest(".chip");
  byPriority().forEach(k=>{ const o=document.createElement("option"); o.value=k; o.textContent=LESSONS[k].short; sel.appendChild(o); });
  function setFilter(f,chip){
    document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));
    chip.setAttribute("aria-pressed","true"); filter=f;
    if(chip!==selChip){ sel.value=""; selChip.style.removeProperty("--lc"); }
    reset();
  }
  document.querySelectorAll("button.chip").forEach(ch=>ch.addEventListener("click",()=>setFilter(ch.dataset.f,ch)));
  sel.addEventListener("change",()=>{
    if(!sel.value){ setFilter("all",document.querySelector('.chip[data-f="all"]')); return; }
    selChip.style.setProperty("--lc","var(--"+sel.value+")"); setFilter(sel.value,selChip);
  });

  function updateStats(){
    let n=0,r=0; Object.values(st.ans).forEach(a=>{n++; r+=a.last?1:0});
    document.getElementById("sAns").textContent=n;
    document.getElementById("sPct").textContent=n?Math.round(100*r/n)+"%":"–";
  }
  const panel=document.getElementById("panel");
  document.getElementById("statsBtn").addEventListener("click",()=>{
    const rows=document.getElementById("prows"); rows.innerHTML="";
    byPriority().forEach(k=>{
      const qs=CARDS.filter(c=>c.l===k && c.t!=="f");
      const done=qs.filter(c=>st.ans[c.id]); const right=done.filter(c=>st.ans[c.id].last);
      const row=el("div","prow");
      row.appendChild(el("span",null,LESSONS[k].name));
      row.appendChild(el("span",null,right.length+" / "+qs.length));
      const bar=el("div","pbar"); const i=el("i"); i.style.width=(qs.length?100*right.length/qs.length:0)+"%"; i.style.background="var(--"+k+")"; bar.appendChild(i); row.appendChild(bar);
      rows.appendChild(row);
    });
    rows.appendChild(el("p","hint","Bars show quiz questions you got right on your latest try. Lessons are listed by statewide failure rate."));
    panel.classList.add("show"); document.getElementById("pclose").focus();
  });
  document.getElementById("pclose").addEventListener("click",()=>panel.classList.remove("show"));
  panel.addEventListener("click",e=>{if(e.target===panel) panel.classList.remove("show")});
  document.getElementById("reset").addEventListener("click",()=>{
    if(!confirm("Clear all answers and saved cards on this device?")) return;
    st={ans:{},saved:{}}; save(); updateStats(); panel.classList.remove("show"); reset();
  });

  function current(){
    const cards=[...feed.querySelectorAll(".card")]; const top=feed.scrollTop+feed.clientHeight/2;
    return cards.find(c=>c.offsetTop<=top && c.offsetTop+c.offsetHeight>top);
  }
  document.addEventListener("keydown",e=>{
    if(panel.classList.contains("show")){ if(e.key==="Escape") panel.classList.remove("show"); return; }
    if(e.target.closest&&e.target.closest("input,textarea")) return;
    const cur=current(); if(!cur) return;
    if(["ArrowDown","j","J"," "].includes(e.key)){ e.preventDefault(); const n=cur.nextElementSibling; if(n&&n.classList.contains("card")) feed.scrollTo({top:n.offsetTop,behavior:"smooth"}); }
    else if(["ArrowUp","k","K"].includes(e.key)){ e.preventDefault(); const p=cur.previousElementSibling; if(p) feed.scrollTo({top:p.offsetTop,behavior:"smooth"}); }
    else if(/^[1-3]$/.test(e.key)){ const b=cur.querySelectorAll(".opt")[+e.key-1]; if(b&&!b.disabled) b.click(); }
  });

  try{const t=localStorage.getItem(KEY+"-theme"); if(t) document.documentElement.dataset.theme=t;}catch(e){}
  document.getElementById("theme").addEventListener("click",()=>{
    const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    const nx=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=nx;
    try{localStorage.setItem(KEY+"-theme",nx)}catch(e){}
  });

  updateStats(); reset();
})();
</script>
</body>
</html>
