at law enforcement has done, injuries, help needed, and the chemicals involved.\nContact the SBI, which dismantles labs. Don’t put contaminated people in a patrol car."},{"l":"cs","o":9,"t":"q","q":"You realize the house you entered is a meth lab. What first?","a":["Photograph the evidence before leaving","Retreat by the same path you came in","Turn on the lights to see better"],"c":1,"w":"Switches, radios and phones can be ignition sources."},{"l":"cs","o":9,"t":"q","q":"Why shouldn’t you key your radio inside a suspected meth lab?","a":["It could ignite chemical vapors","It alerts the cook","Radios don’t work indoors"],"c":0,"w":"Move to a safe distance, upwind and uphill, before calling."},{"l":"cs","o":10,"t":"f","h":"R.E.S.P.E.C.T. for drug cases","b":"R: Respond and make the scene safe (6–8 feet of distance, backup, frisk when justified, PPE)\nE: Emergency care (call EMS, find out what was taken, turn unconscious people on their side)\nS: Separate and remove people\nP: Protect the scene\nE: Evidence collection\nC: Corroborate evidence with the elements of the crime\nT: Take action (arrest, surveillance, alternatives like treatment)\nAfter possible fentanyl contact, wash with soap and water. Hand sanitizer can increase absorption."},{"l":"cs","o":10,"t":"q","q":"Your hands may have touched fentanyl powder. You should…","a":["Use hand sanitizer right away","Wash with soap and water","Wipe them on your uniform"],"c":1,"w":"Sanitizer can increase absorption. Also avoid touching your eyes, nose or mouth."},{"l":"cs","o":10,"t":"f","h":"Constructive possession","b":"Actual possession: it’s on the person, they know it, and they can control it.\nConstructive possession: the intent and ability to control it.\nExclusive control of the place (a sole resident’s home) is usually enough.\nShared places need other incriminating circumstances."},{"l":"cs","o":10,"t":"s","q":"During a warrant, four men run out the back. A crack rock is found on the ground two feet from one of them, about the same distance from the others. He doesn’t live there. Enough for possession?","a":["Yes, he was closest","No, there’s nothing else tying him to it","Yes, because he ran"],"c":1,"w":"Without exclusive control, the State needs other incriminating circumstances."},{"l":"cs","o":10,"t":"f","h":"Overdose immunity and drug tax","b":"Someone who calls 911 in good faith for an overdose, gives their name, and isn’t in the middle of a warrant or search can’t be prosecuted for certain possession offenses found because of the call. The overdose victim gets similar limited immunity.\nUnauthorized Substances Tax: report arrests involving taxable amounts (over 42.5 g of marijuana, 7+ g of most other drugs) to the Department of Revenue within 48 hours."},{"l":"cct","o":1,"t":"f","h":"Duty to intervene and report (§ 15A-401(d1))","b":"An officer who sees another officer use force they reasonably believe is excessive, and has a reasonable chance to intervene, must try to intervene if it’s safe.\nThey must report it to a superior in their own agency within 72 hours, even if they couldn’t intervene.\nIf their agency head was involved or present, report to the highest-ranking officer who wasn’t.\nIf the other officer is from another agency, report to your own; your agency head notifies theirs."},{"l":"cct","o":1,"t":"q","q":"Your agency head was present during a use of force you believe was excessive. Who do you report it to?","a":["The agency head anyway","The highest-ranking officer in your agency who wasn’t involved or present","No one; the head already knows"],"c":1,"w":"The report still has to happen within 72 hours."},{"l":"cct","o":1,"t":"q","q":"A suspect who fought you is now handcuffed and compliant. May you keep using force?","a":["Yes, he resisted earlier","No, once compliance is gained the authority to use force ends","Yes, until he’s in the patrol car"],"c":1,"w":"If he resists again, that’s a new use of force evaluated fresh under Graham."},{"l":"cct","o":1,"t":"q","q":"If the arrest or stop itself was unlawful, any force used during it is…","a":["Still lawful if reasonable","Likely unlawful too, and could bring assault charges","Irrelevant to the stop"],"c":1,"w":"Whether the initial seizure was lawful factors into whether force was reasonable."},{"l":"cct","o":2,"t":"f","h":"The force option model","b":"Options are listed from least to most life-threatening, but it’s not a ladder.\nYou don’t have to try lower options first, as long as your choice is objectively reasonable.\nThe court asks: did you act as a reasonable officer would in the same situation?\nFactors include subject behavior, environment, reaction time and distance, number of subjects and officers, size, skill, age, injury or exhaustion, weapons available, alternatives like disengaging, and prior knowledge of the subject."},{"l":"cct","o":2,"t":"q","q":"Must an officer exhaust lower force options before using a higher one?","a":["Yes, always step up one level at a time","No, as long as the force chosen is objectively reasonable","Only for deadly force"],"c":1,"w":"The Constitution doesn’t require officers to gamble with their lives in the face of a serious threat."},{"l":"cct","o":2,"t":"f","h":"Pre-attack indicators","b":"Physical: heavy breathing, clenched jaw, unusual sweating, fists clenching, target glancing, sudden movement toward you, a fighting stance, a dropped shoulder, suddenly going still, “dressing down” (removing clothes or jewelry), spitting, staring through you.\nVerbal: raspy voice, repeated phrases (“What? Who, me?”), heavy profanity, calling you “you” instead of your title, abruptly stopping answers, or swinging from very uncooperative to very cooperative."},{"l":"cct","o":2,"t":"q","q":"A subject casually takes off his jacket and watch while you’re talking. This may indicate…","a":["He’s getting comfortable","“Dressing down,” a possible pre-attack indicator","He’s about to comply"],"c":1,"w":"It can look casual and non-threatening."},{"l":"cct","o":2,"t":"f","h":"Distance and position","b":"The 21-foot rule is a rough guideline, not a rule. It does not mean you may shoot anyone with a knife inside 21 feet.\nKeep at least 6 feet of reactionary distance when you can.\nPositions: inside (directly in front; avoid it), interview (about 45° off a front shoulder), side, escort (45° behind a shoulder), and rear.\nDisengaging to regain distance can be the preferred option."},{"l":"cct","o":2,"t":"q","q":"The “interview position” is…","a":["Directly in front of the subject","About 45 degrees off either of the subject’s front shoulders","Directly behind the subject"],"c":1,"w":"Directly in front (the inside position) is the area to avoid."},{"l":"cct","o":3,"t":"f","h":"Writing the use-of-force narrative","b":"– The call: type and dispatch information\n– Observations: people, numbers, behavior, impairment, environment, weapons, other officers\n– Your intentions, even if the result differed (aimed at an arm, struck the head)\n– Your actions: how they knew you were an officer, de-escalation, warnings, what they did and your response\n– Summary: medical care, photos, witness statements\nAvoid conclusions; describe what you saw, heard, smelled and felt. It’s fine to state that you feared for your safety."},{"l":"cct","o":3,"t":"q","q":"A report says only “The subject was intoxicated.” What’s wrong with it?","a":["Nothing; it’s accurate","It’s conclusory; it needs the observations behind the conclusion","It should say “drunk” instead"],"c":1,"w":"Include the odor, slurred speech, fumbling with documents, and so on."},{"l":"cct","o":3,"t":"q","q":"You aimed a baton strike at the subject’s arm, but he moved and was struck in the head. Your report should…","a":["Describe only the head strike","Describe both what you intended and what actually happened","Leave the strike out"],"c":1,"w":"Documenting intent matters most when it differs from the result."},{"l":"cct","o":4,"t":"f","h":"Arrest hazards","b":"Treat every arrest as potentially dangerous; none are routine.\nOfficers get hurt most from carelessness (poor approach, poor search, dropping their guard), overconfidence, and lack of training.\nSuspects may submit, flee, fight, or try to harm themselves. You must protect them even then.\nPlanned warrant service: manpower and firepower superiority, a simple plan, surprise, speed, and an advantageous location. A felony drug warrant suggests the person may be armed."},{"l":"cct","o":4,"t":"f","h":"Making the arrest","b":"Approach from the side or rear, avoid crowds, keep about 6 feet until you’ve scanned, and use an interview stance.\nIdentify yourself, tell them they’re under arrest, and state why.\nHandcuff behind the back except in unusual cases (injury, disability, late pregnancy).\nRefuse requests until they’re secured.\nGive them a copy of the warrant if you have it, take them to a judicial official without unnecessary delay, and let them contact counsel and friends."},{"l":"cct","o":4,"t":"q","q":"How should you approach a subject you’re about to arrest, when possible?","a":["Face to face so they see you coming","From the side or rear, keeping distance until you’ve scanned","Quickly from the front to surprise them"],"c":1,"w":"Side, escort or rear positions give you the advantage."},{"l":"crp","o":1,"t":"f","h":"Defining crime prevention","b":"The anticipation, recognition and appraisal of a crime risk, and taking action to remove or reduce it.\nTwo approaches:\n– Mechanical: barriers between the criminal and the target, like patrol and physical security\n– Corrective/punitive: changing offenders’ behavior through punishment"},{"l":"crp","o":1,"t":"q","q":"Patrols and physical security barriers represent which approach?","a":["Mechanical","Corrective/punitive","Territorial"],"c":0,"w":"The mechanical approach denies would-be offenders the opportunity."},{"l":"crp","o":2,"t":"f","h":"The security triangle","b":"Crime = Ability + Opportunity + Desire.\nRemove any side and you reduce crime. Police and citizens have the most influence over opportunity.\nOpportunity can come from the victim (tools left in the yard), the criminal (casing a target), or circumstance (robbing an unconscious person)."},{"l":"crp","o":2,"t":"q","q":"Which side of the security triangle can communities most directly reduce?","a":["Desire","Opportunity","Ability"],"c":1,"w":"There’s little you can do about a criminal’s ability or desire, but you can remove opportunity."},{"l":"crp","o":1,"t":"f","h":"SARA problem solving","b":"Scanning: identify problems from crime data, calls, complaints and observation.\nAnalysis: dig into the root cause.\nResponse: put coordinated solutions in place.\nAssessment: measure success, continuously and not just at the end."},{"l":"crp","o":1,"t":"q","q":"In SARA, which phase uncovers the root cause of a problem?","a":["Scanning","Analysis","Assessment"],"c":1,"w":"Scanning spots problems; analysis finds why they’re happening."},{"l":"crp","o":3,"t":"f","h":"CPTED’s four concepts","b":"Natural surveillance: maximize visibility so offenders feel seen.\nNatural access control: guide people with entrances, fencing, landscaping and lighting.\nTerritoriality: show ownership with fences, pavement treatments and signs.\nMaintenance: keep it up by replacing lights, trimming bushes, removing graffiti.\nStrategies include clear borders, marked transitions from public to private space, putting safe activities in unsafe places (and vice versa), and separating conflicting activities."},{"l":"crp","o":3,"t":"q","q":"Trimming bushes that block cameras and promptly removing graffiti is which CPTED concept?","a":["Territoriality","Maintenance","Natural access control"],"c":1,"w":"Upkeep of existing measures is the maintenance principle."},{"l":"crp","o":3,"t":"q","q":"Decorative pavement and a low fence marking a property line demonstrate…","a":["Territoriality","Natural surveillance","Corrective approach"],"c":0,"w":"Features that express ownership create a sense of territorial control."},{"l":"crp","o":4,"t":"f","h":"Home and business security tips","b":"Use solid or metal-clad doors with deadbolts and wide-angle peepholes. Leave spare keys with a trusted neighbor, never under the mat.\nSecure sliding doors with a dowel or pin.\nAddress numbers at least 5 inches high and lit.\nDon’t open the door to strangers; offer to make the call for them.\nIf you need help, yell “Fire!” It gets the best response.\nDuring an armed robbery, give up the property."},{"l":"crp","o":4,"t":"q","q":"What should you tell citizens to yell if they need bystanders’ help?","a":["“Help!”","“Fire!”","“Police!”"],"c":1,"w":"“Fire!” gets the best response. Breaking glass or honking a horn can work too."},{"l":"crp","o":5,"t":"f","h":"Preventing school violence","b":"1. Universal school-based prevention programs\n2. Parent- and family-based programs\n3. Street outreach programs\n4. Get to know students in non-confrontational settings; be a mentor, not just an enforcer\n5. Include administrators, staff and students in prevention efforts\n6. Build links with parents and community groups for positive after-school activities\nSROs have three roles: promote safety, solve problems, and serve as a liaison."},{"l":"crp","o":6,"t":"f","h":"Community programs","b":"Neighborhood Watch builds partnerships, can reduce crime, and improves communication.\nNational Night Out has been held the first Tuesday in August since 1984: lights on, neighbors meet, block parties with police.\nOther ideas: lunch with students, McGruff the Crime Dog events, door-to-door home security surveys with youth groups."},{"l":"crp","o":6,"t":"q","q":"When is National Night Out held?","a":["The first Tuesday in August","July 4th","The last Friday in October"],"c":0,"w":"It’s been held then since 1984."},{"l":"ori","o":1,"t":"f","h":"The School Director","b":"Plans, schedules, coordinates and manages each BLET course, and is primarily responsible for it.\nDecides when a student has a deficiency and how to fix it.\nIs solely responsible for deciding whether a trainee has the minimum knowledge to perform, and recommends them for the state exam.\nMay set rules stricter than the Commission minimums."},{"l":"ori","o":2,"t":"f","h":"Attendance","b":"An unexcused absence means termination from BLET.\nExcused absences can’t exceed 5% of total course hours, and each needs a makeup session before the last day.\nMissing more than 5% means dismissal even if absences were made up.\nFor limited enrollees, multiply their assigned topic hours by 0.05."},{"l":"ori","o":2,"t":"f","h":"How BLET questions are built","b":"Every end-of-block and state exam question has three choices:\n– One obviously or mostly wrong answer\n– One partially wrong answer (a distractor that looks right at first)\n– One correct answer\nNo true/false, and no “all of the above” or “none of the above.” Read every choice and look for key words in the question stem."},{"l":"ori","o":2,"t":"f","h":"Deficiencies","b":"Any deficiency makes you ineligible for the state exam until it’s fixed.\nOne or two deficiencies can be corrected, either in a standalone class with approval or as a limited enrollee in a later BLET.\nA third deficiency means immediate dismissal, and you can’t return as a limited enrollee.\nFailing an eighth topic test on the first try means immediate dismissal with no retest, no matter how many retests you passed."},{"l":"ori","o":2,"t":"q","q":"A student has failed seven topic tests but passed every retest. Then he fails his eighth topic test. What happens?","a":["He gets one retest","He’s dismissed immediately with no retest","He becomes a limited enrollee"],"c":1,"w":"He must complete a later BLET in its entirety."},{"l":"ori","o":2,"t":"q","q":"A student has two deficiencies, then gets a third. What happens?","a":["He can fix all three as a limited enrollee","He must be dismissed immediately and can’t enroll as a limited enrollee","He sits the state exam anyway"],"c":1,"w":"One or two deficiencies can be corrected; three cannot."},{"l":"ori","o":2,"t":"f","h":"The state exam","b":"Pass: 70% or higher.\n59% or lower: failure is final, no retest.\n60–69%: one retest. Request it within 30 days with the School Director’s favorable recommendation; the retest must happen within 60 days of the original exam.\nAfter passing, you have 12 months to become a sworn officer; the agency’s appointment package must reach Standards within that time."},{"l":"ori","o":2,"t":"q","q":"A student scores 64% on the state exam. What are their options?","a":["Failure is final","One retest, requested within 30 days with the School Director’s recommendation","Unlimited retests"],"c":1,"w":"The retest must be within 60 days of the original exam."},{"l":"ori","o":1,"t":"q","q":"After passing the state exam, how long do you have to become a sworn officer?","a":["6 months","12 months","3 years"],"c":1,"w":"The appointment package must be submitted within 12 months of passing."},{"l":"ori","o":4,"t":"f","h":"Disclosing your history","b":"On the F-3 Personal History Statement, list every arrest and charge regardless of outcome: dismissed, not guilty, or expunged. That includes citations and some ordinance violations.\nMinor traffic offenses are excepted, but DWI, hit-and-run, speeding to elude, and similar offenses must be listed.\nThe Commissions can see expunged records. Falsifying or withholding can bring denial or revocation for up to five years."},{"l":"ori","o":4,"t":"f","h":"Disqualifying offenses","b":"Any felony conviction: absolute disqualification.\nA Class B misdemeanor: can bar certification for five years.\nFour or more misdemeanors not on the Class B list: can bar certification for two years.\nThe Lautenberg Amendment bars firearm possession after a domestic violence misdemeanor conviction.\nOfficers must also report 50B and 50C orders."},{"l":"ori","o":4,"t":"f","h":"Keeping your certification","b":"Requalify with your firearms every year; failing suspends certification until you pass.\nComplete annual in-service training.\nBreak in service: under 1 year, generally no effect; 1 year or more, retraining; more than 3 years, full BLET again."},{"l":"ori","o":4,"t":"f","h":"Zero tolerance for cannabis","b":"Drug screens happen within 90 days of employment and test for cannabis, cocaine, PCP, opiates and amphetamines.\nHemp products up to 0.3% THC aren’t controlled, but CBD, Delta-8 and similar products are not an accepted explanation for a positive screen. Neither is legal use in another state.\nPositive screens or refusals can bring suspension of up to five years. Applicants who test positive for THC are denied for at least five years."},{"l":"ori","o":4,"t":"q","q":"An officer tests positive for THC and says it came from a legal CBD product. Result?","a":["The explanation is accepted","The result is still reported and the explanation isn’t accepted","Only a warning"],"c":1,"w":"Medical Review Officers still treat it as positive, and the agency must report it."},{"l":"ori","o":3,"t":"f","h":"Peel and professionalism","b":"Sir Robert Peel, the “father of modern policing,” held that the goal is preventing crime, not making arrests, and that police authority depends on public approval.\nThe test of efficiency is the absence of crime and disorder.\nForce is used only when persuasion, advice and warning aren’t enough.\nGuardians protect from within the community; take the guardian role first, and be ready to respond as a warrior when needed."},{"l":"ori","o":3,"t":"q","q":"According to Peel, the test of police efficiency is…","a":["The number of arrests made","The absence of crime and disorder","How fast officers respond"],"c":1,"w":"Effective departments don’t have high arrest rates; their communities have low crime rates."},{"l":"cap","o":1,"t":"f","h":"R.E.S.P.E.C.T.","b":"The steps for every preliminary criminal investigation:\nR: Respond to the scene and make it safe\nE: Emergency care for the injured\nS: Separate and remove people\nP: Protect the crime scene\nE: Evidence collection\nC: Corroborate evidence with the criminal elements\nT: Take action"},{"l":"cap","o":1,"t":"q","q":"In R.E.S.P.E.C.T., what does the “C” stand for?","a":["Call the supervisor","Corroborate evidence collected with the criminal elements","Clear the scene"],"c":1,"w":"Respond, Emergency care, Separate, Protect, Evidence, Corroborate, Take action."},{"l":"cap","o":1,"t":"q","q":"Why separate everyone involved right away?","a":["To preserve each person’s own account for interviews","To make arrests easier","So witnesses can compare notes"],"c":0,"w":"If a witness must leave, get their name and contact information for a follow-up. Detaining a suspect still requires reasonable suspicion."},{"l":"cap","o":2,"t":"f","h":"Intoxicated and disruptive (§ 14-444)","b":"Class 3 misdemeanor. Intoxicated (by alcohol, not drugs) in a public place and disruptive by:\n– Blocking traffic, a sidewalk, or a building entrance\n– Grabbing, shoving or pushing others\n– Fighting or challenging others to fight\n– Cursing, shouting at, or rudely insulting others\n– Begging\nBeing drunk in public alone isn’t a crime. Alcoholism is a complete defense. A non-disruptive drunk can be taken home or to treatment."},{"l":"cap","o":2,"t":"s","q":"At 1:15 a.m., a man in a motel lot smells of alcohol and is shouting “God is alive!” at the sky. He bothers no one and won’t give his name. Probable cause for intoxicated and disruptive?","a":["Yes, he’s drunk in public","No, his conduct isn’t one of the listed disruptive acts","Yes, because he won’t identify himself"],"c":1,"w":"Intoxication alone isn’t enough. You could help get him home or to treatment."},{"l":"cap","o":2,"t":"q","q":"A person is high on drugs, cursing at people on a sidewalk. Can you charge intoxicated and disruptive?","a":["Yes","No, the intoxication must be from alcohol","Only if they’re also begging"],"c":1,"w":"Drug impairment doesn’t satisfy the intoxication element. Consider disorderly conduct instead."},{"l":"cap","o":2,"t":"f","h":"Disorderly conduct (§ 14-288.4)","b":"Class 2 misdemeanor. Intentionally causing a public disturbance by:\n– Fighting, other violent conduct, or conduct creating an imminent threat of violence, or\n– Utterances, gestures, displays or abusive language intended to, and plainly likely to, provoke violent retaliation\nOfficers are expected to show more restraint than ordinary citizens, so insults aimed at officers rarely qualify. A charge should never be used to show who’s boss."},{"l":"cap","o":2,"t":"q","q":"A passenger in a passing SUV yells “Hey!” and gives you the middle finger. What crime is that?","a":["Disorderly conduct by abusive language","No crime","Resisting an officer"],"c":1,"w":"Even yelling a profanity at an officer isn’t reasonable suspicion to stop the vehicle."},{"l":"cap","o":2,"t":"q","q":"In a magistrate’s lobby, a woman yells “Shut the hell up and don’t screw with me!” at an officer and demands her son be released. Which charge fits best?","a":["Disorderly conduct in a public building (§ 14-132)","Intoxicated and disruptive","False report"],"c":0,"w":"It covers rude or riotous noise or disorderly conduct in or near a public building, including its grounds. Try to de-escalate first: explain bonding, escort her out, let her speak with the magistrate once calm."},{"l":"cap","o":2,"t":"f","h":"Resist, delay, obstruct (§ 14-223)","b":"Class 2 misdemeanor; Class I felony if it causes injury to the officer, Class F if serious injury.\nWillfully and unlawfully resisting, delaying or obstructing a public officer, knowing they’re an officer, while they perform a lawful duty.\nNo force is required, but there must be actual interference.\nArguing, criticizing, objecting to someone else’s arrest, or videotaping isn’t enough by itself.\nWalking away from a consensual encounter isn’t resisting."},{"l":"cap","o":2,"t":"q","q":"You try to serve an arrest warrant, and the man refuses repeated requests to get out of his car, so you have to pull him out. Resisting?","a":["Yes","No, he didn’t use force","Only if he struck you"],"c":0,"w":"Force isn’t required; his refusal actually interfered with a lawful arrest."},{"l":"cap","o":2,"t":"q","q":"A passenger follows you to the patrol car, insisting you return the whiskey you seized as evidence. Resisting?","a":["Yes, he delayed you","No, objecting without actual interference isn’t enough","Yes, if he raises his voice"],"c":1,"w":"Arguing or objecting isn’t an offense unless it actually interferes."},{"l":"cap","o":2,"t":"f","h":"False report (§ 14-225)","b":"Class 2 misdemeanor; Class H felony if it involves a missing child under 16 or certain serious felonies against a child.\nWillfully making a false, misleading or unfounded report to law enforcement for the purpose of interfering with the agency or hindering an officer.\nA false statement alone isn’t the crime; the purpose to interfere or hinder is required."},{"l":"cap","o":2,"t":"q","q":"After her boyfriend’s DWI arrest, a woman falsely calls in claiming she was the driver. Is that a false report?","a":["No, it’s just a lie","Yes, it hinders the officer’s investigation","Only if made in writing"],"c":1,"w":"Her false claim was made to hinder an officer performing official duties."},{"l":"cap","o":2,"t":"f","h":"Carrying concealed weapons (§ 14-269)","b":"Pistol or gun: Class 2 misdemeanor (second offense, Class I felony). Willfully carrying it concealed about the person, off one’s own premises, unless an exception applies: a valid concealed handgun permit, on-duty officers, and certain others.\nOther weapons: Bowie knife, dirk, dagger, slingshot, loaded cane, metallic knuckles, razor, shuriken, stun gun, or similar deadly weapons. Class 2 misdemeanor.\n“About the person” includes within reach, like under the driver’s seat. Several concealed weapons on one person usually mean one charge."},{"l":"cap","o":2,"t":"q","q":"A driver is seen reaching under his seat, and a handgun is found there. He has no permit. Can it be concealed “about the person”?","a":["No, it wasn’t on his body","Yes, it was within his reach and control","Only if it was loaded"],"c":1,"w":"A rifle under the back seat, or a backpack with no known location, wasn’t enough in other cases."},{"l":"cap","o":2,"t":"f","h":"Guns on school grounds (§ 14-269.2)","b":"Class I felony to knowingly possess any firearm on educational property or at a school-sponsored activity, concealed or not, loaded or not. Discharging one there is a Class F felony.\n“School” includes public and private schools, community colleges, colleges and universities. Off-site school events like a prom at a hotel count.\nOther weapons (BB guns, stun guns, knives, metallic knuckles, fireworks): Class 1 misdemeanor.\nExceptions: permit holders who keep the handgun in a closed compartment in a locked vehicle, and a few others."},{"l":"cap","o":2,"t":"q","q":"A 15-year-old keeps an unloaded 9mm in his school locker with no ammunition anywhere. Can he be charged with possessing a firearm on school grounds?","a":["No, it wasn’t loaded","Yes","Only if he showed it to someone"],"c":1,"w":"The gun doesn’t need to be loaded or even operable."},{"l":"cap","o":2,"t":"q","q":"A man without a concealed handgun permit brings a pistol into a nightclub that sells and serves alcohol “for self-defense.” This is…","a":["Lawful self-defense","A Class 1 misdemeanor under § 14-269.3","Lawful if the gun is unloaded"],"c":1,"w":"The law covers places licensed for both sale and consumption. Permit holders, owners and hired security are exempt."},{"l":"cap","o":2,"t":"f","h":"Going armed to the terror of the people","b":"A common-law offense, Class 1 misdemeanor.\nArming oneself with an unusual and dangerous weapon, for the purpose of terrifying others, and going about on public highways in a manner that causes terror.\nExample: a man carrying a pistol and an AR-15 down a highway, shouting that council members “must be stopped” while people scream and flee."},{"l":"cap","o":2,"t":"f","h":"Altered serial numbers and felons with guns","b":"Firearm with an altered serial number (§ 14-160.2): Class H felony to knowingly sell, buy or possess a gun whose serial number was altered, defaced or removed to conceal its identity. Altering the number is also a Class H felony.\nFirearm by a felon (§ 14-415.1): Class G felony for anyone convicted of a felony (or a similar out-of-state offense punishable by more than a year) to own, possess or control a firearm. The gun doesn’t have to work, and constructive possession counts, like a shotgun in the trunk he knows about."},{"l":"cap","o":2,"t":"q","q":"A convicted felon is driving with a shotgun in the trunk that he knows is there. Can he be charged with possession of a firearm by a felon?","a":["No, it wasn’t within reach","Yes, he has constructive possession","Only if it’s loaded"],"c":1,"w":"Knowing about it and having control over it is enough."},{"l":"cap","o":2,"t":"f","h":"Prostitution and indecent exposure","b":"Prostitution (§ 14-204): Class 1 misdemeanor. Performing, offering or agreeing to perform a sexual act or contact for money or other consideration. Soliciting is a Class 1 misdemeanor first offense, a felony after that, and a Class G felony if an adult solicits a minor.\nIndecent exposure (§ 14-190.9): Class 2 misdemeanor. Willfully exposing private parts (genitals and anus, not buttocks or breasts) in a public place in someone’s presence; they don’t have to actually see it. Class H felony if an adult does it in front of someone under 16 for sexual gratification."},{"l":"cap","o":2,"t":"q","q":"Under N.C. indecent exposure law, which counts as “private parts”?","a":["Buttocks","Female breasts","Genitals and anus"],"c":2,"w":"The court of appeals has ruled that buttocks and female breasts aren’t private parts for this statute."},{"l":"cap","o":2,"t":"f","h":"ABC law basics","b":"Alcoholic beverage: 0.5% alcohol or more. Malt beverage up to 15%; unfortified wine up to 16%; fortified wine 16–24%.\nUnder 21 can’t buy, try to buy, possess, or consume alcohol. Possessing or buying beer or unfortified wine at 19 or 20 is a Class 3 misdemeanor; consuming under 19 is a Class 1 misdemeanor.\nSelling or giving alcohol to anyone under 21 is illegal, as is knowingly selling to someone intoxicated (you must prove the server knew).\nOpen container: no opened fortified wine or liquor in the passenger area, and the driver can’t drink beer or wine while driving. Class 3 misdemeanor."},{"l":"cap","o":2,"t":"q","q":"A 20-year-old is holding a can of beer at a football game. The charge is most likely…","a":["Class 3 misdemeanor underage possession","Class I felony","No offense at a public event"],"c":0,"w":"For 19- and 20-year-olds, buying or possessing malt beverages or unfortified wine is a Class 3 misdemeanor. Be consistent in how you enforce it."},{"l":"cap","o":2,"t":"q","q":"What’s the minimum alcohol content for a drink to be an “alcoholic beverage” under N.C. law?","a":["0.5% by volume","3% by volume","6% by volume"],"c":0,"w":"Some “non-alcoholic” beers fall below 0.5%. Check the label."},{"l":"ci","o":9,"t":"f","h":"Offender and records databases","b":"DCIN (Division of Criminal Information Network): the SBI’s statewide network linking agencies, DMV, courts and the FBI, available 24/7.\nNCIC (National Crime Information Center): the FBI’s national files on wanted, missing and unidentified persons, protection orders, sex offenders, gangs, and stolen vehicles, guns and property.\nSBI CCH (Computerized Criminal History): N.C. arrest and court records for people who were fingerprinted.\nAOC court records and eWarrants: county court records and all unserved N.C. criminal process.\nCJLEADS: combined data from state databases, including warrants, court and jail records, probation, sex offender status, gang ties, photos and DMV.\nNLETS: out-of-state driver’s licenses, registrations, criminal histories and messages for all 50 states and Canada."},{"l":"ci","o":9,"t":"q","q":"Which system holds the FBI’s national files on wanted persons, missing persons and stolen guns?","a":["NCIC","DMV","AOC eWarrants"],"c":0,"w":"NCIC is a division of the FBI in Clarksburg, West Virginia."},{"l":"ci","o":9,"t":"q","q":"You need a driver’s license and vehicle registration from Ohio. Which system gets out-of-state information?","a":["DCIN Hot Files","NLETS","SBI CCH"],"c":1,"w":"NLETS connects all 50 states and Canada. DCIN Hot Files are N.C.-only."},{"l":"ci","o":9,"t":"q","q":"Which database holds a statewide repository of all unserved N.C. criminal process, like warrants and orders for arrest?","a":["eWarrants (AOC)","NLETS","NCIC gang file"],"c":0,"w":"Some local process never gets entered into NCIC or DCIN, so eWarrants catches what they miss."},{"l":"ci","o":9,"t":"q","q":"Which N.C. system pulls warrants, court and jail records, probation status, sex offender status, gang affiliation and DMV records together, and requires a four-hour certification course?","a":["CJLEADS","NLETS","DCIN"],"c":0,"w":"Users access it at cjleads.nc.gov after completing the course."},{"l":"ci","o":9,"t":"f","h":"DCIN Hot Files and DMV","b":"DCIN Hot Files (N.C. only): recovered vehicles, concealed handgun permits, sex offender registration, and Department of Adult Correction records.\nDMV through DCIN: search registrations by plate (no partial plates), VIN, owner, title or customer number. License checks automatically search for wants and missing-person entries.\nNever announce driver history over the radio; telecommunicators use codes."},{"l":"ci","o":9,"t":"q","q":"Can you run a partial license plate through DCIN?","a":["Yes","No","Only for felonies"],"c":1,"w":"Registration searches need the full plate, VIN, owner name, title, customer ID, or placard number."},{"l":"ci","o":9,"t":"f","h":"Using database hits","b":"Person searches: enter unique numbers first (SSN, license, FBI number), then name and date of birth. Hits include wanted, missing, sex offender, protection orders, probation violations.\nProperty searches use serial or owner-applied numbers: lost, stolen, recovered, used in a crime. NCIC gun entries must have a serial number.\nAlways confirm a hit with the entering agency before acting. Arresting on a stale entry is the biggest liability risk. A confirmed hit is probable cause for a fugitive warrant.\n“No record” only means no index in that system, not a clean history."},{"l":"ci","o":9,"t":"q","q":"An NCIC check shows a warrant hit on the driver. Before arresting, you should…","a":["Arrest immediately; NCIC is always accurate","Confirm the record with the entering agency","Wait until the end of your shift"],"c":1,"w":"Warrants are sometimes served without the entry being removed. Confirmation prevents false arrests."},{"l":"ci","o":9,"t":"q","q":"An SBI criminal history check comes back “No Record.” This means…","a":["The person has never been arrested","There’s no index in that system; they may still have a record","They’re eligible for a gun permit"],"c":1,"w":"Arrests without a fingerprint card may not appear."},{"l":"ci","o":9,"t":"q","q":"In NCIC, a vehicle used in a felony that isn’t reported stolen and whose location is unknown goes in which file?","a":["Stolen vehicles","Felony vehicles","Recovered vehicles"],"c":1,"w":"Recovered vehicles are in police possession with the owner unknown or unreachable."},{"l":"ci","o":8,"t":"f","h":"Modus operandi","b":"M.O. is the learned behavior pattern a suspect believes is necessary to commit a crime. If it works, they repeat it.\nIt won’t name the suspect, but it links crimes and helps clear other cases once a suspect is found.\nPatterns: time and location, weapon or tool, type of property taken, entry and exit points, statements to victims, type of victim, and unique rituals.\nVictim traits: age, sex, appearance, family, job, finances, habits, alcohol or drug use."},{"l":"ci","o":8,"t":"q","q":"How does M.O. help an investigation?","a":["It identifies the suspect by name","It links multiple crimes to the same suspect","It replaces physical evidence"],"c":1,"w":"Establishing an M.O. can help clear other cases once a suspect is developed."},{"l":"ci","o":2,"t":"f","h":"Photographing a crime scene","b":"Never use a personal phone or camera.\nCapture the scene unaltered, without officers or EMS in the frame.\nCheck each shot for focus. Take more than you think you need, and never delete any; the whole file goes to the prosecutor.\nWork from overall (from the perimeter, including landmarks and addresses) to mid-range to close-up. Use a scale in close-ups and shoot with and without evidence markers.\nLog photographer, date and time, order, and case number. Store images with a chain of custody."},{"l":"ci","o":2,"t":"q","q":"You took a blurry photo of a footprint. What do you do with it?","a":["Delete it and retake","Keep it and take another","Edit it to sharpen the image"],"c":1,"w":"Never delete or permanently alter crime scene photos. § 15A-903 requires the full file go to the prosecutor."},{"l":"ci","o":3,"t":"f","h":"Chain of custody","b":"The chronological documentation of evidence from seizure to court, showing it’s the same item and wasn’t tampered with.\nRecord:\n– Date, time and exact location found and seized\n– Name of the officer who seized it\n– Every date and time it was transferred\n– Name and agency of everyone who handled it\n– A complete description for positive identification\nAn unreliable chain can get evidence excluded."},{"l":"ci","o":4,"t":"f","h":"Trace and DNA evidence","b":"Trace evidence transfers between surfaces on contact and is fragile: soil, glass, fibers, paint, wood particles. Identify and protect it; call experts.\nDNA sources: hair, tissue, bones, teeth, blood, saliva, semen. Found on bat or knife handles, hat bands, eyeglasses, cigarette butts, licked stamps and envelopes, bottle rims, bite marks, fingernail scrapings, bedding.\nDon’t talk, cough or eat near it. Wear protective gear and change gloves after each swab. Swab before fingerprinting. Package in paper and air-dry wet items first."},{"l":"ci","o":5,"t":"q","q":"How should clothing with possible blood or DNA be packaged?","a":["In a sealed plastic bag","In paper, after air-drying if wet","In a glass jar"],"c":1,"w":"Plastic traps moisture and degrades biological evidence."},{"l":"ci","o":4,"t":"q","q":"Which is an example of trace evidence?","a":["Paint particles","A confession","A surveillance video"],"c":0,"w":"Others include soil, glass, textile fibers and wood particles."},{"l":"ci","o":10,"t":"f","h":"Direct vs. circumstantial evidence","b":"Direct evidence: testimony about what a person personally saw, heard, smelled, felt or did.\nCircumstantial evidence: facts that point to a conclusion by inference.\nExample: “I saw the mail carrier at my mailbox” is direct. “I saw mail in my mailbox” is circumstantial evidence that the carrier came.\nThe law gives both the same weight."},{"l":"ci","o":10,"t":"q","q":"A witness testifies she saw wet footprints leading from the pool to the house. As proof that someone went inside, this is…","a":["Direct evidence","Circumstantial evidence","Hearsay"],"c":1,"w":"No one saw the person enter; it’s inferred. The law weighs direct and circumstantial evidence equally."},{"l":"ci","o":12,"t":"f","h":"Show-ups and lineups","b":"Show-up: a single live suspect shown to a witness. Only allowed when someone matching the description is found close in time and place to the crime and circumstances require an immediate display. Never with a photo.\nGet full descriptions first, separate witnesses, stay neutral, do it near the scene (not at the station), and bring the witness to the suspect. Photograph the suspect at the show-up.\nLineups use fillers and an independent administrator who doesn’t know who the suspect is.\nMemory has three stages: acquisition, retention, retrieval. Recognition is easier than recall."},{"l":"ci","o":12,"t":"q","q":"For a show-up, you should generally…","a":["Bring the suspect back to the crime scene","Bring the witness to where the suspect is","Show the witness a single photo"],"c":1,"w":"Moving the suspect into the scene can taint evidence and the identification. Show-ups never use photographs."},{"l":"ci","o":12,"t":"q","q":"In a lineup, an “independent administrator” is someone who…","a":["Picks the fillers","Doesn’t know which person is the suspect","Is the lead investigator"],"c":1,"w":"That prevents unintentional cues to the witness."},{"l":"ci","o":13,"t":"f","h":"States of mind","b":"Intentionally: desires the result. General intent (just the act), specific intent (an extra purpose, like intent to kill), transferred intent (meant to harm A, harmed B).\nKnowingly: aware of what they’re doing, including what they reasonably should have known.\nWillfully: purposely, without legal excuse.\nMaliciously: with ill will, or with reckless disregard for life, or intentionally without justification.\nWantonly: conscious disregard for others’ safety (essentially willfully).\nCriminal (culpable) negligence: heedless indifference to others’ safety. More than ordinary negligence, less than malice."},{"l":"ci","o":13,"t":"q","q":"A man aims a gun at someone he means to kill, misses, and kills a bystander. Which principle applies?","a":["Transferred intent","Criminal negligence","Willful blindness"],"c":0,"w":"The intent to kill the target transfers to the person actually harmed."},{"l":"ci","o":13,"t":"q","q":"Struggling to clear a jammed gun, a man pulls the trigger while it’s pointed at his friend and kills him. That’s an example of…","a":["Malice","Criminal (culpable) negligence","Ordinary negligence"],"c":1,"w":"It shows heedless indifference to the victim’s safety: more than an accident, less than malice."},{"l":"ci","o":13,"t":"q","q":"Assault with a deadly weapon with intent to kill is what kind of intent crime?","a":["General intent","Specific intent","Strict liability"],"c":1,"w":"“Intent to kill” is a special mental element beyond the intent to commit the act."},{"l":"cri","o":1,"t":"f","h":"Five types of mental illness","b":"Psychosis (loss of reality): disorganized speech, delusions, hallucinations, extreme agitation.\nDepression (hopelessness): slow speech, guilt, worthlessness, lethargy, withdrawal. About 30% attempt suicide.\nBipolar disorder (mood swings): manic periods of racing speech, little sleep, risky behavior; depressive periods.\nAnxiety disorders (loss of perspective): excessive worry or panic, irritability, restlessness.\nPost-traumatic stress and other disorders can also bring crisis.\nOfficers recognize behaviors; they don’t diagnose. Mental illness doesn’t lower intelligence."},{"l":"cri","o":1,"t":"q","q":"A woman is talking extremely fast about many topics, hasn’t slept in days, and has been on a spending spree. These signs suggest…","a":["A manic episode of bipolar disorder","Depression","An intellectual disability"],"c":0,"w":"Manic episodes bring racing thoughts, little sleep, and impulsive, risky behavior."},{"l":"cri","o":1,"t":"q","q":"Someone hears voices no one else hears and believes everyone is out to get him. These are signs of…","a":["Anxiety","Psychosis","A developmental disability"],"c":1,"w":"Psychosis involves losing contact with reality: hallucinations and delusions."},{"l":"cri","o":2,"t":"f","h":"Signs of an intellectual or developmental disability","b":"– Difficulty communicating or limited vocabulary\n– Trouble understanding complex information or instructions\n– Mimicking answers\n– Unaware of social norms\n– Erratic, unstable or uncooperative\n– Low frustration tolerance or poor impulse control\n– Easily distracted\n– Awkward or poorly coordinated\nIDD appears before age 22 (traumatic brain injury can come later). If you suspect it, proceed as though the person has it."},{"l":"cri","o":2,"t":"f","h":"Communicating with someone with IDD","b":"Normal tone and pace; simple, direct questions that don’t suggest answers.\nThey tend to pick the last option offered, so ask again with the options reordered.\nWait up to 15 seconds for an answer.\nHave them explain back what they understood.\nWatch for sensory overload from sirens, lights or touch; move somewhere quieter.\nExplain what you’re doing and how long it will take; use rewards and visual cues.\nAggression is often communication, not malice. Step back if you safely can."},{"l":"cri","o":2,"t":"q","q":"How long should you wait for a person with an IDD to answer, even a yes-or-no question?","a":["About 2 seconds","Up to 15 seconds","There’s no need to wait"],"c":1,"w":"Many people with IDD have cognitive processing delays."},{"l":"cri","o":3,"t":"f","h":"How people with IDD may react to officers","b":"– Feel overwhelmed by your presence\n– Flee or get upset because they don’t understand\n– Not follow instructions\n– Not grasp how serious things are\n– Be easily persuaded\n– Struggle to describe details\n– Give the answer they think you want, or default to yes or no\n– Waive Miranda without understanding\n– Confess to something they didn’t do to be cooperative"},{"l":"cri","o":3,"t":"q","q":"Why must you be especially careful interviewing a suspect with an IDD?","a":["They may confess falsely to please you","They always lie","They can’t be interviewed"],"c":0,"w":"They may also waive rights without understanding, which raises voluntariness and Miranda issues."},{"l":"cri","o":4,"t":"f","h":"Suicide warning signs","b":"– Putting affairs in order, giving away possessions, making a will\n– A sudden switch from very depressed to calm and happy\n– Hopelessness or feeling trapped (“Everyone would be better off without me”)\n– Talking about killing or harming themselves\n– Preoccupation with death\n– Acting recklessly as if they want to die\nAsking someone directly about suicide doesn’t plant the idea. Officers are three times more likely to die by suicide than in the line of duty."},{"l":"cri","o":4,"t":"q","q":"A depressed man suddenly seems calm and happy and has started giving away his things. What should you think?","a":["He’s recovered","These are warning signs he may intend suicide","It’s unrelated"],"c":1,"w":"Relief can come from having decided to die."},{"l":"cri","o":4,"t":"q","q":"Should you ask a person directly whether they’re thinking about suicide?","a":["No, it might give them the idea","Yes; asking doesn’t plant the idea and helps you understand","Only a doctor should ask"],"c":1,"w":"Talking about it also lets them release some of the tension."},{"l":"cri","o":4,"t":"f","h":"Suicide by cop","b":"Indicators: signs of crisis, saying “shoot me,” not acting like a typical criminal (not fleeing), aggression toward officers for no reason, random violence like ramming a patrol car.\nResponse: gather information and request CIT if there’s time; make the scene safe (take cover if there’s a firearm, keep distance otherwise); use one contact officer to talk while others cover; slow things down."},{"l":"cri","o":5,"t":"f","h":"Involuntary commitment (IVC)","b":"Requires mental illness (or substance abuse) AND danger to self or others.\nA petitioner files an affidavit and petition (AOC-SP-300) with the magistrate or clerk; the custody order (AOC-SP-302A, or 302B from a clinician) lets officers take custody.\nThe order is valid for 24 hours; if not served, document why and return it.\nTell the respondent they’re not under arrest. Take them to the facility on the order, never a jail.\nThe evaluator has 24 hours to decide. If they don’t meet criteria, return them to their home county. Don’t leave them unattended."},{"l":"cri","o":5,"t":"q","q":"An IVC custody order is valid for how long?","a":["24 hours","72 hours","30 days"],"c":0,"w":"If the respondent isn’t found in 24 hours, the order is void and the process starts over."},{"l":"cri","o":5,"t":"q","q":"While waiting for an evaluation, can an IVC respondent be held in the county jail?","a":["Yes, if there’s no bed","No, never in a detention or penal facility","Only overnight"],"c":1,"w":"They aren’t charged with a crime. Stay with them until they’re evaluated and in a secure environment."},{"l":"cri","o":5,"t":"f","h":"Dangerous to self or others","b":"Dangerous to self: reasonable probability of serious physical debilitation without treatment (grossly irrational behavior suggests they can’t care for themselves), or a suicide attempt or threat, or self-mutilation, with a reasonable probability it will happen again.\nDangerous to others: within the relevant past, inflicted, attempted or threatened serious bodily harm, created a substantial risk of it, or extreme property destruction, with a reasonable probability of repetition."},{"l":"cri","o":5,"t":"f","h":"Emergency commitment and transport","b":"Emergency (mental illness): if the person is mentally ill, dangerous, and needs immediate hospitalization, you may take them straight to a mental health professional, bypassing the magistrate (where available).\nEmergency (substance abuse): if delay would endanger life or property, take them into custody but go immediately to a magistrate.\nTransport: plain clothes and unmarked vehicles where feasible; a same-sex attendant (or a family member); only reasonable force, and a taser only with immediate danger."},{"l":"cri","o":6,"t":"f","h":"Responding to a person in crisis","b":"Plan ahead and request backup or CIT.\nKeep a safe reactionary distance.\nCall EMS for unresponsiveness, breathing trouble, shock, chest pain, uncontrolled bleeding or severe pain.\nCut distractions: sirens, lights, radio, bystanders; ask to turn off TVs.\nAvoid command presence and power struggles; less authoritarian, less controlling, less confrontational gives you more control.\nDon’t judge or minimize. Slow down; de-escalation takes time."},{"l":"cri","o":6,"t":"f","h":"Four questions in every crisis call","b":"1. What’s the appropriate de-escalation response?\n2. Is the person dangerous to self or others?\n3. What legal authority do you have to act (arrest, IVC, emergency commitment, none)?\n4. What action should you take: refer to resources (mobile crisis, crisis unit, case manager), voluntary or involuntary commitment, or arrest if a crime and necessary?\nUse the least restrictive option that keeps everyone safe."},{"l":"cri","o":6,"t":"s","q":"A man with schizophrenia is pacing his yard, talking to voices, but hasn’t threatened or harmed anyone, and he’s caring for himself. Family wants him “taken away.” What’s your authority?","a":["IVC him because he has a mental illness","No commitment authority without danger to self or others; connect him and family to resources","Arrest for disorderly conduct"],"c":1,"w":"IVC requires mental illness AND dangerousness. Mobile crisis, his case manager, or voluntary treatment are options."},{"l":"cri","o":6,"t":"s","q":"You arrive with lights and siren on. A woman in crisis covers her ears, rocking and getting more agitated. First move?","a":["Give loud, clear commands","Turn off the siren and lights and reduce distractions","Handcuff her for safety"],"c":1,"w":"Sensory overload escalates people in crisis, especially with auditory hallucinations or IDD."},{"l":"cri","o":6,"t":"q","q":"With a person in a mental health crisis, using strong command presence (loud orders, demanding compliance) tends to…","a":["Resolve things quickly","Be counterproductive and may lead to a confrontation","Calm them down"],"c":1,"w":"Giving the person a sense of control makes them more likely to accept your suggestions."},{"l":"dp","o":1,"t":"f","h":"When to call the medical examiner (§ 130A-383)","b":"Notify the ME of the county where the body is found when a death:\n1. Is caused by violence, homicide, suicide, poisoning or accident\n2. Happens under suspicious, unusual or unnatural circumstances\n3. Is sudden in someone in apparent good health\n4. Is unattended by a physician\n5. Happens in a jail, prison or police custody\n6. Happens in certain state facilities\nDon’t disturb the body until the ME authorizes it, unless leaving it would compromise it or endanger others."},{"l":"dp","o":1,"t":"q","q":"An elderly man dies at home, not under a doctor’s immediate care, with no signs of foul play. Must the ME be notified?","a":["No, it looks natural","Yes, the death was unattended by a physician","Only if family requests"],"c":1,"w":"Unattended deaths are one of the six circumstances in § 130A-383."},{"l":"dp","o":1,"t":"q","q":"Who determines whether a death is a homicide, suicide, accident, natural, or undetermined?","a":["The responding officer","The medical examiner","The district attorney"],"c":1,"w":"Law enforcement provides information to help the ME decide."},{"l":"dp","o":2,"t":"f","h":"Murder and manslaughter","b":"First-degree murder (Class A): malice plus premeditation and deliberation, or by poison, lying in wait, torture, etc., or during certain felonies (felony murder).\nSecond-degree murder (Class B1/B2): killing with malice, without premeditation.\nVoluntary manslaughter (Class D): an intentional killing without malice, in the heat of passion from adequate provocation or with imperfect self-defense (aggressor or excessive force).\nInvoluntary manslaughter (Class F): unintentional killing by an unlawful act not amounting to a felony, or by culpable negligence."},{"l":"dp","o":2,"t":"q","q":"A man poisons his father’s sandwich with arsenic, and the father dies. The charge is…","a":["Second-degree murder","First-degree murder","Voluntary manslaughter"],"c":1,"w":"Killing by poison is first-degree murder."},{"l":"dp","o":2,"t":"q","q":"A woman beaten and threatened by her ex shoots him four times, using more force than needed to defend herself. This is likely…","a":["First-degree murder","Voluntary manslaughter (imperfect self-defense)","Involuntary manslaughter"],"c":1,"w":"Excessive force in self-defense displaces malice, reducing murder to voluntary manslaughter."},{"l":"dp","o":2,"t":"q","q":"Threatening someone with a loaded gun, a man struggles with a bystander who grabs it; it fires and kills the bystander. Likely charge?","a":["Involuntary manslaughter","First-degree murder","No crime"],"c":0,"w":"It’s culpably negligent conduct causing an unintentional death."},{"l":"dp","o":2,"t":"q","q":"What’s the key difference between second-degree murder and voluntary manslaughter?","a":["The weapon used","Malice: present in murder, absent in manslaughter","Whether the victim knew the suspect"],"c":1,"w":"Heat of passion or imperfect self-defense removes malice."},{"l":"dp","o":3,"t":"f","h":"Evidence at a death scene","b":"Use PPE. Don’t move the body or evidence, and leave EMS supplies where they are.\nRecord any changes responders made: lights, doors, moved objects, whether the body was moved (and by whom), engine warm or cold.\nLocation evidence: weather, odors, exact body location, nearby weapons or ropes, notes and documents, medications, drugs, alcohol.\nBody evidence: identity, scars and tattoos, position, clothing, hands and feet (protect for DNA), injuries, lividity and rigor. Photograph beneath the body after removal.\nThere’s no suicide-scene exception to the warrant requirement."},{"l":"dp","o":4,"t":"f","h":"Livor and rigor mortis","b":"Livor mortis (lividity): purplish pooling of blood on the lowest side of the body. Appears about half an hour to four hours after death and is fixed after about 12 hours. If it’s on the back but the body is face-down, the body was moved.\nRigor mortis: stiffening that starts 2–4 hours after death, beginning in the jaw and neck and moving downward. The whole body is rigid by 8–12 hours, stays about 12 more hours, then fades around 24 hours after death."},{"l":"dp","o":4,"t":"q","q":"A body is found face-down, but lividity is on the back. What does that suggest?","a":["Death was very recent","The body was moved after death","Rigor mortis has passed"],"c":1,"w":"Blood settles where gravity pulls it; lividity becomes fixed after about 12 hours."},{"l":"dp","o":4,"t":"q","q":"Where does rigor mortis usually appear first?","a":["Feet and legs","Jaw and neck","Hands"],"c":1,"w":"It starts 2–4 hours after death and moves head to foot."},{"l":"dp","o":5,"t":"f","h":"Possible suicide: what to ask","b":"Treat every apparent suicide as a suspicious death; homicides are sometimes staged.\nAsk:\n– Were the means present, and do the injuries match them?\n– Was it physically possible for the person to do it?\n– Any emotional pain, mental illness, job loss, divorce, death in the family?\n– Drug or alcohol abuse? Past attempts?\n– Talk of death, isolation, personality changes, risk-taking?\n– Recently bought a gun, updated a will, or gave away possessions?"},{"l":"dp","o":6,"t":"f","h":"Delivering a death notification","b":"Always in person, never by phone. Two officers in uniform or professional dress.\nPrepare ahead. Speak only with an adult immediate family member, in private, everyone seated.\nUse the person’s name. Say “dead” or “died,” not “passed on” or “lost.”\nGive facts but skip graphic details; answer truthfully and repeat as needed.\nShow empathy, embrace silence, and expect any reaction. Avoid clichés like “everything happens for a reason.”\nGive next steps in writing (ME and advocate contacts, where the person is) and offer to call others."},{"l":"dp","o":6,"t":"q","q":"When delivering a death notification, which wording is best?","a":["“I’m sorry, your son has passed on.”","“I’m sorry to tell you that your son, James, died this afternoon.”","“We lost James today.”"],"c":1,"w":"Clear words leave no room for false hope or confusion."},{"l":"dp","o":6,"t":"q","q":"The next of kin lives in another state. How should the notification happen?","a":["Call them yourself","Ask that state’s law enforcement or medical examiner to notify in person","Send a letter"],"c":1,"w":"Death notifications are never delivered over the phone."},{"l":"dv","o":1,"t":"f","h":"Dynamics of domestic violence","b":"A pattern of abusive behavior to gain or keep power and control over an intimate partner: physical, sexual, emotional, economic or psychological.\nIt happens across every group and in same-sex relationships.\nVictims leave an average of seven times before leaving for good, held back by economic dependence, fear, children, shame, isolation, threats to pets, or belief police won’t help.\nAbusers can be charming in public, jealous, isolating, and blame others."},{"l":"dv","o":1,"t":"q","q":"On average, how many times does a victim leave an abuser before leaving for good?","a":["Once","About seven times","Twenty times"],"c":1,"w":"Understanding these barriers helps you support the victim instead of blaming them."},{"l":"dv","o":2,"t":"f","h":"“Personal relationship” under § 50B-1","b":"Current or former spouses; persons of opposite sex who live or have lived together; parents, grandparents and children, or those acting in place of a parent; people with a child in common; current or former household members; and people in a current or past dating relationship.\nA dating relationship can be short (under three weeks counted in Thomas v. Williams) if it goes beyond casual acquaintance."},{"l":"dv","o":2,"t":"f","h":"Predominant aggressor","b":"The party posing the most serious ongoing threat, not necessarily who struck first or called 911.\nConsider: history of violence and prior orders, height, weight and age, disabilities, a current protective order, offensive vs. defensive injuries, who is genuinely afraid, how proportional the violence was, and who called 911 (abusers sometimes call first).\nDual arrests are strongly discouraged. You can arrest without visible injuries if you have probable cause."},{"l":"dv","o":2,"t":"s","q":"Both partners have scratches. He’s 6’2” with scratches on his face; she’s 5’2” with bruises on her forearms and is visibly terrified. He called 911. Who is likely the predominant aggressor?","a":["Her, because he called 911","Him: size, her defensive bruises, and her fear point to him","Both should be arrested"],"c":1,"w":"Forearm bruises are typical defensive wounds. Calling first doesn’t make someone the victim."},{"l":"dv","o":5,"t":"f","h":"Strangulation","b":"Assault by strangulation (§ 14-32.4) is a felony. Victims may have no visible injuries, so ask detailed questions.\nUnconsciousness can come in 7–10 seconds, stroke in 15, brain death in 4–5 minutes.\nThe risk of later homicide rises sharply for victims who’ve been strangled.\nThree types: hanging, ligature (cord, belt) and manual (hands or forearm)."},{"l":"dv","o":5,"t":"q","q":"A victim says her boyfriend choked her, but you see no marks. What should you do?","a":["Treat it as minor since there are no injuries","Take it seriously and ask detailed questions about what happened","Wait for bruises to appear"],"c":1,"w":"Strangulation often leaves no visible injury but greatly raises the risk of homicide."},{"l":"dv","o":3,"t":"f","h":"Helping victims","b":"Refer victims to local domestic violence and sexual assault programs, shelters, victim advocates, Legal Aid of N.C. (free help with protective orders), and child protective services when children are involved.\nA DVPO can grant temporary custody, possession of the residence, stay-away and no-contact orders, and protect pets. The sheriff enters it in NCIC.\nDocument referrals in your report, and note whether you provided transportation."},{"l":"dv","o":4,"t":"f","h":"Follow-up investigation","b":"Build a case that can go forward even without the victim’s participation.\n– Get EMS reports (a hearsay exception), medical releases, and hospital records\n– Get the 911 audio quickly; many places keep it only 60–90 days\n– Re-interview the victim and witnesses; photograph injuries again\n– Get contacts for two people who’ll know the victim’s whereabouts in 6–12 months\n– Check criminal history for prior DV that could upgrade charges\n– Within 72 hours, give the victim the AOC information sheet on services\n– Monitor jail calls and letters for admissions or DVPO violations"},{"l":"dv","o":4,"t":"q","q":"Why request the 911 recording early in a DV follow-up?","a":["Many jurisdictions keep 911 calls only 60–90 days","It’s required before any arrest","Victims must approve it"],"c":0,"w":"The call can capture excited statements and fear that help prove the case without the victim testifying."},{"l":"dv","o":5,"t":"q","q":"Neither party has visible injuries, but you have probable cause a DV assault occurred. Can you arrest without a warrant?","a":["No, injuries are required","Yes","Only with the victim’s permission"],"c":1,"w":"Probable cause is the standard. Visible injury isn’t required."},{"l":"crw","o":1,"t":"f","h":"Three types of crowds","b":"Lawful assembly: protected by the First Amendment while it stays within lawful bounds, like a permitted march.\nUnlawful assembly: no required permit, blocks travel, or other unlawful activity. It may be entirely peaceful, like an unpermitted march.\nRiotous assembly: always unlawful. Three or more people whose disorderly and violent conduct, or imminent threat of it, causes injury or damage or a clear and present danger of it (§ 14-288.2).\nCrowd management applies whenever you deal with three or more people in a group."},{"l":"crw","o":1,"t":"q","q":"A peaceful group marches down Main Street without the required permit. This is…","a":["A lawful assembly","An unlawful assembly","A riotous assembly"],"c":1,"w":"An unlawful assembly may have no violence at all. A riot requires disorderly and violent conduct or the imminent threat of it."},{"l":"crw","o":2,"t":"f","h":"Rights and the role of officers","b":"The First Amendment protects speech, assembly and petition. Government may impose only content-neutral time, place and manner limits.\nStreets, sidewalks and parks are traditional public forums. Private owners can set their own rules.\nPermits are usually needed only for marches that leave the sidewalk, large rallies with amplified sound, or certain parks and plazas.\nOfficers protect rights and keep the peace. Your actions, or failure to act, can turn a peaceful crowd violent."},{"l":"crw","o":4,"t":"f","h":"Types of protestors","b":"Everyday citizens: the large majority, peacefully exercising First Amendment rights.\nProfessional protesters: trained in tactics; may accept breaking “lesser” laws to prevent a perceived greater harm.\nAnarchists: aim to disrupt and challenge authority, often through property destruction (“black bloc”). They may blend into peaceful protests."},{"l":"crw","o":6,"t":"q","q":"A small group infiltrates a large, lawful protest and starts throwing objects. Officers should…","a":["Treat the whole crowd as rioters","Focus on the unlawful individuals while protecting the lawful protestors’ rights","Ignore it until the protest ends"],"c":1,"w":"Organizers of lawful assemblies often don’t condone the actions of a few."},{"l":"crw","o":7,"t":"f","h":"Crowd PPE","b":"The helmet (shell, chin strap, face shield) is the most common and important piece.\nOther gear protects the eyes, face, body, arms, hands and legs; respirators and shields are used as needed.\nWear only the PPE the hazards call for. Overdressing restricts movement and adds physical stress, especially in heat."},{"l":"hc","o":1,"t":"f","h":"Hate crime vs. hate incident","b":"Hate crime: a traditional crime (assault, vandalism) where the offender intentionally selects the victim or property because of actual or perceived race, color, religion, national origin, ethnicity, gender, gender identity, disability or sexual orientation. Often called “message crimes.”\nHate incident: biased conduct that doesn’t rise to a crime, like hateful speech. Document it anyway; incidents are often precursors to crimes.\nN.C. doesn’t criminalize “hate crimes” as such; it enhances punishment for certain offenses."},{"l":"hc","o":1,"t":"q","q":"A man shouts racial slurs at a family walking by, but makes no threats and commits no other crime. This is…","a":["A hate incident","A hate crime","Ethnic intimidation"],"c":0,"w":"Hateful speech alone usually isn’t a crime. Document and report it; incidents can show an escalating pattern."},{"l":"hc","o":1,"t":"q","q":"A heterosexual man leaving a building near a gay bar is attacked by teens who assume he’s gay. Can it still be a hate crime?","a":["No, he isn’t in the targeted group","Yes; what matters is the offender’s perception and motive","Only if he reports it as one"],"c":1,"w":"The suspect’s motive based on perception counts, not the victim’s actual identity."},{"l":"hc","o":2,"t":"f","h":"Eight federally protected classes","b":"1. Race/color\n2. National origin/ethnicity\n3. Ancestry\n4. Gender\n5. Sexual orientation\n6. Gender identity\n7. Religion\n8. Disability\nRace is the most common motivation (African Americans are targeted most), followed by national origin/ethnicity.\nN.C. sentence enhancements cover only race, color, religion, nationality and country of origin."},{"l":"hc","o":2,"t":"q","q":"What’s the most common motivation for hate crimes?","a":["Religion","Race","Disability"],"c":1,"w":"National origin/ethnicity is second. Anti-race hate crimes more often involve crimes against persons."},{"l":"hc","o":2,"t":"q","q":"N.C.’s ethnic intimidation law covers bias based on…","a":["Race, color, religion, nationality, or country of origin","All eight federally protected classes","Only race"],"c":0,"w":"Gender, sexual orientation, gender identity and disability are not covered by § 14-401.14. Federal law may still apply."},{"l":"hc","o":3,"t":"f","h":"Four types of hate crime offenders","b":"Thrill-seekers: most common. Small groups of teens, usually no record, peer pressure and bragging rights. Superficial hatred; vandalism, threats, assaults. Most often target sexual orientation.\nReactive/defensive: feel entitled and “defend” their neighborhood, school or job from “outsiders.” Little guilt. People of color most often targeted.\nRetaliatory: “getting even” for a real or rumored attack on their group.\nMission: rarest. Often mentally ill, see the group as evil, may belong to hate groups. Act alone, most likely to kill, and may die by suicide or be killed."},{"l":"hc","o":3,"t":"q","q":"A group of teenagers with no records spray-paint slurs on a synagogue for laughs and bragging rights. Which offender type?","a":["Mission","Thrill-seekers","Retaliatory"],"c":1,"w":"Thrill-seekers are the most common type; their hatred is relatively superficial."},{"l":"hc","o":3,"t":"q","q":"A man repeatedly threatens a new family of a different race on his street, saying they’re “taking over” the neighborhood. Which type?","a":["Reactive/defensive","Thrill-seeker","Mission"],"c":0,"w":"Reactive/defensive offenders act where they live, work or go to school to repel perceived outsiders."},{"l":"hc","o":3,"t":"q","q":"Which offender type is rarest, most likely to commit a deadly attack, and often acts alone?","a":["Retaliatory","Mission","Reactive/defensive"],"c":1,"w":"Mission offenders are also more likely to have a mental illness and ties to a hate group."},{"l":"hc","o":3,"t":"q","q":"After a member of his group is assaulted, a man goes to a neighborhood where the attacker’s group lives and assaults someone at random. This fits…","a":["Retaliatory","Thrill-seeker","Mission"],"c":0,"w":"Retaliatory offenders seek revenge against the group they blame."},{"l":"hc","o":4,"t":"f","h":"Bias indicators","b":"Objective facts suggesting bias motivated the crime, in whole or part:\n– Hate symbols, drawings or graffiti (photograph, then get it removed)\n– Hate flyers, letters or social media posts\n– Slurs or epithets by the suspect (record them verbatim)\n– Objects like hoods or a burning cross\n– Suspect and victim from different groups (not enough alone)\n– Victim or suspect promoting their group\n– Long-standing hostility between groups\n– A date significant to either group\n– Similar incidents nearby\n– Victim far outnumbered in the area\n– Community perceives bias"},{"l":"hc","o":4,"t":"q","q":"A Black man is assaulted by a white man. No slurs, symbols or other signs of bias. Is the difference in race enough to call it a hate crime?","a":["Yes","No; it’s one possible indicator but not enough alone","Only if the victim believes it is"],"c":1,"w":"Investigate the totality of the circumstances."},{"l":"hc","o":4,"t":"q","q":"Why should you record a suspect’s exact words in a possible hate crime?","a":["Verbatim language is critical to proving bias motive","To charge disorderly conduct","It isn’t necessary"],"c":0,"w":"Paraphrasing can lose the slurs or statements that prove motive."},{"l":"hc","o":4,"t":"q","q":"You find a symbol at a crime scene but don’t recognize it. What should you do?","a":["Ignore it","Photograph it and ask the victim or a hate crime or gang expert what it means","Paint over it right away"],"c":1,"w":"The Anti-Defamation League also has a hate symbols database."},{"l":"hc","o":1,"t":"f","h":"Interviewing hate crime victims","b":"Victims may not report because of shame, fear of retaliation, fear of being “outed,” distrust of police, or fear of deportation.\nUse one officer if possible, interview privately, and offer a support person or interpreter.\nGrant reasonable requests for an officer of a particular gender.\nDon’t assume the victim’s identity; respectfully ask.\nAsk why they think it happened without asking directly “Was this a hate crime?” (unless policy requires).\nDon’t confirm or deny it was a hate crime until the investigation is complete. Interview the suspect last."},{"l":"hc","o":5,"t":"f","h":"Ethnic intimidation (§ 14-401.14)","b":"Class 1 misdemeanor: because of race, color, religion, nationality or country of origin, assaulting someone, damaging or defacing their property, or threatening to.\nAlso illegal: assembling to teach techniques for ethnic intimidation.\nThe bias doesn’t have to be about the victim (for example, targeting someone for their spouse’s race).\nEnhancement: a Class 2 or 3 misdemeanor committed for these reasons becomes a Class 1 misdemeanor; a Class A1 or Class 1 misdemeanor becomes a Class H felony."},{"l":"hc","o":5,"t":"q","q":"A man spray-paints racial slurs and “14/88” on his neighbor’s car because the neighbor is in an interracial relationship. Which charge fits?","a":["Ethnic intimidation","Disorderly conduct only","Going armed to the terror of the people"],"c":0,"w":"Defacing property because of race is ethnic intimidation. “14/88” is a white supremacist symbol."},{"l":"hc","o":5,"t":"q","q":"A Class 1 misdemeanor assault is committed because of the victim’s religion. Under N.C. law it becomes…","a":["A Class 2 misdemeanor","A Class H felony","No change"],"c":1,"w":"A1 and Class 1 misdemeanors are elevated to Class H felonies; Class 2 and 3 misdemeanors become Class 1."},{"l":"hc","o":5,"t":"f","h":"Masks and burning crosses","b":"Masks (§ 14-12.7): Class 1 misdemeanor for anyone 16 or older to wear a mask, hood or disguise to conceal identity on public roads, on public property, on another’s premises, or while demonstrating on another’s private property. Exceptions include health and safety, occupation, and holiday costumes in season.\nBurning cross (§ 14-12.12): placing one on another’s property without written permission is a Class 1 misdemeanor. Placing one on another’s property or in any public place to intimidate is a Class H felony."},{"l":"hc","o":5,"t":"q","q":"Someone places a burning cross in front of a family’s home to scare them off the street. The charge is…","a":["Class 1 misdemeanor","Class H felony","Infraction"],"c":1,"w":"With intent to intimidate, it’s a Class H felony. Without permission but without that intent, it’s a Class 1 misdemeanor."},{"l":"hc","o":5,"t":"q","q":"The anti-mask statute applies to people who are at least…","a":["12","16","21"],"c":1,"w":"And there are exceptions, such as health and safety reasons and holiday costumes in season."},{"l":"fn","o":1,"t":"f","h":"Field notes","b":"A shorthand written record officers make from arrival until the assignment is done.\nPurposes: the foundation for reports, capturing details before memory fades, and evidence in court. Original notes go in the case file in all felony cases.\nThey’re discoverable in criminal and civil cases, so don’t write personal information in them, and avoid personal devices.\nUse pen and a pocket notepad with your name and agency, page numbers, dates and topics. Never erase: strike through and initial."},{"l":"fn","o":1,"t":"q","q":"You make a mistake in your field notes. How do you correct it?","a":["Erase it","Draw a line through it and initial it","Tear out the page"],"c":1,"w":"Field notes are subject to discovery. Erasures or missing pages hurt credibility."},{"l":"fn","o":2,"t":"f","h":"Five uses for reports","b":"1. Accountability: documenting agency and officer actions\n2. Performance: evaluating agencies and officers\n3. Transparency: parts are public record\n4. Court proceedings: refreshing your memory and serving as evidence\n5. Statistics and analysis: spotting crime trends by time, place, person and M.O."},{"l":"fn","o":3,"t":"f","h":"Characteristics of credible reports","b":"Factual: conclusions supported by documented facts.\nAccurate: free of errors.\nObjective: everyone’s perspective, no unsupported opinions, and never omit facts unfavorable to the case.\nOrganized: logical and chronological.\nComplete: who, what, where, when, why and how, ending with actions taken and follow-up needed.\nClear: everyday words.\nConcise: no wordiness or redundancy.\nConsistent: standard formats."},{"l":"fn","o":3,"t":"q","q":"A fact you found might help the defense. What should you do in your report?","a":["Leave it out","Include it; objective reports never omit unfavorable facts","Put it in your notes only"],"c":1,"w":"Omitting facts compromises your integrity and the whole report."},{"l":"fn","o":4,"t":"f","h":"Dates, times and people","b":"Data fields: 8-digit dates (01/08/2020) and 24-hour time (1300 hours).\nNarratives: 12-hour time with the day of the week (“At 7:15 p.m. on Saturday, June 15, 2020”).\nIntroduce people by full name and role once, then use last names. Don’t keep calling someone just “the suspect.”\nUse age in whole years, not a date of birth (“Mr. Andy McMillan, 51”). Unknown adults: decade ranges (20–29); under 20: three-year ranges.\nUse “man,” “woman,” “boy,” “girl” instead of “male/female.” Give height and weight in numbers, not “tall” or “stocky.”\nDescribe clothing top to bottom."},{"l":"fn","o":4,"t":"q","q":"Which is the best way to describe a person in a narrative?","a":["“A male, D.O.B. 02/21/1969, walking down the road”","“Mr. Andy McMillan, 51, walking down the road”","“An older guy walking down the road”"],"c":1,"w":"Whole-year ages are easier to follow. The 8-digit D.O.B. belongs in data fields."},{"l":"fn","o":4,"t":"q","q":"You don’t know a suspect’s exact age; he looks about 25. How should you write it?","a":["“A young man”","“A 20–29-year-old man”","“A 25-year-old male”"],"c":1,"w":"Use decade ranges for adults. Vague words like young or middle-aged aren’t useful."},{"l":"fn","o":4,"t":"q","q":"Which description of a person’s condition is best?","a":["“Mr. Smith was highly intoxicated.”","“Mr. Smith couldn’t stand without leaning on his car, and I smelled alcohol from 10 feet away.”","“Mr. Smith is a drunk I deal with all the time.”"],"c":1,"w":"Describe what you observed instead of conclusions like intoxicated, upset or angry."},{"l":"fn","o":5,"t":"f","h":"Writing the narrative","b":"First person (“I”), past tense, active voice (“I handcuffed Mr. Smith,” not “Mr. Smith was handcuffed by me”).\nChronological, with sections such as Introduction, Background, Evidence, Interviews, Arrest, Follow-up.\nShort sentences; no more than about nine sentences per paragraph; never all capital letters.\nSpell out an abbreviation the first time: “Driving While Impaired (D.W.I.).”\nPut verbatim statements in quotation marks, and write down follow-up questions you asked."},{"l":"fn","o":5,"t":"q","q":"Which sentence uses active voice?","a":["“Mr. Smith was handcuffed by me.”","“I handcuffed Mr. Smith.”","“Mr. Smith was handcuffed.”"],"c":1,"w":"In active voice, the person doing the action comes first. It’s clearer and shorter."},{"l":"fn","o":5,"t":"q","q":"Which is more detailed and useful in a report?","a":["“Mr. Smith became agitated and took an aggressive posture.”","“Mr. Smith clenched both fists and said, ‘I am not going to jail!’”","“Mr. Smith acted aggressive.”"],"c":1,"w":"Describe actions and quote words; don’t state conclusions."},{"l":"fn","o":6,"t":"f","h":"The case file (§ 15A-903)","b":"Law enforcement must give the prosecutor the complete file, which the defense can get on motion.\nThe “file” includes the defendant’s statements, co-defendants’ statements, witness statements, officers’ notes, test and exam results, and all other evidence, including preliminary results and bench notes.\nWillfully omitting or misrepresenting required information is a Class H felony. Notebooks are also discoverable in civil cases."},{"l":"fn","o":6,"t":"q","q":"Which of these is part of the law enforcement “file” under § 15A-903?","a":["Investigating officers’ notes","Only the final typed report","Nothing written before the arrest"],"c":0,"w":"Also witness statements, defendant and co-defendant statements, and test results."},{"l":"fn","o":7,"t":"f","h":"Public records (§ 132-1)","b":"Criminal investigation and intelligence records are generally not public records, though a court can order release.\nBut these are public:\n– The time, date, location and nature of a reported crime\n– The name, sex, age, address, employment and charge of a person arrested, charged or indicted\n– Circumstances of an arrest: time, place, resistance, weapons, pursuit, items seized\n– Contents of 911 calls (identifying cal
