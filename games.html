<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PATROLscroller Games</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14181f;--sub:#5b6472;--line:#d5d9e0;--acc:#1f4fa8;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#1a1f29;--ink:#eef1f6;--sub:#a5aebc;--line:#2e3542;--acc:#8fb0ff;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;width:100%;max-width:360px}
h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:-.01em}p{margin:0 0 18px;color:var(--sub)}
input[type=password]{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--acc);outline-offset:1px}
label{display:flex;gap:8px;align-items:center;margin:12px 0 16px;color:var(--sub);font-size:.95rem}
button{width:100%;font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--acc);color:var(--card);cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);min-height:1.4em;margin:10px 0 0;font-size:.95rem}
</style></head><body>
<div class="box">
<h1>PATROLscroller Games</h1>
<p>Enter the class password to start studying.</p>
<input id="pw" type="password" autocomplete="current-password" aria-label="Password" autofocus>
<label><input id="rem" type="checkbox" checked> Remember on this device</label>
<button id="go">Unlock</button>
<div class="err" id="err" role="alert"></div>
</div>

const KEY="patrolscroller-pass", AK="patrolscroller-access";
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function access(){   // the site key, locked with the current student password (changed from the admin page)
  let a=null;
  try{ const r=await fetch("access.json?t="+Date.now(),{cache:"no-store"}); if(r.ok){ a=await r.json(); try{localStorage.setItem(AK,JSON.stringify(a));}catch(_){} } }catch(_){}
  if(!a){ try{ a=JSON.parse(localStorage.getItem(AK)); }catch(_){} }
  if(!a){ const e=new Error("offline"); e.offline=true; throw e; }
  return a;
}
async function unlock(p){
  const a=await access();
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(a.s),iterations:a.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(a.i)},k,u(a.c));
  const site=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},site,u(D.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
async function attempt(p,remember){
  const b=document.getElementById("go"),e=document.getElementById("err");
  b.disabled=true;b.textContent="Unlocking…";e.textContent="";
  try{const h=await unlock(p);
    try{ if(remember) localStorage.setItem(KEY,p); else localStorage.removeItem(KEY);}catch(_){}
    show(h);
  }catch(err){
    b.disabled=false;b.textContent="Unlock";
    if(err&&err.offline){ e.textContent="Couldn’t reach the site. Check your connection and try again."; return; }
    try{localStorage.removeItem(KEY);}catch(__){}
    e.textContent="That password didn’t work. If it changed, ask your instructor for the new one.";
    document.getElementById("pw").select();
  }
}
document.getElementById("go").onclick=()=>attempt(document.getElementById("pw").value.trim(),document.getElementById("rem").checked);
document.getElementById("pw").addEventListener("keydown",ev=>{if(ev.key==="Enter")document.getElementById("go").click();});
(async()=>{let s=null;try{s=localStorage.getItem(KEY);}catch(_){}
  if(s){document.getElementById("pw").value=s;attempt(s,true);}})();
</script></body></html>
